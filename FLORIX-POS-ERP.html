        const rows = S.state.products.map(p => { const q = ws.reduce((s, w) => s + I.onHand(p.id, w.id), 0); const v = ws.reduce((s, w) => s + I.valueOf(p.id, w.id), 0); const br = wh ? S.get('warehouses', wh).branchId : sc; return { p, q, v, r: I.reserved(p.id, br), t: I.inTransit(p.id, br) }; });
        body = `<div class="card">${UI.table({ id: 'stT', search: true, exportName: 'أرصدة-المخزون', tools: `<select class="input sm" style="width:auto" data-change="wh" aria-label="المستودع"><option value="">كل المستودعات</option>${whs.map(w => `<option value="${w.id}" ${w.id === wh ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}</select>`, cols: [
          { label: 'الكود', render: r => `<span class="num">${r.p.code}</span>` }, { label: 'الصنف', render: r => `<button class="btn ghost sm" style="padding:0 4px;height:auto" data-act="card" data-id="${r.p.id}">${esc(r.p.nameAr)}</button>` },
          { label: 'المتاح', num: 1, render: r => qty(r.q) }, { label: 'المحجوز', num: 1, render: r => qty(r.r) }, { label: 'المتاح للبيع', num: 1, render: r => qty(Math.max(0, r.q - r.r)) }, { label: 'بالطريق', num: 1, render: r => qty(r.t) },
          { label: 'الحد الأدنى', num: 1, render: r => qty(r.p.min) }, { label: 'متوسط التكلفة', num: 1, render: r => money(r.q > 0 ? Math.round(r.v / r.q) : r.p.cost) }, { label: 'القيمة', num: 1, render: r => money(r.v) },
          { label: 'الحالة', render: r => r.q <= 0 ? '<span class="pill bad">نفد</span>' : r.q <= r.p.min ? '<span class="pill warn">منخفض</span>' : r.q > r.p.max * (ws.length) ? '<span class="pill info">فوق الحد</span>' : '<span class="pill ok">جيد</span>' }],
          rows, foot: ['', 'الإجمالي', '', '', '', '', '', '', money(rows.reduce((s, r) => s + r.v, 0)), ''] })}</div>`;
      } else if (t === 'transfers') {
        const tr = S.state.transfers.filter(x => !sc || S.get('warehouses', x.fromWh).branchId === sc || S.get('warehouses', x.toWh).branchId === sc).slice().reverse();
        body = `<div class="card">${UI.table({ id: 'trT', exportName: 'التحويلات', tools: AU.can('inv.transfer') ? `<button class="btn pri sm" data-act="newTransfer">${icon('plus')}تحويل جديد</button>` : '', cols: [
          { label: 'الرقم', render: x => `<span class="num">${x.number}</span>` }, { label: 'التاريخ', render: x => `<span class="num">${x.date}</span>` }, { label: 'من', render: x => esc(S.get('warehouses', x.fromWh).name) }, { label: 'إلى', render: x => esc(S.get('warehouses', x.toWh).name) },
          { label: 'الأصناف', render: x => x.lines.map(l => `${esc(S.get('products', l.pid).nameAr)} × ${M.fmtQty(l.qty)}`).join('<br>') }, { label: 'القيمة', num: 1, render: x => money(x.total) },
          { label: 'الحالة', render: x => x.status === 'in_transit' ? '<span class="pill warn">بالطريق</span>' : `<span class="pill ok">مستلم ${x.receivedAt || ''}</span>` },
          { label: '', render: x => x.status === 'in_transit' && AU.can('inv.transfer') ? `<button class="btn sm pri" data-act="recvTransfer" data-id="${x.id}">استلام</button>` : '' }], rows: tr, empty: 'لا توجد تحويلات.' })}
          <div class="card-b muted small">عند الإرسال: تُخصم الكمية من المستودع المرسل وتُقيّد في حساب «بضاعة بالطريق» للفرع المستلم. عند الاستلام: تُضاف للمستودع المستلم بنفس التكلفة.</div></div>`;
      } else if (t === 'counts') {
        body = `<div class="card">${UI.table({ id: 'scT', exportName: 'الجرد', tools: AU.can('inv.adjust') ? `<button class="btn pri sm" data-act="newCount">${icon('plus')}جرد جديد</button>` : '', cols: [
          { label: 'الرقم', render: c => `<span class="num">${c.number}</span>` }, { label: 'التاريخ', render: c => `<span class="num">${c.date}</span>` }, { label: 'المستودع', render: c => esc(S.get('warehouses', c.wh).name) },
          { label: 'أصناف معدودة', num: 1, render: c => c.lines.length }, { label: 'أصناف بفروقات', num: 1, render: c => c.lines.filter(l => l.diff).length },
          { label: 'زيادة', num: 1, render: c => money(c.gain, 'ok-t') }, { label: 'عجز', num: 1, render: c => money(c.loss, 'bad-t') }, { label: '', render: c => `<button class="btn sm ghost" data-act="viewCount" data-id="${c.id}">${icon('eye')}</button>` }],
          rows: S.state.counts.filter(c => !sc || c.branchId === sc).slice().reverse(), empty: 'لا توجد عمليات جرد.' })}</div>`;
      } else if (t === 'damage') {
        body = `<div class="card">${UI.table({ id: 'dmT', exportName: 'التالف', tools: AU.can('inv.adjust') ? `<button class="btn pri sm" data-act="newDamage">${icon('plus')}تسجيل تالف</button>` : '', cols: [
          { label: 'الرقم', render: d => `<span class="num">${d.number}</span>` }, { label: 'التاريخ', render: d => `<span class="num">${d.date}</span>` }, { label: 'المستودع', render: d => esc(S.get('warehouses', d.wh).name) },
          { label: 'الصنف', render: d => esc(S.get('products', d.pid).nameAr) }, { label: 'الكمية', num: 1, render: d => qty(d.qty) }, { label: 'التكلفة', num: 1, render: d => money(d.cost) }, { label: 'السبب', k: 'reason' }],
          rows: S.state.damages.filter(d => !sc || S.get('warehouses', d.wh).branchId === sc).slice().reverse(), empty: 'لا توجد أصناف تالفة مسجلة.' })}</div>`;
      } else if (t === 'valuation') {
        const rows = S.state.products.map(p => { const q = whs.reduce((s, w) => s + I.onHand(p.id, w.id), 0); const v = whs.reduce((s, w) => s + I.valueOf(p.id, w.id), 0); return { p, q, v, retail: Math.round(p.price * q) }; }).filter(r => r.q);
        const tv = rows.reduce((s, r) => s + r.v, 0), tr = rows.reduce((s, r) => s + r.retail, 0);
        const gl = Florix.Acc.balance('1105', { branchId: sc });
        body = `<div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="kpi hl"><span class="lbl">قيمة المخزون بالتكلفة</span><span class="val">${M.fmt(tv)}</span><span class="sub">${S.state.settings.costMethod === 'FIFO' ? 'FIFO' : 'المتوسط المرجح'}</span></div>
          <div class="kpi"><span class="lbl">رصيد حساب المخزون</span><span class="val">${M.fmt(gl)}</span><span class="sub">${gl === tv ? '<span class="ok-t">مطابق للحركات</span>' : '<span class="warn-t">الفرق ' + M.fmt(gl - tv) + ' (تحويلات بين الفروع)</span>'}</span></div>
          <div class="kpi"><span class="lbl">القيمة بسعر البيع</span><span class="val">${M.fmt(tr)}</span><span class="sub">قبل الضريبة</span></div><div class="kpi"><span class="lbl">الربح الكامن</span><span class="val">${M.fmt(tr - tv)}</span><span class="sub">${tr ? ((tr - tv) * 100 / tr).toFixed(1) : 0}%</span></div></div>
          <div class="card">${UI.table({ id: 'valT', search: true, exportName: 'تقييم-المخزون', cols: [{ label: 'الصنف', render: r => esc(r.p.nameAr) }, { label: 'الكمية', num: 1, render: r => qty(r.q) }, { label: 'متوسط التكلفة', num: 1, render: r => money(Math.round(r.v / r.q)) }, { label: 'القيمة بالتكلفة', num: 1, render: r => money(r.v) }, { label: 'سعر البيع', num: 1, render: r => money(r.p.price) }, { label: 'القيمة بالبيع', num: 1, render: r => money(r.retail) }], rows,
            foot: ['الإجمالي', '', '', money(tv), '', money(tr)] })}</div>`;
      } else if (t === 'batches') {
        const rows = whs.flatMap(w => S.state.products.filter(p => p.trackBatch).flatMap(p => I.batches(p.id, w.id).map(b => ({ ...b, p, w })))).sort((a, b) => (a.expiry || '9').localeCompare(b.expiry || '9'));
        const today = S.today();
        body = `<div class="card">${UI.table({ id: 'btT', search: true, exportName: 'الدفعات', cols: [{ label: 'الصنف', render: r => esc(r.p.nameAr) }, { label: 'المستودع', render: r => esc(r.w.name) }, { label: 'الدفعة', render: r => `<span class="num">${esc(r.batch || '—')}</span>` },
          { label: 'تاريخ الإدخال', render: r => `<span class="num">${r.date}</span>` }, { label: 'الصلاحية', render: r => `<span class="num">${r.expiry || '—'}</span>` }, { label: 'الكمية', num: 1, render: r => qty(r.qty) },
          { label: 'الحالة', render: r => !r.expiry ? '' : r.expiry < today ? '<span class="pill bad">منتهية</span>' : r.expiry <= Florix.Acc.prevDay(addDays(today, 11)) ? '<span class="pill warn">قريبة الانتهاء</span>' : '<span class="pill ok">صالحة</span>' }], rows })}
          <div class="card-b muted small">يُصرف من الدفعة الأقرب انتهاءً أولًا (FEFO) للأصناف التي تُتتبع دفعاتها.</div></div>`;
      } else {
        const ms = S.state.stockMoves.filter(m => !sc || S.get('warehouses', m.wh).branchId === sc).slice(-300).reverse();
        body = `<div class="card">${UI.table({ id: 'mvAll', search: true, exportName: 'حركات-المخزون', cols: [{ label: 'التاريخ', render: m => `<span class="num">${m.date}</span>` }, { label: 'النوع', render: m => typeLabel(m.type) }, { label: 'المستند', render: m => `<span class="num">${esc(m.ref.no)}</span>` },
          { label: 'الصنف', render: m => esc(S.get('products', m.pid).nameAr) }, { label: 'المستودع', render: m => esc(S.get('warehouses', m.wh).name) }, { label: 'الكمية', num: 1, render: m => `<span class="num ${m.qty < 0 ? 'bad-t' : 'ok-t'}">${M.fmtQty(m.qty)}</span>` }, { label: 'التكلفة', num: 1, render: m => money(m.cost) }],
          rows: ms })}<div class="card-b muted small">آخر 300 حركة. التقارير تتيح التصفية بالفترة.</div></div>`;
      }
      return tabs + body;
    },
    actions: {
      wh(el) { V.inventory.state.wh = el.value; app().render(); },
      card(el) { productCard(S.get('products', el.dataset.id)); },
      newTransfer() { linesModal({ title: 'تحويل مخزني جديد', head: [{ name: 'fromWh', label: 'من مستودع', type: 'select', options: whOpts() }, { name: 'toWh', label: 'إلى مستودع', type: 'select', value: S.state.warehouses[2].id, options: whOpts() }],
        onSave: (v, lines) => { const t = O.transferSend({ fromWh: v.fromWh, toWh: v.toWh, lines }); UI.toast('أُرسل التحويل ' + t.number, 'ok'); app().render(); } }); },
      recvTransfer(el) { const t = O.transferReceive(el.dataset.id); UI.toast('استُلم التحويل ' + t.number, 'ok'); app().render(); },
      newCount() {
        const sc = app().scope();
        UI.formModal({ title: 'جرد جديد — اختيار المستودع', fields: [{ name: 'wh', label: 'المستودع', type: 'select', options: whOpts(w => !sc || w.branchId === sc) }, { name: 'cat', label: 'التصنيف', type: 'select', options: [['all', 'كل الأصناف']].concat(S.state.categories.map(c => [c.id, c.name])) }],
          saveLabel: 'بدء الجرد', onSave(v) {
            const ps = S.state.products.filter(p => v.cat === 'all' || p.categoryId === v.cat);
            UI.modal({ title: 'ورقة الجرد — ' + S.get('warehouses', v.wh).name, wide: true, body: `<p class="muted small" style="margin:0">أدخل الكمية الفعلية بعد العد. الأصناف التي تُترك كما هي لا تولّد تسوية.</p>${UI.table({ cols: [{ label: 'الصنف', render: p => esc(p.nameAr) }, { label: 'رصيد النظام', num: 1, render: p => qty(I.onHand(p.id, v.wh)) }, { label: 'الكمية الفعلية', render: p => `<input class="input sm num-in" style="width:100px" data-cnt="${p.id}" value="${M.fmtQty(I.onHand(p.id, v.wh))}" aria-label="الكمية الفعلية">` }], rows: ps })}<label class="field"><span>ملاحظات</span><input class="input" id="cntNote"></label>`,
              actions: [{ label: 'ترحيل التسويات', cls: 'pri', onClick: (close, el) => {
                const counts = []; el.querySelectorAll('[data-cnt]').forEach(i => { const q = M.qty(i.value); if (isNaN(q) || q < 0) throw new Error('كمية غير صالحة.'); if (Math.abs(q - I.onHand(i.dataset.cnt, v.wh)) > 1e-9) counts.push({ pid: i.dataset.cnt, counted: q }); });
                const c = O.stockCount({ wh: v.wh, counts, note: el.querySelector('#cntNote').value }); close(); UI.toast(`رُحّل الجرد ${c.number}: ${c.lines.length} فرق.`, 'ok'); app().render();
              } }, { label: 'إلغاء', onClick: c => c() }] });
          } });
      },
      viewCount(el) { const c = S.get('counts', el.dataset.id); UI.modal({ title: 'الجرد ' + c.number, wide: true, body: UI.table({ cols: [{ label: 'الصنف', render: l => esc(S.get('products', l.pid).nameAr) }, { label: 'النظام', num: 1, render: l => qty(l.system) }, { label: 'الفعلي', num: 1, render: l => qty(l.counted) }, { label: 'الفرق', num: 1, render: l => `<span class="num ${l.diff < 0 ? 'bad-t' : 'ok-t'}">${M.fmtQty(l.diff)}</span>` }, { label: 'القيمة', num: 1, render: l => money(l.value) }], rows: c.lines, empty: 'لا فروقات.' }) }); },
      newDamage() {
        const sc = app().scope();
        UI.formModal({ title: 'تسجيل أصناف تالفة', fields: [{ name: 'wh', label: 'المستودع', type: 'select', options: whOpts(w => !sc || w.branchId === sc) }, { name: 'pid', label: 'الصنف', type: 'select', options: prodOpts() }, { name: 'qty', label: 'الكمية', type: 'number', value: 1 }, { name: 'reason', label: 'السبب', value: 'انتهاء صلاحية' }],
          onSave(v) { O.damage({ wh: v.wh, pid: v.pid, qty: M.qty(v.qty), reason: v.reason }); UI.toast('سُجل التالف ورُحّل قيده.', 'ok'); app().render(); } });
      }
    }
  };
  function addDays(d, n) { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return S.today(x); }

  /** نافذة مستند بسطور أصناف (مشتركة) */
  function linesModal({ title, head, onSave, withPrice, priceOf }) {
    const rowHtml = () => `<div class="row" data-ln><select class="input sm" style="flex:3" data-k="pid" aria-label="الصنف">${prodOpts().map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select><input class="input sm num-in" style="flex:1" data-k="qty" value="1" aria-label="الكمية">${withPrice ? `<input class="input sm num-in" style="flex:1" data-k="price" placeholder="السعر" aria-label="السعر">` : ''}<button type="button" class="btn sm ghost icon" data-del aria-label="حذف">${icon('trash')}</button></div>`;
    UI.modal({ title, wide: true, body: UI.fields(head || []) + `<div class="row between"><b class="small">الأصناف</b><button type="button" class="btn sm" data-addln>${icon('plus')}سطر</button></div><div data-lns style="display:flex;flex-direction:column;gap:6px">${rowHtml()}</div>`,
      actions: [{ label: 'حفظ', cls: 'pri', icon: 'check', onClick: (close, el) => {
        const v = {}; el.querySelectorAll('.form-grid [name]').forEach(i => v[i.name] = i.type === 'checkbox' ? i.checked : i.value);
        const lines = Array.from(el.querySelectorAll('[data-ln]')).map(r => { const o = { pid: r.querySelector('[data-k=pid]').value, qty: M.qty(r.querySelector('[data-k=qty]').value) }; const pr = r.querySelector('[data-k=price]'); if (pr && pr.value) o.price = M.toH(pr.value); return o; }).filter(l => l.qty > 0);
        if (!lines.length) throw new Error('أضف سطرًا واحدًا على الأقل بكمية صحيحة.');
        onSave(v, lines); close();
      } }, { label: 'إلغاء', onClick: c => c() }],
      onOpen(el) {
        el.querySelector('[data-addln]').onclick = () => el.querySelector('[data-lns]').insertAdjacentHTML('beforeend', rowHtml());
        el.addEventListener('click', e => { const d = e.target.closest('[data-del]'); if (d && el.querySelectorAll('[data-ln]').length > 1) d.closest('[data-ln]').remove(); });
        if (priceOf) el.addEventListener('change', e => { const r = e.target.closest('[data-ln]'); if (r && e.target.dataset.k === 'pid') { const pr = r.querySelector('[data-k=price]'); if (pr) pr.value = M.plain(priceOf(e.target.value)); } });
        if (priceOf) el.querySelectorAll('[data-ln]').forEach(r => { const pr = r.querySelector('[data-k=price]'); if (pr) pr.value = M.plain(priceOf(r.querySelector('[data-k=pid]').value)); });
        if (priceOf) el.querySelector('[data-addln]').addEventListener('click', () => { const r = Array.from(el.querySelectorAll('[data-ln]')).pop(); r.querySelector('[data-k=price]').value = M.plain(priceOf(r.querySelector('[data-k=pid]').value)); });
      } });
  }
  V.linesModal = linesModal;
})(window);

</script>
<script>
/* FLORIX فلوريكس — المشتريات، المبيعات، العملاء، الموردون */
(function (root) {
  'use strict';
  const Florix = root.Florix; const V = Florix.Views = Florix.Views || {};
  const S = Florix.Store, M = Florix.Money, UI = Florix.UI, O = Florix.Ops, AU = Florix.Auth, Z = Florix.Zatca, A = Florix.Acc;
  const { icon, esc, money, qty } = UI;
  const app = () => Florix.App;
  const nm = (coll, id) => esc((S.get(coll, id) || {}).name || '—');

  /* ================= المشتريات ================= */
  const STAGES = [['PR', 'طلبات الشراء'], ['RFQ', 'عروض الأسعار'], ['PO', 'أوامر الشراء'], ['GRN', 'استلام المخزون'], ['PINV', 'فواتير الموردين'], ['PRET', 'مرتجعات المشتريات']];
  const ST_LABEL = { open: ['مفتوح', 'info'], converted: ['محوّل', ''], pending_approval: ['بانتظار الاعتماد', 'warn'], approved: ['معتمد', 'ok'], partial: ['جزئي', 'warn'], received: ['مستلم', 'ok'], uninvoiced: ['غير مفوتر', 'warn'], invoiced: ['مفوتر', 'ok'], unpaid: ['غير مسدد', 'bad'], paid: ['مسدد', 'ok'], posted: ['مرحّل', 'ok'] };
  const stPill = s => { const x = ST_LABEL[s] || [s, '']; return `<span class="pill ${x[1]}">${x[0]}</span>`; };
  const docTotal = d => d.total !== undefined ? d.total : M.sum(d.lines, l => l.net + (l.vat || 0));

  V.purchases = {
    title: 'المشتريات', icon: 'truck', perm: 'scr.purchases', state: { stage: 'PO' },
    render() {
      const sc = app().scope(); const docs = S.state.purchaseDocs.filter(d => !sc || d.branchId === sc);
      const active = { PR: d => d.status === 'open', RFQ: d => d.status === 'open', PO: d => ['pending_approval', 'approved', 'partial'].includes(d.status), GRN: d => d.status === 'uninvoiced', PINV: d => d.status !== 'paid', PRET: () => false };
      const cur = this.state.stage;
      const pipe = `<div class="pipe">${STAGES.map(([k, l], i) => `<button class="pipe-s ${k === cur ? 'on' : ''}" data-act="stage" data-v="${k}"><div class="c">${docs.filter(d => d.stage === k && active[k](d)).length}</div><div class="l">${i < 5 ? (i + 1) + '. ' : ''}${l}</div></button>`).join('')}</div>`;
      const list = docs.filter(d => d.stage === cur).slice().reverse();
      const actionsFor = d => {
        const b = [];
        if (d.stage === 'PR' && d.status === 'open' && AU.can('pur.create')) b.push(`<button class="btn sm pri" data-act="toRFQ" data-id="${d.id}">عرض سعر</button>`);
        if (d.stage === 'RFQ' && d.status === 'open' && AU.can('pur.create')) b.push(`<button class="btn sm pri" data-act="toPO" data-id="${d.id}">أمر شراء</button>`);
        if (d.stage === 'PO' && d.status === 'pending_approval' && AU.can('pur.approve')) b.push(`<button class="btn sm pri" data-act="approve" data-id="${d.id}">${icon('check')}اعتماد</button>`);
        if (d.stage === 'PO' && ['approved', 'partial'].includes(d.status) && AU.can('pur.create')) b.push(`<button class="btn sm pri" data-act="receive" data-id="${d.id}">استلام</button>`);
        if (d.stage === 'GRN' && d.status === 'uninvoiced' && AU.can('pur.create')) b.push(`<button class="btn sm pri" data-act="pinv" data-id="${d.id}">فاتورة المورد</button>`);
        if (d.stage === 'PINV' && d.status !== 'paid' && AU.can('pur.pay')) b.push(`<button class="btn sm pri" data-act="pay" data-id="${d.id}">سداد</button>`);
        if (d.stage === 'PINV' && AU.can('pur.create')) b.push(`<button class="btn sm" data-act="pret" data-id="${d.id}">مرتجع</button>`);
        b.push(`<button class="btn sm ghost icon" data-act="view" data-id="${d.id}" aria-label="عرض">${icon('eye')}</button>`);
        return `<div class="row" style="flex-wrap:nowrap">${b.join('')}</div>`;
      };
      const cols = [{ label: 'الرقم', render: d => `<span class="num">${d.number}</span>` }, { label: 'التاريخ', render: d => `<span class="num">${d.date}</span>` }, { label: 'الفرع', render: d => esc(S.get('branches', d.branchId).code) },
        { label: 'المورد', render: d => d.supplierId ? nm('suppliers', d.supplierId) : '<span class="muted">—</span>' }, { label: 'الأصناف', num: 1, render: d => d.lines.length },
        { label: 'الإجمالي شامل الضريبة', num: 1, render: d => money(docTotal(d)) }];
      if (cur === 'PINV') cols.push({ label: 'المسدد', num: 1, render: d => money(d.paid + d.returned) }, { label: 'المتبقي', num: 1, render: d => money(d.total - d.paid - d.returned, 'bad-t') }, { label: 'مرجع المورد', render: d => `<span class="num">${esc(d.supplierRef)}</span>` });
      cols.push({ label: 'الحالة', render: d => stPill(d.status) }, { label: '', render: actionsFor });

        }
      }
    };
  }
  function partyForm(kind, p, done) {
    const isC = kind === 'customer'; const a = (p && p.address) || {};
    const f = [{ name: 'name', label: 'الاسم', value: p && p.name }, { name: 'vat', label: 'الرقم الضريبي (اختياري، 15 رقمًا)', value: p && p.vat, attrs: 'maxlength="15" inputmode="numeric"' }, { name: 'phone', label: 'الجوال/الهاتف', value: p && p.phone }];

  V.partyForm = partyForm;
  V.customers = partyView('customer');

      `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الحساب</th><th>مدين</th><th>دائن</th><th>مركز التكلفة</th><th>بيان</th><th></th></tr></thead><tbody data-jb>${row()}${row()}</tbody>
      <tfoot><tr><td>الإجمالي</td><td class="num" data-tdr>0.00</td><td class="num" data-tcr>0.00</td><td colspan="3" data-bal></td></tr></tfoot></table></div><button type="button" class="btn sm" data-add>${icon('plus')}سطر</button>`,

        const v = UI.read(el.querySelector('.form-grid'));

        if (lines.some(l => isNaN(l.dr) || isNaN(l.cr))) throw new Error('مبالغ غير صالحة.');

  function trialCard(from, to, sc) {
    const tb = A.trialBalance({ from, to, branchId: sc });
    return `<div class="card"><div class="card-h"><h2>ميزان المراجعة</h2>${tb.balanced ? '<span class="pill ok">متوازن</span>' : '<span class="pill bad">غير متوازن</span>'}</div>${UI.table({ id: 'tbT', search: true, exportName: 'ميزان-المراجعة', cols: [
      { label: 'الرمز', render: r => `<span class="num">${r.code}</span>` }, { label: 'الحساب', k: 'name' },
      { label: 'افتتاحي مدين', num: 1, render: r => money(r.od) }, { label: 'افتتاحي دائن', num: 1, render: r => money(r.oc) }, { label: 'حركة مدين', num: 1, render: r => money(r.md) }, { label: 'حركة دائن', num: 1, render: r => money(r.mc) },
      { label: 'ختامي مدين', num: 1, render: r => money(r.cd) }, { label: 'ختامي دائن', num: 1, render: r => money(r.cc) }], rows: tb.rows,
      foot: ['', 'الإجمالي', money(tb.totals.od), money(tb.totals.oc), money(tb.totals.md), money(tb.totals.mc), money(tb.totals.cd), money(tb.totals.cc)] })}</div>`;
  }

  /* ================= التقارير ================= */
  const R = {};
  const inRange = (d, f) => d >= f.from && d <= f.to;
  const docs = f => S.state.invoices.filter(i => inRange(i.date, f) && (!f.branchId || i.branchId === f.branchId) && (!f.userId || i.userId === f.userId));
  const sg = d => d.kind === 'credit' ? -1 : 1;
  function groupSales(f, keyFn, labelFn) {
    const g = {};
    for (const d of docs(f)) {
      const k = keyFn(d); const r = g[k] || (g[k] = { k, label: labelFn ? labelFn(k, d) : k, count: 0, gross: 0, returns: 0, net: 0, vat: 0, cost: 0 });
      if (d.kind === 'invoice') { r.count++; r.gross += d.totals.total; } if (d.kind === 'credit') r.returns += d.totals.total;
      r.net += sg(d) * d.totals.net; r.vat += sg(d) * d.totals.vat; r.cost += sg(d) * (d.totals.cost || 0);
    }
    return Object.values(g).sort((a, b) => String(a.k).localeCompare(String(b.k)));
  }
  const salesCols = first => [first, { label: 'الفواتير', num: 1, render: r => `<span class="num">${r.count}</span>` }, { label: 'المبيعات شامل الضريبة', num: 1, render: r => money(r.gross) }, { label: 'المرتجعات', num: 1, render: r => money(r.returns) },
    { label: 'صافي المبيعات', num: 1, render: r => money(r.net) }, { label: 'الضريبة', num: 1, render: r => money(r.vat) }, { label: 'التكلفة', num: 1, render: r => money(r.cost) }, { label: 'مجمل الربح', num: 1, render: r => money(r.net - r.cost) }];
  const salesFoot = rows => ['الإجمالي', `<span class="num">${M.sum(rows, r => r.count)}</span>`, money(M.sum(rows, r => r.gross)), money(M.sum(rows, r => r.returns)), money(M.sum(rows, r => r.net)), money(M.sum(rows, r => r.vat)), money(M.sum(rows, r => r.cost)), money(M.sum(rows, r => r.net - r.cost))];

  const REPORTS = [
    ['المبيعات', 'rpt.sales', [
      ['daily', 'المبيعات اليومية', f => { const rows = groupSales(f, d => d.date); return { cols: salesCols({ label: 'اليوم', render: r => `<span class="num">${r.k}</span>` }), rows, foot: salesFoot(rows), chart: UI.lineChart(rows.map(r => ({ label: r.k.slice(5), value: r.net })), { h: 180 }) }; }],
      ['monthly', 'المبيعات الشهرية', f => { const rows = groupSales(f, d => d.date.slice(0, 7)); return { cols: salesCols({ label: 'الشهر', render: r => `<span class="num">${r.k}</span>` }), rows, foot: salesFoot(rows), chart: UI.barChart(rows.map(r => ({ label: r.k, values: [r.net, r.net - r.cost] })), ['صافي المبيعات', 'مجمل الربح'], { h: 180 }) }; }],
      ['branch', 'المبيعات حسب الفرع', f => { const rows = groupSales(f, d => d.branchId, k => S.get('branches', k).name); return { cols: salesCols({ label: 'الفرع', k: 'label' }), rows, foot: salesFoot(rows), chart: UI.barChart(rows.map(r => ({ label: S.get('branches', r.k).code, values: [r.net] })), ['صافي المبيعات'], { h: 160 }) }; }],
      ['item', 'المبيعات حسب الصنف', f => {
        const g = {}; for (const d of docs(f)) for (const l of d.lines) { if (!l.pid) continue; const r = g[l.pid] || (g[l.pid] = { p: S.get('products', l.pid), qty: 0, net: 0, cost: 0 }); r.qty += sg(d) * l.qty * (l.factor || 1); r.net += sg(d) * l.net; r.cost += sg(d) * (l.cost || 0); }
        const rows = Object.values(g).sort((a, b) => b.net - a.net);
        return { cols: [{ label: 'الصنف', render: r => esc(r.p.nameAr) }, { label: 'الكمية', num: 1, render: r => qty(r.qty) }, { label: 'صافي المبيعات', num: 1, render: r => money(r.net) }, { label: 'التكلفة', num: 1, render: r => money(r.cost) }, { label: 'مجمل الربح', num: 1, render: r => money(r.net - r.cost) }, { label: 'الهامش', num: 1, render: r => `<span class="num">${r.net ? ((r.net - r.cost) * 100 / r.net).toFixed(1) : 0}%</span>` }],
          rows, foot: ['الإجمالي', '', money(M.sum(rows, r => r.net)), money(M.sum(rows, r => r.cost)), money(M.sum(rows, r => r.net - r.cost)), ''] };
      }],
      ['employee', 'المبيعات حسب الموظف', f => { const rows = groupSales(f, d => d.userId || '-', k => (S.get('users', k) || { name: '—' }).name); return { cols: salesCols({ label: 'الموظف', k: 'label' }), rows, foot: salesFoot(rows) }; }],
      ['profit', 'الأرباح حسب التصنيف', f => {
        const g = {}; for (const d of docs(f)) for (const l of d.lines) { const p = l.pid && S.get('products', l.pid); const k = p ? p.categoryId : 'other'; const r = g[k] || (g[k] = { k, net: 0, cost: 0 }); r.net += sg(d) * l.net; r.cost += sg(d) * (l.cost || 0); }
        const rows = Object.values(g).map(r => ({ ...r, label: (S.get('categories', r.k) || { name: 'أخرى' }).name })).sort((a, b) => (b.net - b.cost) - (a.net - a.cost));
        return { cols: [{ label: 'التصنيف', k: 'label' }, { label: 'صافي المبيعات', num: 1, render: r => money(r.net) }, { label: 'التكلفة', num: 1, render: r => money(r.cost) }, { label: 'مجمل الربح', num: 1, render: r => money(r.net - r.cost) }, { label: 'الهامش', num: 1, render: r => `<span class="num">${r.net ? ((r.net - r.cost) * 100 / r.net).toFixed(1) : 0}%</span>` }],
          rows, foot: ['الإجمالي', money(M.sum(rows, r => r.net)), money(M.sum(rows, r => r.cost)), money(M.sum(rows, r => r.net - r.cost)), ''] };
      }],
      ['collections', 'التحصيلات', f => {
        const g = {}; const add = (d, m, v) => { const r = g[d] || (g[d] = { d, cash: 0, mada: 0, card: 0, receipts: 0 }); r[m] += v; };
        for (const d of docs(f)) for (const p of d.payments) if (p.method !== 'credit') add(d.date, p.method, sg(d) * p.amount);
        for (const r of S.state.receipts.filter(r => inRange(r.date, f) && (!f.branchId || r.branchId === f.branchId))) add(r.date, 'receipts', r.amount);
        const rows = Object.values(g).sort((a, b) => a.d.localeCompare(b.d)); const tot = r => r.cash + r.mada + r.card + r.receipts;
        return { cols: [{ label: 'اليوم', render: r => `<span class="num">${r.d}</span>` }, { label: 'نقدًا', num: 1, render: r => money(r.cash) }, { label: 'مدى', num: 1, render: r => money(r.mada) }, { label: 'بطاقات', num: 1, render: r => money(r.card) }, { label: 'سندات قبض', num: 1, render: r => money(r.receipts) }, { label: 'الإجمالي', num: 1, render: r => money(tot(r)) }],
          rows, foot: ['الإجمالي', money(M.sum(rows, r => r.cash)), money(M.sum(rows, r => r.mada)), money(M.sum(rows, r => r.card)), money(M.sum(rows, r => r.receipts)), money(M.sum(rows, tot))] };
      }],
      ['customers', 'العملاء', f => {
        const rows = S.state.customers.map(c => { const ds = docs(f).filter(d => d.customerId === c.id); return { c, sales: M.sum(ds, d => sg(d) * d.totals.total), rec: M.sum(S.state.receipts.filter(r => r.customerId === c.id && inRange(r.date, f)), r => r.amount), bal: O.customerBalance(c.id) }; });
        return { cols: [{ label: 'العميل', render: r => esc(r.c.name) }, { label: 'مبيعات الفترة', num: 1, render: r => money(r.sales) }, { label: 'تحصيلات الفترة', num: 1, render: r => money(r.rec) }, { label: 'الرصيد الحالي', num: 1, render: r => money(r.bal) }, { label: 'حد الائتمان', num: 1, render: r => money(r.c.creditLimit) }],
          rows, foot: ['الإجمالي', money(M.sum(rows, r => r.sales)), money(M.sum(rows, r => r.rec)), money(M.sum(rows, r => r.bal)), ''] };
      }],
      ['shifts', 'إغلاق ورديات الكاشير', f => {

        else { st.from = '2000-01-01'; st.to = t; }
        app().render();
      }
    }
  };
})(window);

</script>
<script>
/* FLORIX فلوريكس — المستخدمون والصلاحيات، المزامنة، الفوترة الإلكترونية */
(function (root) {
  'use strict';
  const Florix = root.Florix; const V = Florix.Views = Florix.Views || {};
  const S = Florix.Store, M = Florix.Money, UI = Florix.UI, O = Florix.Ops, AU = Florix.Auth, Y = Florix.Sync, Z = Florix.Zatca;
  const { icon, esc, money } = UI;
  const app = () => Florix.App;

  /* ================= المستخدمون والصلاحيات ================= */
  V.users = {
    title: 'المستخدمون والصلاحيات', icon: 'shield', perm: 'scr.users', state: { tab: 'users', role: 'r-cashier', q: '' },
    render() {
      const t = this.state.tab; const can = AU.can('usr.manage');
      const tabs = UI.tabs([['users', 'المستخدمون'], ['roles', 'الأدوار والصلاحيات'], ['audit', 'سجل التدقيق']], t);
      let body = '';
      if (t === 'users') {
        body = `<div class="card">${UI.table({ id: 'usT', search: true, exportName: 'المستخدمون', tools: can ? `<button class="btn pri sm" data-act="addUser">${icon('plus')}مستخدم جديد</button>` : '', cols: [
          { label: 'المستخدم', render: u => `<b>${esc(u.name)}</b><br><span class="num small muted">${esc(u.username)}</span>` }, { label: 'الدور', render: u => esc(AU.role(u).name) },
          { label: 'الفروع', render: u => (u.branches || []).includes('*') ? '<span class="pill pri">كل الفروع</span>' : u.branches.map(b => `<span class="pill">${esc((S.get('branches', b) || {}).code || b)}</span>`).join(' ') },
          { label: 'آخر دخول', render: u => `<span class="num small">${u.lastLogin ? u.lastLogin.replace('T', ' ').slice(0, 16) : '—'}</span>` },
          { label: 'الحالة', render: u => !u.active ? '<span class="pill bad">موقوف</span>' : u.lockedUntil && new Date(u.lockedUntil) > new Date() ? '<span class="pill warn">مقفل مؤقتًا</span>' : '<span class="pill ok">نشط</span>' },
          { label: 'كلمة المرور', render: u => `<span class="num tiny muted" title="PBKDF2-SHA256">${u.passHash.slice(0, 12)}…</span>` },
          { label: '', render: u => can ? `<div class="row" style="flex-wrap:nowrap"><button class="btn sm ghost icon" data-act="editUser" data-id="${u.id}" aria-label="تعديل">${icon('edit')}</button><button class="btn sm ghost" data-act="resetPw" data-id="${u.id}">كلمة المرور</button></div>` : '' }], rows: S.state.users })}</div>`;
      } else if (t === 'roles') {

        body = `<div class="row">${S.state.roles.map(x => `<button class="cat ${x.id === r.id ? 'on' : ''}" data-act="role" data-v="${x.id}">${esc(x.name)}</button>`).join('')}${can ? `<button class="btn sm" data-act="addRole">${icon('plus')}دور جديد</button>` : ''}</div>
          <div class="card"><div class="card-h"><h2>${esc(r.name)}</h2><span class="muted small">حد الخصم: <span class="num">${r.maxDiscountPct}%</span> · حد اعتماد المشتريات: ${r.approvalLimit === null || r.approvalLimit === undefined ? 'غير محدود' : money(r.approvalLimit)}</span>
            ${can && r.id !== 'r-admin' ? `<button class="btn sm" data-act="roleLimits" data-id="${r.id}">${icon('edit')}الحدود</button>` : ''}</div><div class="card-b">
          ${r.perms.includes('*') ? `<div class="alert info">${icon('shield')}<span>هذا الدور يملك جميع الصلاحيات ولا يمكن تقييده.</span></div>` : `<div class="grid g3">${AU.CATALOG.map(g => `<div><h3 style="font-size:13px;margin-bottom:6px">${esc(g.group)}</h3><div style="display:flex;flex-direction:column;gap:4px">${g.items.map(([k, l]) => `<label class="check"><input type="checkbox" data-change="perm" data-role="${r.id}" data-perm="${k}" ${r.perms.includes(k) ? 'checked' : ''} ${can ? '' : 'disabled'}> ${esc(l)}</label>`).join('')}</div></div>`).join('')}</div>`}
          </div><div class="card-b muted small" style="padding-top:0">تُفحص الصلاحيات في طبقة العمليات (وليس بإخفاء الأزرار فقط)، وفي الإنتاج تُفحص مرة أخرى في الخادم لكل طلب API مع نطاق الفرع.</div></div>`;
      } else {
        const q = this.state.q.toLowerCase();
        const rows = S.state.auditLog.filter(a => !q || (a.action + a.userName + a.details + (a.entity || '')).toLowerCase().includes(q)).slice(0, 400);
        body = AU.can('audit.view') || AU.can('usr.manage') ? `<div class="card">${UI.table({ id: 'auT', search: true, exportName: 'سجل-التدقيق', cols: [
          { label: 'الوقت', render: a => `<span class="num small">${a.at.replace('T', ' ').slice(0, 19)}</span>` }, { label: 'المستخدم', k: 'userName' }, { label: 'الفرع', render: a => esc((S.get('branches', a.branchId) || {}).code || '—') },
          { label: 'العملية', render: a => `<span class="pill ${/fail|delete|cancel|reverse/.test(a.action) ? 'bad' : /price|discount|close|approve/.test(a.action) ? 'warn' : ''}">${esc(a.action)}</span>` }, { label: 'الكيان', render: a => esc(a.entity || '') }, { label: 'التفاصيل', render: a => esc(a.details) }], rows, empty: 'لا توجد سجلات.' })}
          <div class="card-b muted small">سجل التدقيق إلحاقي: لا توجد واجهة لتعديله أو حذفه. يُسجل الدخول والخروج والمحاولات الفاشلة وتعديل الأسعار والخصومات والاعتمادات والإقفال والتصدير وكل المستندات.</div></div>` : `<div class="alert warn">${icon('lock')}<span>لا تملك صلاحية عرض سجل التدقيق.</span></div>`;
      }
      return tabs + body;
    },
    actions: {
      role(el) { V.users.state.role = el.dataset.v; app().render(); },
      perm(el) {
        AU.require('usr.manage'); const r = S.get('roles', el.dataset.role); const p = el.dataset.perm;
        if (el.checked && !r.perms.includes(p)) r.perms.push(p); if (!el.checked) r.perms = r.perms.filter(x => x !== p);
        S.audit('role.perm', 'role', r.id, `${el.checked ? '+' : '−'} ${p}`); S.save(); UI.toast(`${el.checked ? 'مُنحت' : 'سُحبت'} صلاحية «${AU.label(p)}» من دور ${r.name}.`);
      },
      roleLimits(el) {
        const r = S.get('roles', el.dataset.id);
        UI.formModal({ title: 'حدود الدور ' + r.name, fields: [{ name: 'disc', label: 'أقصى خصم %', type: 'number', value: r.maxDiscountPct }, { name: 'appr', label: 'حد اعتماد أوامر الشراء (فارغ = غير محدود)', type: 'money', value: r.approvalLimit === null || r.approvalLimit === undefined ? '' : M.plain(r.approvalLimit) }],
          onSave(v) { AU.require('usr.manage'); r.maxDiscountPct = Math.min(100, Math.max(0, parseFloat(v.disc) || 0)); r.approvalLimit = v.appr === '' ? null : M.toH(v.appr); S.audit('role.limits', 'role', r.id, `خصم ${r.maxDiscountPct}%`); S.save(); app().render(); } });
      },
      addRole() { UI.formModal({ title: 'دور جديد', fields: [{ name: 'name', label: 'اسم الدور' }], onSave(v) { AU.require('usr.manage'); if (!v.name) throw new Error('الاسم مطلوب.'); const r = { id: S.uuid(), name: v.name, perms: ['scr.dashboard'], maxDiscountPct: 0, approvalLimit: 0 }; S.state.roles.push(r); V.users.state.role = r.id; S.audit('role.create', 'role', r.id, v.name); S.save(); app().render(); } }); },
      addUser() { userForm(); }, editUser(el) { userForm(S.get('users', el.dataset.id)); },
      resetPw(el) {
        const u = S.get('users', el.dataset.id);
        UI.formModal({ title: 'تعيين كلمة مرور — ' + u.name, fields: [{ name: 'p1', label: 'كلمة المرور الجديدة', type: 'password' }, { name: 'p2', label: 'تأكيد كلمة المرور', type: 'password' }],
          onSave(v) { AU.require('usr.manage'); if (v.p1.length < 4) throw new Error('كلمة المرور 4 أحرف على الأقل (في الإنتاج: 10 أحرف وسياسة تعقيد).'); if (v.p1 !== v.p2) throw new Error('كلمتا المرور غير متطابقتين.'); const n = AU.makeUser({}, v.p1); u.salt = n.salt; u.passHash = n.passHash; u.failed = 0; u.lockedUntil = null; S.audit('user.password', 'user', u.id, ''); S.save(); UI.toast('عُيّنت كلمة المرور.', 'ok'); app().render(); } });
      }
    }
  };
  function userForm(u) {
    const brs = S.state.branches;
    UI.formModal({ title: u ? 'تعديل مستخدم' : 'مستخدم جديد', wide: true, fields: [
      { name: 'name', label: 'الاسم', value: u && u.name }, { name: 'username', label: 'اسم الدخول', value: u && u.username, attrs: u ? 'readonly' : '' },
      { name: 'roleId', label: 'الدور', type: 'select', value: u && u.roleId, options: S.state.roles.map(r => [r.id, r.name]) },
      ...(u ? [] : [{ name: 'password', label: 'كلمة المرور الأولية', type: 'password' }]),
      { type: 'html', full: true, html: `<div class="field"><span>الفروع المسموح بها</span><div class="row"><label class="check"><input type="checkbox" name="b_all" ${u && u.branches.includes('*') ? 'checked' : ''}> كل الفروع</label>${brs.map(b => `<label class="check"><input type="checkbox" name="b_${b.id}" ${u && u.branches.includes(b.id) ? 'checked' : ''}> ${esc(b.name)}</label>`).join('')}</div></div>` },
      { name: 'active', label: 'الحساب نشط', type: 'check', value: u ? u.active : true }],
      onSave(v) {
        AU.require('usr.manage');
        const branches = v.b_all ? ['*'] : brs.filter(b => v['b_' + b.id]).map(b => b.id);
        if (!v.name || !branches.length) throw new Error('الاسم وفرع واحد على الأقل مطلوبان.');
        if (u) { if (u.id === S.user().id && !v.active) throw new Error('لا يمكنك إيقاف حسابك.'); Object.assign(u, { name: v.name, roleId: v.roleId, branches, active: v.active }); S.audit('user.update', 'user', u.id, v.name); }
        else {
          if (!/^[a-z0-9._]{3,}$/i.test(v.username)) throw new Error('اسم الدخول 3 أحرف إنجليزية أو أرقام على الأقل.');
          if (S.state.users.some(x => x.username.toLowerCase() === v.username.toLowerCase())) throw new Error('اسم الدخول مستخدم.');
          if ((v.password || '').length < 4) throw new Error('كلمة المرور 4 أحرف على الأقل.');
          const n = AU.makeUser({ id: S.uuid(), username: v.username, name: v.name, roleId: v.roleId, branches, active: v.active }, v.password);
          S.state.users.push(n); S.audit('user.create', 'user', n.id, v.username);
        }
        S.save(); app().render();
      } });
  }

  /* ================= المزامنة ================= */
  V.sync = {
    title: 'المزامنة', icon: 'sync', perm: 'scr.sync', live: true, state: { tab: 'status' },
    render() {
      const t = this.state.tab; const cfg = S.state.settings.sync; const can = AU.can('sync.manage') || AU.can('pos.sell');
      const cards = `<div class="grid g3">${S.state.branches.map(b => { const p = Y.pending(b.id).length, f = Y.failed(b.id).length; return `<div class="card"><div class="card-h"><h2>${esc(b.name)}</h2><span class="pill ${b.online ? 'ok' : 'bad'}">${icon(b.online ? 'wifi' : 'wifioff')}${b.online ? 'متصل' : 'غير متصل'}</span></div>
        <div class="card-b"><dl class="kv"><dt>آخر مزامنة</dt><dd>${V.fmtAgo(b.lastSync)}</dd><dt>معلقة</dt><dd class="num ${p ? 'warn-t' : ''}">${p}</dd><dt>فاشلة</dt><dd class="num ${f ? 'bad-t' : ''}">${f}</dd><dt>فواتير بانتظار ZATCA</dt><dd class="num">${S.state.invoices.filter(i => i.branchId === b.id && i.zatca.status === 'pending').length}</dd></dl>
        <div class="row" style="margin-top:10px"><button class="btn sm" data-act="toggle" data-id="${b.id}">${b.online ? 'محاكاة انقطاع' : 'محاكاة عودة الاتصال'}</button><button class="btn sm pri" data-act="now" data-id="${b.id}" ${b.online ? '' : 'disabled'}>${icon('sync')}مزامنة الآن</button>
        ${f ? `<button class="btn sm danger" data-act="retry" data-id="${b.id}">إعادة الفاشلة</button>` : ''}<button class="btn sm ghost" data-act="resend" data-id="${b.id}" title="يعيد إرسال آخر 10 عمليات مرسلة للتأكد أن المركز لا يكررها">اختبار عدم التكرار</button></div></div></div>`; }).join('')}</div>`;
      const tabs = UI.tabs([['status', 'الطابور'], ['log', 'سجل المزامنة'], ['conflicts', `التعارضات (${S.state.conflicts.filter(c => c.status === 'open').length})`], ['settings', 'الإعدادات والقواعد']], t);
      let body = '';
      if (t === 'status') {
        const q = S.state.syncQueue.filter(x => x.status !== 'sent').concat(S.state.syncQueue.filter(x => x.status === 'sent').slice(-30)).reverse();
        body = `<div class="card">${UI.table({ id: 'sqT', search: true, exportName: 'طابور-المزامنة', cols: [
          { label: 'معرف العملية (UUID)', render: x => `<span class="num tiny">${x.id}</span>` }, { label: 'الفرع', render: x => esc((S.get('branches', x.branchId) || {}).code || '') }, { label: 'الكيان', render: x => `${esc(x.entity)}.${esc(x.op)}` },
          { label: 'أُنشئت', render: x => `<span class="num small">${x.createdAt.replace('T', ' ').slice(0, 19)}</span>` }, { label: 'المحاولات', num: 1, render: x => x.attempts },
          { label: 'الحالة', render: x => `<span class="pill ${{ pending: 'warn', retry: 'warn', failed: 'bad', sent: 'ok' }[x.status]}">${{ pending: 'معلقة', retry: 'إعادة محاولة', failed: 'فاشلة', sent: 'مرسلة' }[x.status]}</span>` },
          { label: 'آخر خطأ', render: x => `<span class="small bad-t">${esc(x.lastError || '')}</span>` }], rows: q, empty: 'الطابور فارغ.' })}</div>`;
      } else if (t === 'log') {
        body = `<div class="card">${UI.table({ id: 'slgT', exportName: 'سجل-المزامنة', cols: [{ label: 'الوقت', render: l => `<span class="num small">${l.at.replace('T', ' ').slice(0, 19)}</span>` }, { label: 'الفرع', render: l => esc((S.get('branches', l.branchId) || {}).name || '') }, { label: 'المستوى', render: l => `<span class="pill ${{ info: 'info', warn: 'warn', error: 'bad' }[l.level]}">${l.level}</span>` }, { label: 'الرسالة', k: 'msg' }], rows: S.state.syncLog.slice(0, 200), empty: 'لا توجد سجلات بعد.' })}</div>`;
      } else if (t === 'conflicts') {
        body = `<div class="card"><div class="card-h"><h2>تعارضات البيانات الرئيسية</h2><button class="btn sm" data-act="simConflict">${icon('split')}محاكاة تعديل مركزي متزامن</button></div>${UI.table({ cols: [
          { label: 'الوقت', render: c => `<span class="num small">${c.at.replace('T', ' ').slice(0, 16)}</span>` }, { label: 'الصنف', render: c => esc((S.get('products', c.entityId) || {}).nameAr || c.entityId) }, { label: 'الفرع', render: c => esc(S.get('branches', c.branchId).code) },
          { label: 'قيمة الفرع', render: c => esc(fmtCh(c.local)) }, { label: 'قيمة المركز', render: c => esc(fmtCh(c.central)) }, { label: 'الحالة', render: c => c.status === 'open' ? '<span class="pill warn">مفتوح</span>' : `<span class="pill ok">${c.resolution === 'central' ? 'اعتُمد المركز' : 'اعتُمد الفرع'}</span>` },
          { label: '', render: c => c.status === 'open' ? `<div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="resolve" data-id="${c.id}" data-k="central">اعتماد المركز</button><button class="btn sm" data-act="resolve" data-id="${c.id}" data-k="local">اعتماد الفرع</button></div>` : '' }],
          rows: S.state.conflicts.slice().reverse(), empty: 'لا توجد تعارضات. جرّب: «محاكاة تعديل مركزي متزامن» ثم عدّل سعر الصنف نفسه من شاشة الأصناف وزامن.' })}</div>`;
      } else {
        body = `<div class="grid g2"><div class="card"><div class="card-h"><h2>الإعدادات</h2></div><div class="card-b" style="display:flex;flex-direction:column;gap:12px">
          <label class="check"><input type="checkbox" data-change="auto" ${cfg.auto ? 'checked' : ''}> مزامنة تلقائية</label>
          <label class="field"><span>الفاصل الزمني (ثانية)</span><input class="input num-in" data-change="interval" value="${cfg.intervalSec}"></label>
          <label class="field"><span>نسبة فشل الشبكة المحاكاة %</span><input class="input num-in" data-change="fail" value="${cfg.failRate}"><small class="muted tiny">لاختبار إعادة المحاولة بتأخير متزايد (5ث، 10ث، 20ث…) حتى ${Y.MAX_ATTEMPTS} محاولات.</small></label></div></div>
          <div class="card"><div class="card-h"><h2>قواعد المزامنة</h2></div><div class="card-b small" style="display:flex;flex-direction:column;gap:8px">
          <div>${icon('check')} كل عملية لها UUID ثابت؛ المركز يتجاهل أي عملية سبق تطبيقها (Idempotent).</div>
          <div>${icon('check')} المعاملات المالية (فواتير، قيود، حركات) إلحاقية: لا تُعدّل ولا تُكتب فوق بيانات المركز.</div>
          <div>${icon('check')} أرقام الفواتير ببادئة الفرع والجهاز، والمركز يرفض أي رقم مكرر.</div>
          <div>${icon('check')} البيانات الرئيسية (الأصناف والأسعار والمستخدمون) يملكها المركز؛ تعديل الفرع يُرسل برقم الإصدار، وأي تعارض يُسجل للمعالجة اليدوية.</div>
          <div>${icon('check')} العملاء مشتركون: الإضافة من أي فرع، والتعديل المتعارض يُسجل.</div>
          <div class="muted">في الإنتاج: خدمة مزامنة مستقلة، مصادقة الجهاز بشهادة، تشفير TLS، ودُفعات موقّعة. انظر docs/04-sync-design.md.</div></div></div></div>`;
      }
      return cards + tabs + body;
    },
    actions: {
      toggle(el) { const b = S.get('branches', el.dataset.id); b.online = !b.online; Y.log(b.id, b.online ? 'info' : 'warn', b.online ? 'عاد الاتصال (محاكاة).' : 'انقطع الاتصال (محاكاة).'); if (b.online) { Y.process(b.id, { manual: true }); O.zatcaRetry(b.id); } S.audit('branch.network', 'branch', b.id, b.online ? 'online' : 'offline'); S.save(); app().render(); },
      now(el) { const r = Y.process(el.dataset.id, { manual: true }); S.save(); UI.toast(`أُرسلت ${r.sent} عملية${r.dup ? `، ${r.dup} مكررة تجاهلها المركز` : ''}${r.failed ? `، فشلت ${r.failed}` : ''}.`, r.failed ? 'bad' : 'ok'); app().render(); },
      retry(el) { Y.retryFailed(el.dataset.id); Y.process(el.dataset.id, { manual: true }); S.save(); app().render(); },
      resend(el) { const r = Y.resend(el.dataset.id, 10); S.save(); UI.toast(`أُعيد إرسال ${r.total} عملية: تجاهل المركز ${r.dup} مكررة ولم يُسجل أي منها مرتين.`, 'ok'); app().render(); },
      auto(el) { S.state.settings.sync.auto = el.checked; S.save(); }, interval(el) { S.state.settings.sync.intervalSec = Math.max(3, parseInt(el.value, 10) || 10); S.save(); },
      fail(el) { S.state.settings.sync.failRate = Math.min(100, Math.max(0, parseInt(el.value, 10) || 0)); S.save(); UI.toast('نسبة الفشل المحاكاة: ' + S.state.settings.sync.failRate + '%'); },
      simConflict() {
        const p = S.state.products[0]; const c = S.state.central;
        c.versions[p.id] = (c.versions[p.id] || 0) + 5; c.values[p.id] = Object.assign({}, c.values[p.id], { price: p.price + 150 });
        Y.log(null, 'info', `محاكاة: المركز عدّل سعر «${p.nameAr}» إلى ${M.fmt(p.price + 150)}.`);
        S.save(); UI.toast(`عدّل المركز سعر «${p.nameAr}». الآن عدّل سعره من شاشة الأصناف ثم زامن ليظهر التعارض.`); app().render();
      },
      resolve(el) { Y.resolveConflict(el.dataset.id, el.dataset.k); S.save(); app().render(); }
    }
  };
  const fmtCh = o => Object.entries(o || {}).map(([k, v]) => `${k}: ${k === 'price' || k === 'cost' ? M.fmt(v) : v}`).join('، ') || '—';

  /* ================= الفوترة الإلكترونية ================= */
  V.einvoice = {

        <h2>مرحبًا ${esc(u.name)}</h2><p style="color:#C9D5EA;margin:0">${esc(AU.role().name)}</p></div></aside>
        <main class="auth-main"><div class="auth-card"><div><h1>اختيار الفرع</h1><p class="muted small" style="margin:4px 0 0">تُسجل كل العمليات باسم الفرع والجهاز المختارين.</p></div>
        <div class="branch-list">${bs.map(b => `<button class="branch-opt" data-b="${b.id}"><span class="bcode">${b.code}</span><span class="grow"><b>${esc(b.name)}</b><br><span class="small muted">${esc(b.city)} · ${b.online ? 'متصل' : 'غير متصل — يعمل محليًا'}</span></span>${icon(b.online ? 'wifi' : 'wifioff')}</button>`).join('')}</div>
        <label class="field"><span>جهاز البيع</span><select class="input" id="devSel"></select></label>
        <div class="row"><button class="btn pri lg grow" id="goBranch" disabled>متابعة</button><button class="btn lg" id="backLogin">${icon('logout')}خروج</button></div></div></main></div>`;
      let sel = null;
      const devSel = document.getElementById('devSel');
      App.el.querySelectorAll('[data-b]').forEach(b => b.addEventListener('click', () => {
        sel = b.dataset.b; App.el.querySelectorAll('[data-b]').forEach(x => x.classList.toggle('sel', x === b));
        devSel.innerHTML = S.state.devices.filter(d => d.branchId === sel).map(d => `<option value="${d.id}">${esc(d.code)} — ${esc(d.name)}</option>`).join('');
        document.getElementById('goBranch').disabled = false;
      }));
      document.getElementById('goBranch').onclick = () => App.pickBranch(sel, devSel.value);
      document.getElementById('backLogin').onclick = () => { AU.logout(); App.login(); };
    },
    pickBranch(id, deviceId) {
      S.session.branchId = id;
      S.session.deviceId = deviceId || (S.state.devices.find(d => d.branchId === id && d.code !== 'BO') || {}).id;
      S.session.scope = id;
      S.audit('branch.select', 'branch', id, '');
      S.saveSession(); S.save();
      App.shell();
    },

    allowed(name) { const v = Views[name]; return v && (!v.perm || AU.can(v.perm)); },

    shell() {
      const u = S.user(); const b = S.get('branches', S.session.branchId);
      App.el.innerHTML = `<div class="shell" id="shell">
        <aside class="side" aria-label="القائمة الرئيسية"><div class="side-head">${UI.logo()}</div><nav class="nav" id="nav"></nav>
          <div class="side-foot"><div class="row"><span class="grow">${icon('user')} ${esc(u.name)}<br><span class="tiny">${esc(AU.role().name)}</span></span><button class="btn ghost icon sm" id="logoutBtn" title="تسجيل الخروج" aria-label="تسجيل الخروج">${icon('logout')}</button></div></div></aside>
        <div class="scrim" id="scrim"></div>
        <div class="main"><header class="top" id="top"></header><main class="content" id="content"></main></div></div><div id="print-root"></div>`;
      document.getElementById('logoutBtn').onclick = () => { AU.logout(); location.hash = ''; App.login(); };
      document.getElementById('scrim').onclick = () => document.getElementById('shell').classList.remove('nav-open');
      const content = document.getElementById('content');
      content.addEventListener('click', App.onAct);
      content.addEventListener('change', App.onChange);
      content.addEventListener('input', App.onInput);
      if (!App._wired) {
        App._wired = true;
        root.addEventListener('hashchange', () => { if (S.session && S.session.branchId) App.go(location.hash.slice(1)); });
        ['click', 'keydown'].forEach(ev => document.addEventListener(ev, () => AU.touch(), { passive: true }));
        S.on(() => App.chrome());
        setInterval(App.tick, 1000);
      }
      App.go(location.hash.slice(1));
    },

    nav() {
      const n = document.getElementById('nav'); if (!n) return;
      const pend = Y.pending().length + Y.failed().length;
      const zpend = S.state.invoices.filter(i => i.zatca && (i.zatca.status === 'pending' || i.zatca.status === 'rejected')).length;
      n.innerHTML = NAV.map(([sec, items]) => {
        const vis = items.filter(App.allowed); if (!vis.length) return '';
        return `<div class="nav-sec">${sec}</div>` + vis.map(k => {
          const v = Views[k]; let badge = '';
          if (k === 'sync' && pend) badge = `<span class="badge warn">${pend}</span>`;
          if (k === 'einvoice' && zpend) badge = `<span class="badge">${zpend}</span>`;
          return `<a href="#${k}" class="${App.view === k ? 'on' : ''}">${icon(v.icon)}<span>${esc(v.title)}</span>${badge}</a>`;
        }).join('');
      }).join('');
    },
    top() {
      const t = document.getElementById('top'); if (!t) return;
      const v = Views[App.view]; const b = S.get('branches', S.session.branchId);
      const pend = Y.pending(b.id).length; const fail = Y.failed(b.id).length;
      const scopeOpts = AU.can('all.branches') ? `<select class="input sm hide-sm" id="scopeSel" style="width:auto" aria-label="نطاق العرض"><option value="all" ${S.session.scope === 'all' ? 'selected' : ''}>كل الفروع (موحد)</option>${AU.branches().map(x => `<option value="${x.id}" ${S.session.scope === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : '';
      t.innerHTML = `<button class="btn ghost icon menu-btn" id="menuBtn" aria-label="القائمة">${icon('menu')}</button>
        <h1>${esc(v ? v.title : '')}</h1>
        ${scopeOpts}
        <button class="pill ${b.online ? 'ok' : 'bad'}" id="netBtn" title="محاكاة اتصال الفرع بالخادم المركزي — اضغط للتبديل">${icon(b.online ? 'wifi' : 'wifioff')}<span class="hide-sm">${esc(b.code)} · </span>${b.online ? 'متصل' : 'غير متصل'}</button>
        ${pend || fail ? `<a class="pill ${fail ? 'bad' : 'warn'}" href="#sync">${icon('sync')}<span class="num">${pend + fail}</span><span class="hide-sm">معلقة</span></a>` : ''}
        ${S.saveError ? `<span class="pill bad" title="${esc(S.saveError)}">${icon('alert')}الحفظ</span>` : ''}
        <button class="btn ghost icon" id="themeBtn" aria-label="تبديل الوضع الليلي والنهاري" title="الوضع الليلي/النهاري">${icon(App.isDark() ? 'sun' : 'moon')}</button>`;
      document.getElementById('menuBtn').onclick = () => document.getElementById('shell').classList.toggle('nav-open');
      document.getElementById('themeBtn').onclick = () => { App.setTheme(App.isDark() ? 'light' : 'dark'); App.top(); };
      document.getElementById('netBtn').onclick = () => {
        b.online = !b.online; S.audit('branch.network', 'branch', b.id, b.online ? 'online' : 'offline');
        Y.log(b.id, b.online ? 'info' : 'warn', b.online ? 'عاد الاتصال بالخادم المركزي.' : 'انقطع الاتصال — العمل محليًا وتخزين العمليات في الطابور.');
        if (b.online) { const r = Y.process(b.id, { manual: true }); const z = Florix.Ops.zatcaRetry(b.id); UI.toast(`عاد الاتصال: أُرسلت ${r.sent} عملية و ${z} فاتورة إلكترونية.`, 'ok'); }
        else UI.toast('الفرع يعمل الآن دون اتصال. ستُحفظ العمليات محليًا وتُرسل لاحقًا.');
        S.save(); App.render();
      };
      const sc = document.getElementById('scopeSel'); if (sc) sc.onchange = () => { S.session.scope = sc.value; S.saveSession(); App.render(); };
    },
    chrome() { App.nav(); App.top(); },

    go(name) {
      if (!name || !App.allowed(name)) name = App.allowed('dashboard') ? 'dashboard' : App.allowed('pos') ? 'pos' : Object.keys(Views).find(App.allowed);
      if (location.hash.slice(1) !== name) { history.replaceState(null, '', '#' + name); }
      App.view = name;
      const sh = document.getElementById('shell'); if (sh) sh.classList.remove('nav-open');
      App.render(true);
    },
    render(scrollTop) {
      const c = document.getElementById('content'); if (!c) return;
      const v = Views[App.view]; const y = c.scrollTop;
      App.chrome();
      try { c.innerHTML = `<div class="wrap">${v.render()}</div>`; if (v.mount) v.mount(c); }
      catch (e) { console.error(e); c.innerHTML = `<div class="wrap"><div class="alert bad">${icon('alert')}<span>تعذر عرض الشاشة: ${esc(e.message)}</span></div></div>`; }
      c.scrollTop = scrollTop === true ? 0 : y;
    },
    onAct(e) {
      const t = e.target.closest('[data-act]'); if (!t) return;
      const v = Views[App.view]; const fn = v.actions && v.actions[t.dataset.act];
      if (t.dataset.act === 'tab' && v.state) { v.state.tab = t.dataset.v; App.render(); return; }
      if (fn) { e.preventDefault(); try { fn(t, e); } catch (er) { UI.err(er); } }
    },
    onChange(e) {
      const t = e.target.closest('[data-change]'); if (!t) return;
      const v = Views[App.view]; const fn = v.actions && v.actions[t.dataset.change];
      if (fn) { try { fn(t, e); } catch (er) { UI.err(er); } }
    },
    onInput(e) {
      const t = e.target.closest('[data-input]'); if (!t) return;
      const v = Views[App.view]; const fn = v.actions && v.actions[t.dataset.input];
      if (fn) { try { fn(t, e); } catch (er) { UI.err(er); } }
    },

    scope() { return S.session.scope === 'all' ? null : (S.session.scope || S.session.branchId); },
    scopeName() { const s = App.scope(); return s ? S.get('branches', s).name : 'كل الفروع'; },

    _n: 0,
    tick() {
      if (!S.session || !S.session.branchId) return;
      App._n++;
      // انتهاء الجلسة
      if (App._n % 15 === 0 && AU.expired(S.state.settings.sessionMinutes) && !document.querySelector('.lock')) App.lock();
      // المزامنة التلقائية
      const cfg = S.state.settings.sync;
      if (cfg.auto && App._n % Math.max(3, cfg.intervalSec) === 0) {
        let changed = false;
        for (const b of S.state.branches) {
          if (b.online && Y.pending(b.id).some(q => q.nextAt <= Date.now())) { const r = Y.process(b.id); if (r.sent || r.failed) changed = true; }
          else if (b.online) b.lastSync = S.now();
        }
        if (changed) { S.save(); App.chrome(); if (Views[App.view].live && !document.querySelector('.modal-bg')) App.render(); }
      }
    },
    lock() {
      const u = S.user();
      const d = document.createElement('div'); d.className = 'lock';
      d.innerHTML = `<form class="card card-b" style="width:min(360px,100%);display:flex;flex-direction:column;gap:12px"><h2 style="font-size:17px">${icon('lock')} انتهت الجلسة لعدم النشاط</h2>
        <p class="muted small" style="margin:0">أدخل كلمة مرور ${esc(u.name)} للمتابعة.</p><input class="input" type="password" name="p" aria-label="كلمة المرور" autocomplete="current-password"><div class="row"><button class="btn pri grow">متابعة</button><button class="btn" type="button" data-out>خروج</button></div><div class="bad-t small" data-msg></div></form>`;
      document.body.appendChild(d);
      const f = d.querySelector('form'); f.p.focus();
      d.querySelector('[data-out]').onclick = () => { d.remove(); AU.logout(); App.login(); };
      f.onsubmit = e => {
        e.preventDefault();
        if (AU.hash(f.p.value, u.salt) === u.passHash) { AU.touch(); d.remove(); S.audit('session.unlock', 'user', u.id, ''); }
        else d.querySelector('[data-msg]').textContent = 'كلمة المرور غير صحيحة.';
      };
    }
  };

  Florix.App = App;
  if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', App.boot);
})(window);

</script>
