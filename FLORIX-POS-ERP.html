<script>
/* FLORIX فلوريكس — وحدة الفوترة الإلكترونية (ZATCA) — منفصلة تمامًا عن الواجهة وقابلة للاختبار
 *
 * ما تنفذه هذه الوحدة فعليًا داخل النموذج:
 *   - بناء XML بصيغة UBL 2.1 بالحقول الأساسية لملف ZATCA
 *   - UUID لكل فاتورة، عداد الفواتير ICV، تجزئة الفاتورة السابقة PIH (سلسلة تجزئة)
 *   - تجزئة SHA-256 للفاتورة، ورمز QR بترميز TLV (الحقول 1-6)
 *   - تحقق محلي من مجموعة مختارة من قواعد العمل
 *   - محاكي محلي لمنصة فاتورة (تقرير/اعتماد) لتجربة الحالات وإعادة المحاولة
 *
 * ما لا تنفذه (يجب تنفيذه في خدمة الفوترة الخلفية واختباره على بيئة ZATCA الرسمية):
 *   - تحويل XML إلى الصيغة القانونية C14N11 قبل التجزئة
 *   - التوقيع الرقمي ECDSA secp256k1 و XAdES، والحقول 7-9 في QR
 *   - إصدار CSR والحصول على شهادات CSID للامتثال والإنتاج
 *   - الاتصال الفعلي بواجهات Fatoora (compliance / reporting / clearance)
 * لذلك: هذا النموذج غير متوافق فعليًا مع ZATCA ولا يُرسل أي فاتورة للهيئة.
 */
(function (root) {
  'use strict';
  const Florix = root.Florix = root.Florix || {};
  const C = () => Florix.Crypto;
  const M = () => Florix.Money;

  // تجزئة الفاتورة الأولى في السلسلة = Base64 لنص SHA-256 للرقم "0" كما في المواصفة
  const INITIAL_PIH = 'NWZlY2ViNjZmZmM4NmYzOGQ5NTI3ODZjNmQ2OTZjNzljMmRiYzIzOWRkNGU5MWI0NjcyOWQ3M2EyN2ZiNTdlOQ==';

  const TYPE_CODE = { invoice: '388', credit: '381', debit: '383' };
  const KIND_LABEL = { invoice: 'فاتورة', credit: 'إشعار دائن', debit: 'إشعار مدين' };
  // اسم نوع الفاتورة: 01 = قياسية (B2B)، 02 = مبسطة (B2C)
  const subtype = inv => (inv.type === 'standard' ? '0100000' : '0200000');

  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function validVat(v) { return /^3\d{13}3$/.test(String(v || '')); }

  /** بناء XML للفاتورة (بدون UBLExtensions/التوقيع لأنها تُستثنى من التجزئة) */
  function buildXML(inv, ctx) {
    const co = inv.seller || ctx.company, cu = inv.buyer || ctx.customer || null, z = inv.zatca || {};
    const party = (p, isSeller) => `
    <cac:Party>
      ${isSeller ? `<cac:PartyIdentification><cbc:ID schemeID="CRN">${esc(co.cr)}</cbc:ID></cac:PartyIdentification>` : ''}
      <cac:PostalAddress>
        <cbc:StreetName>${esc(p.address && p.address.street)}</cbc:StreetName>
        <cbc:BuildingNumber>${esc(p.address && p.address.building)}</cbc:BuildingNumber>
        <cbc:CitySubdivisionName>${esc(p.address && p.address.district)}</cbc:CitySubdivisionName>
        <cbc:CityName>${esc(p.address && p.address.city)}</cbc:CityName>
        <cbc:PostalZone>${esc(p.address && p.address.postal)}</cbc:PostalZone>
        <cac:Country><cbc:IdentificationCode>SA</cbc:IdentificationCode></cac:Country>
      </cac:PostalAddress>
      ${p.vat ? `<cac:PartyTaxScheme><cbc:CompanyID>${esc(p.vat)}</cbc:CompanyID><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:PartyTaxScheme>` : ''}
      <cac:PartyLegalEntity><cbc:RegistrationName>${esc(p.name)}</cbc:RegistrationName></cac:PartyLegalEntity>
    </cac:Party>`;
    const lines = inv.lines.map((l, i) => `
  <cac:InvoiceLine>
    <cbc:ID>${i + 1}</cbc:ID>
    <cbc:InvoicedQuantity unitCode="PCE">${M().fmtQty(l.qty)}</cbc:InvoicedQuantity>
    <cbc:LineExtensionAmount currencyID="SAR">${M().plain(l.net)}</cbc:LineExtensionAmount>
    <cac:TaxTotal>
      <cbc:TaxAmount currencyID="SAR">${M().plain(l.vat)}</cbc:TaxAmount>
      <cbc:RoundingAmount currencyID="SAR">${M().plain(l.net + l.vat)}</cbc:RoundingAmount>
    </cac:TaxTotal>
    <cac:Item>
      <cbc:Name>${esc(l.name)}</cbc:Name>
      <cac:ClassifiedTaxCategory><cbc:ID>${l.vatRate > 0 ? 'S' : 'Z'}</cbc:ID><cbc:Percent>${(l.vatRate / 100).toFixed(2)}</cbc:Percent><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:ClassifiedTaxCategory>
    </cac:Item>
    <cac:Price>
      <cbc:PriceAmount currencyID="SAR">${M().plain(l.price)}</cbc:PriceAmount>
      ${l.discount ? `<cac:AllowanceCharge><cbc:ChargeIndicator>false</cbc:ChargeIndicator><cbc:AllowanceChargeReason>discount</cbc:AllowanceChargeReason><cbc:Amount currencyID="SAR">${M().plain(l.discount)}</cbc:Amount></cac:AllowanceCharge>` : ''}
    </cac:Price>
  </cac:InvoiceLine>`).join('');
    const groups = {};
    for (const l of inv.lines) { const g = groups[l.vatRate] || (groups[l.vatRate] = { net: 0, vat: 0 }); g.net += l.net; g.vat += l.vat; }
    const subtotals = Object.keys(groups).map(r => `
    <cac:TaxSubtotal>
      <cbc:TaxableAmount currencyID="SAR">${M().plain(groups[r].net)}</cbc:TaxableAmount>
      <cbc:TaxAmount currencyID="SAR">${M().plain(groups[r].vat)}</cbc:TaxAmount>
      <cac:TaxCategory><cbc:ID>${+r > 0 ? 'S' : 'Z'}</cbc:ID><cbc:Percent>${(r / 100).toFixed(2)}</cbc:Percent>${+r === 0 ? '<cbc:TaxExemptionReasonCode>VATEX-SA-32</cbc:TaxExemptionReasonCode>' : ''}<cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:TaxCategory>
    </cac:TaxSubtotal>`).join('');

    return `<?xml version="1.0" encoding="UTF-8"?>
<Invoice xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2" xmlns:cac="urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2" xmlns:cbc="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2">
  <cbc:ProfileID>reporting:1.0</cbc:ProfileID>
  <cbc:ID>${esc(inv.number)}</cbc:ID>
  <cbc:UUID>${esc(inv.id)}</cbc:UUID>
  <cbc:IssueDate>${inv.date}</cbc:IssueDate>
  <cbc:IssueTime>${inv.time}</cbc:IssueTime>
  <cbc:InvoiceTypeCode name="${subtype(inv)}">${TYPE_CODE[inv.kind]}</cbc:InvoiceTypeCode>
  <cbc:DocumentCurrencyCode>SAR</cbc:DocumentCurrencyCode>
  <cbc:TaxCurrencyCode>SAR</cbc:TaxCurrencyCode>${inv.kind !== 'invoice' ? `
  <cac:BillingReference><cac:InvoiceDocumentReference><cbc:ID>${esc(inv.refNumber)}</cbc:ID></cac:InvoiceDocumentReference></cac:BillingReference>` : ''}
  <cac:AdditionalDocumentReference><cbc:ID>ICV</cbc:ID><cbc:UUID>${z.icv || ''}</cbc:UUID></cac:AdditionalDocumentReference>
  <cac:AdditionalDocumentReference><cbc:ID>PIH</cbc:ID><cac:Attachment><cbc:EmbeddedDocumentBinaryObject mimeCode="text/plain">${z.pih || ''}</cbc:EmbeddedDocumentBinaryObject></cac:Attachment></cac:AdditionalDocumentReference>
  <cac:AccountingSupplierParty>${party({ name: co.name, vat: co.vat, address: co.address }, true)}
  </cac:AccountingSupplierParty>
  <cac:AccountingCustomerParty>${cu ? party({ name: cu.name, vat: cu.vat, address: cu.address }, false) : '<cac:Party/>'}
  </cac:AccountingCustomerParty>
  <cac:Delivery><cbc:ActualDeliveryDate>${inv.date}</cbc:ActualDeliveryDate></cac:Delivery>
  <cac:PaymentMeans><cbc:PaymentMeansCode>${paymentCode(inv)}</cbc:PaymentMeansCode>${inv.kind !== 'invoice' ? `<cbc:InstructionNote>${esc(inv.reason)}</cbc:InstructionNote>` : ''}</cac:PaymentMeans>
  <cac:TaxTotal><cbc:TaxAmount currencyID="SAR">${M().plain(inv.totals.vat)}</cbc:TaxAmount></cac:TaxTotal>
  <cac:TaxTotal>
    <cbc:TaxAmount currencyID="SAR">${M().plain(inv.totals.vat)}</cbc:TaxAmount>${subtotals}
  </cac:TaxTotal>
  <cac:LegalMonetaryTotal>
    <cbc:LineExtensionAmount currencyID="SAR">${M().plain(inv.totals.net)}</cbc:LineExtensionAmount>
    <cbc:TaxExclusiveAmount currencyID="SAR">${M().plain(inv.totals.net)}</cbc:TaxExclusiveAmount>
    <cbc:TaxInclusiveAmount currencyID="SAR">${M().plain(inv.totals.total)}</cbc:TaxInclusiveAmount>
    <cbc:AllowanceTotalAmount currencyID="SAR">0.00</cbc:AllowanceTotalAmount>
    <cbc:PayableAmount currencyID="SAR">${M().plain(inv.totals.total)}</cbc:PayableAmount>
  </cac:LegalMonetaryTotal>${lines}
</Invoice>`;
  }
  // رموز UNTDID 4461: 10 نقدًا، 48 بطاقة، 30 تحويل/آجل، 1 غير محدد
  function paymentCode(inv) {
    const ms = (inv.payments || []).map(p => p.method);
    if (ms.length === 1) return { cash: '10', mada: '48', card: '48', credit: '30', bank: '42' }[ms[0]] || '1';
    return ms.length ? '1' : '30';
  }

  /** TLV: وسم (بايت) + طول (بايت) + القيمة UTF-8 */
  function tlv(fields) {
    const parts = [];
    for (const [tag, val] of fields) {
      const b = typeof val === 'string' ? C().utf8(val) : val;
      if (b.length > 255) throw new Error('TLV value too long for tag ' + tag);
      parts.push(tag, b.length, ...b);
    }
    return C().b64(new Uint8Array(parts));
  }
  function parseTLV(b64) {
    const b = C().unb64(b64); const out = []; let i = 0;
    const dec = new TextDecoder();
    while (i < b.length) { const t = b[i], l = b[i + 1]; out.push({ tag: t, value: dec.decode(b.slice(i + 2, i + 2 + l)) }); i += 2 + l; }
    return out;
  }

  const Zatca = {
    INITIAL_PIH, TYPE_CODE, KIND_LABEL, validVat, buildXML, tlv, parseTLV, subtype,

    hash(xml) { return C().sha256B64(xml); },

    /** الختم المحلي: يحدد ICV و PIH ويحسب التجزئة ورمز QR. chain = {icv, lastHash} لكل جهاز */
    stamp(inv, ctx, chain) {
      const icv = (chain.icv || 0) + 1;
      const pih = chain.lastHash || INITIAL_PIH;
      inv.zatca = { icv, pih, typeCode: TYPE_CODE[inv.kind], subtype: subtype(inv), status: 'pending', attempts: 0, history: [] };
      const xml = buildXML(inv, ctx);
      const hash = Zatca.hash(xml);
      inv.zatca.hash = hash;
      inv.zatca.qr = tlv([
        [1, (inv.seller || ctx.company).name], [2, (inv.seller || ctx.company).vat], [3, `${inv.date}T${inv.time}`],
        [4, M().plain(inv.totals.total)], [5, M().plain(inv.totals.vat)], [6, hash]
      ]);
      chain.icv = icv; chain.lastHash = hash;
      return inv.zatca;
    },

    /** إعادة احتساب التجزئة للتحقق من عدم العبث بالفاتورة */
    verify(inv, ctx) { return Zatca.hash(buildXML(inv, ctx)) === inv.zatca.hash; },

    /** تحقق محلي قبل الإصدار (قواعد مختارة) */
    validate(inv, ctx) {
      const errors = [], warnings = [];
      const co = inv.seller || ctx.company, cu = inv.buyer || ctx.customer;
      if (!validVat(co.vat)) errors.push('الرقم الضريبي للمنشأة يجب أن يكون 15 رقمًا يبدأ وينتهي بالرقم 3.');
      if (!co.name) errors.push('اسم المنشأة مطلوب.');
      if (!co.address || !co.address.city || !co.address.street) errors.push('عنوان المنشأة (المدينة والشارع) مطلوب.');
      if (inv.type === 'standard') {
        if (!cu) errors.push('الفاتورة الضريبية القياسية تتطلب بيانات المشتري.');
        else {
          if (!cu.name) errors.push('اسم المشتري مطلوب.');
          if (!validVat(cu.vat)) errors.push('الرقم الضريبي للمشتري غير صالح (15 رقمًا يبدأ وينتهي بـ 3).');
          if (!cu.address || !cu.address.city || !cu.address.street) errors.push('عنوان المشتري (المدينة والشارع) مطلوب للفاتورة القياسية.');
        }
      }
      if (inv.kind !== 'invoice') {
        if (!inv.refNumber) errors.push('الإشعار يجب أن يشير لرقم الفاتورة الأصلية.');
        if (!inv.reason) errors.push('سبب إصدار الإشعار مطلوب.');
      }
      if (!inv.lines.length) errors.push('الفاتورة بلا أصناف.');
      let net = 0, vat = 0;
      for (const l of inv.lines) {
        const expNet = M().mulQty(l.price, l.qty) - (l.discount || 0);
        if (expNet !== l.net) errors.push(`صافي السطر «${l.name}» غير مطابق للحساب.`);
        if (M().rate(l.net, l.vatRate) !== l.vat) errors.push(`ضريبة السطر «${l.name}» غير مطابقة.`);
        net += l.net; vat += l.vat;
      }
      if (net !== inv.totals.net || vat !== inv.totals.vat || net + vat !== inv.totals.total) errors.push('إجماليات الفاتورة لا تطابق مجموع السطور.');
      if (cu && cu.address && cu.address.building && !/^\d{4}$/.test(cu.address.building)) warnings.push('رقم المبنى للمشتري يجب أن يكون 4 أرقام.');
      return { errors, warnings };
    },

    /** محاكي منصة فاتورة — لا يتصل بالهيئة. idempotent حسب UUID */
    simulator: {
      seen: null,
      submit(inv, ctx, opts) {
        opts = opts || {};
        const z = inv.zatca; const sim = ctx.sim; // {accepted: {uuid: response}}
        z.attempts = (z.attempts || 0) + 1;
        if (opts.offline) {
          const r = { status: 'pending', at: opts.now, message: 'لا يوجد اتصال — الفاتورة في طابور الإرسال.' };
          z.history.push(r); return r;
        }
        if (sim.accepted[inv.id]) {
          const prev = sim.accepted[inv.id];
          const r = Object.assign({}, prev, { duplicate: true, at: opts.now, message: 'تم استلام هذه الفاتورة سابقًا (UUID مكرر) — لم تُسجل مرة أخرى.' });
          z.history.push(r); return r;
        }
        const v = Zatca.validate(inv, ctx);
        const strict = [];
        const cu = inv.buyer || ctx.customer;
        if (inv.type === 'standard' && cu && cu.address) {
          if (!/^\d{4}$/.test(cu.address.building || '')) strict.push('BR-KSA-37: رقم المبنى للمشتري يجب أن يتكون من 4 أرقام.');
          if (!/^\d{5}$/.test(cu.address.postal || '')) strict.push('BR-KSA-66: الرمز البريدي للمشتري يجب أن يتكون من 5 أرقام.');
        }
        if (!Zatca.verify(inv, ctx)) strict.push('تجزئة الفاتورة لا تطابق محتواها.');
        const errors = v.errors.concat(strict);
        let r;
        const mode = inv.type === 'standard' ? 'clearance' : 'reporting';
        if (errors.length) r = { status: 'rejected', mode, at: opts.now, errors, warnings: v.warnings, message: 'رفض المحاكي الفاتورة.' };
        else if (v.warnings.length) r = { status: mode === 'clearance' ? 'cleared' : 'reported', mode, at: opts.now, warnings: v.warnings, message: 'قُبلت مع تحذيرات (محاكاة).' };
        else r = { status: mode === 'clearance' ? 'cleared' : 'reported', mode, at: opts.now, message: mode === 'clearance' ? 'اعتُمدت (محاكاة).' : 'أُبلغ عنها (محاكاة).' };
        if (r.status !== 'rejected') sim.accepted[inv.id] = { status: r.status, mode, at: r.at };
        z.history.push(r); if (z.history.length > 3) z.history.splice(0, z.history.length - 3);
        z.status = r.status; z.lastMessage = r.message; z.errors = r.errors || []; z.warnings = r.warnings || [];
        return r;
      }
    }
  };

  Florix.Zatca = Zatca;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* FLORIX فلوريكس — محرك المزامنة (Outbox Pattern)
 * - كل عملية تُكتب محليًا ثم تُضاف لطابور الإرسال بمعرف UUID فريد.
 * - الخادم المركزي (هنا: محاكاة) يطبق العملية مرة واحدة فقط حسب معرفها (Idempotent).
 * - المعاملات المالية إلحاقية فقط (append-only) ولا تُكتب فوق بيانات مركزية.
 * - البيانات الرئيسية (الأصناف/الأسعار) يملكها المركز؛ التعديل الفرعي يحمل رقم الإصدار، والتعارض يُسجل للمعالجة.
 * - أرقام الفواتير تحمل بادئة الجهاز (فرع-جهاز-تسلسل) فلا تتضارب بين الفروع.
 */
(function (root) {
  'use strict';
  const Florix = root.Florix = root.Florix || {};
  const S = () => Florix.Store;

  const MAX_ATTEMPTS = 6;
  const OWNERSHIP = {
    sale: 'branch', return: 'branch', shift: 'branch', receipt: 'branch', expense: 'branch', stock: 'branch', transfer: 'branch',
    purchase: 'branch', journal: 'branch', zatca: 'branch',
    product: 'central', price: 'central', customer: 'shared', supplier: 'central', user: 'central', company: 'central'
  };

  function log(branchId, level, msg, extra) {
    const st = S().state;
    st.syncLog.unshift({ id: S().uuid(), at: S().now(), branchId, level, msg, extra: extra || null });
    if (st.syncLog.length > 400) st.syncLog.length = 400;
  }

  const Sync = {
    OWNERSHIP, MAX_ATTEMPTS,
    enqueue(entity, op, entityId, payload, branchId) {
      const st = S().state;
      const item = {
        id: S().uuid(), entity, op, entityId, branchId: branchId || S().branchId(),
        deviceId: S().session && S().session.deviceId || null, createdAt: S().now(),
        payload: payload || null, attempts: 0, status: 'pending', nextAt: 0, lastError: null
      };
      st.syncQueue.push(item);
      return item;
    },
    pending(branchId) { return S().state.syncQueue.filter(q => (q.status === 'pending' || q.status === 'retry') && (!branchId || q.branchId === branchId)); },
    failed(branchId) { return S().state.syncQueue.filter(q => q.status === 'failed' && (!branchId || q.branchId === branchId)); },
    branchState(branchId) { const b = S().get('branches', branchId); return b; },

    /** الخادم المركزي المحاكى: يطبق العملية مرة واحدة */
    serverApply(item) {
      const c = S().state.central;
      if (c.applied[item.id]) return { ok: true, duplicate: true };
      // تعارض البيانات الرئيسية: الإصدار الأساسي أقدم من إصدار المركز
      if (item.entity === 'product' && item.payload && item.payload.baseVersion !== undefined) {
        const cur = c.versions[item.entityId] || 0;
        if (cur > item.payload.baseVersion) {
          S().state.conflicts.push({ id: S().uuid(), at: S().now(), itemId: item.id, entity: item.entity, entityId: item.entityId,
            branchId: item.branchId, local: item.payload.changes, central: c.values[item.entityId] || {}, status: 'open' });
          c.applied[item.id] = S().now();
          return { ok: true, conflict: true };
        }
        c.versions[item.entityId] = cur + 1; c.values[item.entityId] = Object.assign({}, c.values[item.entityId], item.payload.changes);
      }
      // منع تكرار رقم الفاتورة على مستوى المركز
      if (item.entity === 'sale' && item.payload && item.payload.number) {
        const k = item.payload.number;
        if (c.invoiceNumbers[k] && c.invoiceNumbers[k] !== item.entityId) return { ok: false, error: 'رقم فاتورة مكرر في المركز: ' + k };
        c.invoiceNumbers[k] = item.entityId;
      }
      c.applied[item.id] = S().now();
      c.count = (c.count || 0) + 1;
      return { ok: true };
    },

    /** معالجة طابور فرع. failRate لمحاكاة فشل الشبكة */
    process(branchId, opts) {
      opts = opts || {};
      const st = S().state; const b = S().get('branches', branchId);
      const res = { sent: 0, dup: 0, failed: 0, conflicts: 0, skipped: false };
      if (!b) return res;
      if (!b.online) { res.skipped = true; if (opts.manual) log(branchId, 'warn', 'تعذرت المزامنة: الفرع غير متصل.'); return res; }
      const now = Date.now();
      const batch = Sync.pending(branchId).filter(q => opts.manual || q.nextAt <= now).slice(0, opts.batch || 50);
      if (!batch.length) { b.lastSync = S().now(); if (opts.manual) log(branchId, 'info', 'لا توجد عمليات معلقة.'); return res; }
      const failRate = st.settings.sync.failRate || 0;
      for (const q of batch) {
        q.attempts++;
        let r;
        if (Math.random() * 100 < failRate) r = { ok: false, error: 'انتهت مهلة الاتصال بالخادم المركزي (محاكاة).' };
        else r = Sync.serverApply(q);
        if (r.ok) {
          q.status = 'sent'; q.sentAt = S().now(); q.lastError = null; res.sent++;
          if (r.duplicate) res.dup++;
          if (r.conflict) res.conflicts++;
        } else {
          q.lastError = r.error;
          if (q.attempts >= MAX_ATTEMPTS) { q.status = 'failed'; res.failed++; log(branchId, 'error', `فشل إرسال ${q.entity} بعد ${q.attempts} محاولات: ${r.error}`, q.id); }
          else { q.status = 'retry'; q.nextAt = now + Math.min(300000, 5000 * Math.pow(2, q.attempts - 1)); res.failed++; }
        }
      }
      b.lastSync = S().now();
      log(branchId, res.failed ? 'warn' : 'info', `أُرسلت ${res.sent} عملية` + (res.failed ? `، وفشلت ${res.failed} (ستُعاد المحاولة)` : '') + (res.conflicts ? `، وسُجل ${res.conflicts} تعارض` : ''));
      // تنظيف العمليات المرسلة القديمة من الطابور المحلي (تبقى في سجل المركز)
      const sent = st.syncQueue.filter(q => q.status === 'sent');
      if (sent.length > 300) { const drop = new Set(sent.slice(0, sent.length - 300).map(q => q.id)); st.syncQueue = st.syncQueue.filter(q => !drop.has(q.id)); }
      return res;
    },

    /** إعادة إرسال آخر العمليات المرسلة لإثبات عدم التكرار */
    resend(branchId, n) {
      const sent = S().state.syncQueue.filter(q => q.status === 'sent' && q.branchId === branchId).slice(-(n || 10));
      let dup = 0, applied = 0;
      for (const q of sent) { const r = Sync.serverApply(q); if (r.duplicate) dup++; else applied++; }
      log(branchId, 'info', `اختبار عدم التكرار: أُعيد إرسال ${sent.length} عملية، تجاهل المركز ${dup} مكررة، وطُبقت ${applied}.`);
      return { total: sent.length, dup, applied };
    },
    retryFailed(branchId) {
      for (const q of Sync.failed(branchId)) { q.status = 'retry'; q.attempts = 0; q.nextAt = 0; }
      log(branchId, 'info', 'أُعيدت العمليات الفاشلة إلى الطابور.');
    },
    resolveConflict(id, keep) {
      const c = S().state.conflicts.find(x => x.id === id); if (!c) return;
      const p = S().get('products', c.entityId);
      if (keep === 'central') { if (p) Object.assign(p, c.central); }
      else {
        const cen = S().state.central; cen.versions[c.entityId] = (cen.versions[c.entityId] || 0) + 1;
        cen.values[c.entityId] = Object.assign({}, cen.values[c.entityId], c.local);
      }
      c.status = 'resolved'; c.resolution = keep; c.resolvedAt = S().now();
      S().audit('sync.conflict.resolve', 'conflict', id, keep === 'central' ? 'اعتماد قيمة المركز' : 'اعتماد قيمة الفرع');
    },
    log
  };

  Florix.Sync = Sync;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* FLORIX فلوريكس — طبقة العمليات (Service Layer)
 * كل عملية تجارية: تحقق + صلاحية → حركة مخزون → قيد محاسبي مرتبط بالمصدر → سجل تدقيق → طابور مزامنة.
 * لا توجد عملية تعدّل مستندًا ماليًا مرحّلًا؛ التصحيح يكون بمستند مقابل (مرتجع، إشعار، قيد عكسي).
 */
(function (root) {
  'use strict';
  const Florix = root.Florix = root.Florix || {};
  const S = () => Florix.Store, M = () => Florix.Money, A = () => Florix.Acc, I = () => Florix.Inv,
    Z = () => Florix.Zatca, Y = () => Florix.Sync, AU = () => Florix.Auth;

  const map = () => S().state.settings.accounts;
  const st = () => S().state;
  const need = perm => { if (!S().silent) AU().require(perm); };
  const branchOf = id => { const b = S().get('branches', id); if (!b) throw new Error('الفرع غير موجود.'); return b; };
  const dt = o => ({ date: (o && o.date) || S().today(), time: (o && o.time) || S().timeOf() });

  function finish(entity, op, id, payload, branchId, auditMsg) {
    S().audit(entity + '.' + op, entity, id, auditMsg || '');
    if (!S().silent || S()._enqueueDuringSeed) Y().enqueue(entity, op, id, payload, branchId);
    S().save(); S().emit(entity);
  }
  function zctx(customerId) {
    return { company: st().company, customer: customerId ? S().get('customers', customerId) : null, sim: st().zatcaSim };
  }
  /** لقطة من بيانات البائع والمشتري وقت الإصدار — لا تتغير الفاتورة إذا عُدّلت البيانات الرئيسية لاحقًا */
  function snap(inv) {
    const co = st().company; inv.seller = { name: co.name, vat: co.vat, cr: co.cr, address: Object.assign({}, co.address) };
    const c = inv.customerId && S().get('customers', inv.customerId);
    if (c) inv.buyer = { name: c.name, vat: c.vat || '', address: Object.assign({}, c.address) };
    return inv;
  }
  function chain(deviceId) { const c = st().zatcaChains; return c[deviceId] || (c[deviceId] = { icv: 0, lastHash: null }); }

  /** حساب سطر فاتورة */
  function line(p, qty, price, discount, unit) {
    unit = unit || null;
    const factor = unit ? unit.factor : 1;
    const gross = M().mulQty(price, qty);
    const disc = Math.max(0, Math.min(discount || 0, gross));
    const net = gross - disc;
    const vat = M().rate(net, p.vatRate);
    return { pid: p.id, name: p.nameAr + (unit ? ' (' + unit.name + ')' : ''), qty: M().qty(qty), unitName: unit ? unit.name : p.unit, factor,
      price, discount: disc, vatRate: p.vatRate, net, vat, total: net + vat, returnedQty: 0 };
  }
  function totals(lines) {
    const net = M().sum(lines, l => l.net), vat = M().sum(lines, l => l.vat), discount = M().sum(lines, l => l.discount);
    return { net, vat, total: net + vat, discount, gross: net + discount };
  }
  const payAcc = (method, b) => method === 'cash' ? b.cashAccount : method === 'credit' ? map().ar : map().cardClearing;

  const Ops = {
    line, totals,

    /* ============ المبيعات ============ */
    sale(o) {
      need('pos.sell');
      const b = branchOf(o.branchId);
      const dev = S().get('devices', o.deviceId);
      if (!dev) throw new Error('جهاز البيع غير محدد.');
      if (!o.lines || !o.lines.length) throw new Error('الفاتورة لا تحتوي أصنافًا.');
      const { date, time } = dt(o);
      const lines = o.lines.map(x => {
        const p = S().get('products', x.pid);
        if (!p) throw new Error('صنف غير موجود.');
        const unit = x.unitName ? (p.altUnits || []).find(u => u.name === x.unitName) : null;
        const basePrice = unit ? unit.price : p.price;
        const price = x.price !== undefined ? x.price : basePrice;
        if (price !== basePrice) need('pos.price');
        return line(p, x.qty, price, x.discount || 0, unit);
      });
      const t = totals(lines);
      if (t.discount > 0 && !S().silent) {
        need('pos.discount');
        const pct = t.discount * 100 / (t.gross || 1);
        if (pct > AU().maxDiscount() + 1e-9) throw new Error(`الخصم ${pct.toFixed(1)}% يتجاوز الحد المسموح لدورك (${AU().maxDiscount()}%).`);
      }
      const payments = (o.payments || []).filter(p => p.amount > 0);
      const paid = M().sum(payments, p => p.amount);
      if (paid !== t.total) throw new Error(`مجموع المدفوعات ${M().fmt(paid)} لا يساوي إجمالي الفاتورة ${M().fmt(t.total)}.`);
      const credit = M().sum(payments.filter(p => p.method === 'credit'), p => p.amount);
      const cust = o.customerId ? S().get('customers', o.customerId) : null;
      if (credit > 0) {
        need('pos.credit');
        if (!cust) throw new Error('البيع الآجل يتطلب اختيار عميل.');
        const bal = Ops.customerBalance(cust.id);
        if (cust.creditLimit && bal + credit > cust.creditLimit) throw new Error(`تجاوز حد الائتمان للعميل: الرصيد ${M().fmt(bal)} + ${M().fmt(credit)} > الحد ${M().fmt(cust.creditLimit)}.`);
      }
      const type = o.type === 'standard' ? 'standard' : 'simplified';
      const seq = S().seq('inv.' + dev.id);
      const inv = {
        id: S().uuid(), number: `${b.code}-${dev.code}-${String(seq).padStart(6, '0')}`, kind: 'invoice', type,
        branchId: b.id, deviceId: dev.id, shiftId: o.shiftId || null, customerId: cust ? cust.id : null,
        date, time, lines, totals: t, payments, userId: S().user() ? S().user().id : null, status: 'posted',
        orderId: o.orderId || null, source: o.source || 'pos', createdAt: S().now()
      };
      snap(inv);
      const v = Z().validate(inv, zctx(inv.customerId));
      if (v.errors.length) throw new Error('لا يمكن إصدار الفاتورة:\n' + v.errors.join('\n'));
      // المخزون
      const wh = b.mainWh; let cogs = 0;
      for (const l of lines) {
        const p = S().get('products', l.pid); if (p.service) { l.cost = 0; continue; }
        const r = I().issue({ pid: l.pid, wh, qty: M().qty(l.qty * l.factor), type: 'sale', ref: { type: 'sale', id: inv.id, no: inv.number }, date });
        l.cost = r.cost; cogs += r.cost;
      }
      inv.totals.cost = cogs;
      // القيد
      const jl = [];
      for (const p of payments) jl.push({ acc: payAcc(p.method, b), dr: p.amount, party: p.method === 'credit' ? cust.id : null });
      jl.push({ acc: map().sales, cr: t.net });
      if (t.vat) jl.push({ acc: map().vatOut, cr: t.vat });
      if (cogs) { jl.push({ acc: map().cogs, dr: cogs }); jl.push({ acc: map().inventory, cr: cogs }); }
      const j = A().post({ date, branchId: b.id, memo: `فاتورة مبيعات ${inv.number}`, source: { type: 'sale', id: inv.id, no: inv.number }, lines: mergeLines(jl) });
      inv.journalId = j.id;
      Z().stamp(inv, zctx(inv.customerId), chain(dev.id));
      st().invoices.push(inv);
      Ops.zatcaSubmit(inv, { silentQueue: true });
      finish('sale', 'create', inv.id, { number: inv.number, total: t.total }, b.id, inv.number);
      return inv;
    },

    /** إشعار دائن (مرتجع مبيعات) مرتبط بالفاتورة الأصلية */
    creditNote(o) {
      need('pos.return');
      const orig = S().get('invoices', o.invoiceId);
      if (!orig || orig.kind !== 'invoice') throw new Error('الفاتورة الأصلية غير موجودة.');
      if (!o.reason) throw new Error('سبب المرتجع مطلوب.');
      const b = branchOf(orig.branchId);
      const { date, time } = dt(o);
      const lines = [];
      for (const r of o.lines) {
        const ol = orig.lines[r.index]; if (!ol || !(r.qty > 0)) continue;
        const avail = M().qty(ol.qty - (ol.returnedQty || 0));
        if (r.qty > avail + 1e-9) throw new Error(`كمية المرتجع من «${ol.name}» تتجاوز المتاح (${M().fmtQty(avail)}).`);
        const disc = ol.discount ? M().divRound(ol.discount * Math.round(r.qty * 1000), Math.round(ol.qty * 1000)) : 0;
        const p = S().get('products', ol.pid);
        const nl = line(p, r.qty, ol.price, disc, ol.factor !== 1 ? { name: ol.unitName, factor: ol.factor, price: ol.price } : null);
        nl.name = ol.name; nl.origIndex = r.index;
        nl.cost = ol.cost ? M().divRound(ol.cost * Math.round(r.qty * 1000), Math.round(ol.qty * 1000)) : 0;
        lines.push(nl);
      }
      if (!lines.length) throw new Error('حدد كمية مرتجعة واحدة على الأقل.');
      const t = totals(lines);
      const dev = S().get('devices', o.deviceId || orig.deviceId);
      const origCredit = orig.payments.some(p => p.method === 'credit');
      const method = o.refund || (origCredit ? 'credit' : 'cash');
      const seq = S().seq('inv.' + dev.id);
      const cn = {
        id: S().uuid(), number: `${b.code}-${dev.code}-CN${String(seq).padStart(6, '0')}`, kind: 'credit', type: orig.type,
        refId: orig.id, refNumber: orig.number, reason: o.reason, branchId: b.id, deviceId: dev.id, shiftId: o.shiftId || null,
        customerId: orig.customerId, date, time, lines, totals: t, payments: [{ method, amount: t.total }],
        userId: S().user() ? S().user().id : null, status: 'posted', createdAt: S().now()
      };
      if (method === 'credit' && !cn.customerId) throw new Error('لا يمكن رد المبلغ على حساب عميل لفاتورة بلا عميل.');
      snap(cn);
      const v = Z().validate(cn, zctx(cn.customerId));
      if (v.errors.length) throw new Error(v.errors.join('\n'));
      let cost = 0;
      for (const l of lines) {
        const p = S().get('products', l.pid); if (p.service || !l.cost) continue;
        I().receive({ pid: l.pid, wh: b.mainWh, qty: M().qty(l.qty * l.factor), cost: l.cost, type: 'sale-return', ref: { type: 'credit', id: cn.id, no: cn.number }, date });
        cost += l.cost;
      }
      cn.totals.cost = cost;
      const jl = [{ acc: map().salesReturns, dr: t.net }];
      if (t.vat) jl.push({ acc: map().vatOut, dr: t.vat });
      jl.push({ acc: payAcc(method, b), cr: t.total, party: method === 'credit' ? cn.customerId : null });
      if (cost) { jl.push({ acc: map().inventory, dr: cost }); jl.push({ acc: map().cogs, cr: cost }); }
      const j = A().post({ date, branchId: b.id, memo: `إشعار دائن ${cn.number} عن ${orig.number}`, source: { type: 'credit', id: cn.id, no: cn.number }, lines: mergeLines(jl) });
      cn.journalId = j.id;
      for (const l of lines) { const ol = orig.lines[l.origIndex]; ol.returnedQty = M().qty((ol.returnedQty || 0) + l.qty); }
      Z().stamp(cn, zctx(cn.customerId), chain(dev.id));
      st().invoices.push(cn);
      Ops.zatcaSubmit(cn, { silentQueue: true });
      finish('return', 'create', cn.id, { number: cn.number, ref: orig.number }, b.id, `${cn.number} ← ${orig.number}`);
      return cn;
    },

    /** إشعار مدين: زيادة على فاتورة سابقة (فرق سعر مثلاً) */
    debitNote(o) {
      need('sal.create');
      const orig = S().get('invoices', o.invoiceId);
      if (!orig || orig.kind !== 'invoice') throw new Error('الفاتورة الأصلية غير موجودة.');
      if (!o.reason) throw new Error('سبب الإشعار مطلوب.');
      if (!(o.amount > 0)) throw new Error('المبلغ يجب أن يكون أكبر من صفر.');
      const b = branchOf(orig.branchId); const { date, time } = dt(o);
      const vatRate = o.vatRate === undefined ? 1500 : o.vatRate;
      const net = o.amount, vat = M().rate(net, vatRate);
      const lines = [{ pid: null, name: 'تعديل: ' + o.reason, qty: 1, unitName: 'خدمة', factor: 1, price: net, discount: 0, vatRate, net, vat, total: net + vat, cost: 0 }];
      const t = totals(lines);
      const dev = S().get('devices', orig.deviceId);
      const method = orig.customerId ? 'credit' : 'cash';
      const seq = S().seq('inv.' + dev.id);
      const dn = { id: S().uuid(), number: `${b.code}-${dev.code}-DN${String(seq).padStart(6, '0')}`, kind: 'debit', type: orig.type,
        refId: orig.id, refNumber: orig.number, reason: o.reason, branchId: b.id, deviceId: dev.id, customerId: orig.customerId,
        date, time, lines, totals: t, payments: [{ method, amount: t.total }], userId: S().user() && S().user().id, status: 'posted', createdAt: S().now() };
      snap(dn); const v = Z().validate(dn, zctx(dn.customerId)); if (v.errors.length) throw new Error(v.errors.join('\n'));
      const j = A().post({ date, branchId: b.id, memo: `إشعار مدين ${dn.number}`, source: { type: 'debit', id: dn.id, no: dn.number },
        lines: [{ acc: payAcc(method, b), dr: t.total, party: method === 'credit' ? dn.customerId : null }, { acc: map().sales, cr: net }, ...(vat ? [{ acc: map().vatOut, cr: vat }] : [])] });
      dn.journalId = j.id;
      Z().stamp(dn, zctx(dn.customerId), chain(dev.id));
      st().invoices.push(dn);
      Ops.zatcaSubmit(dn, { silentQueue: true });
      finish('sale', 'debit', dn.id, { number: dn.number }, b.id, dn.number);
      return dn;
    },

    zatcaSubmit(inv, opts) {
      const b = S().get('branches', inv.branchId);
      const r = Z().simulator.submit(inv, zctx(inv.customerId), { offline: !b.online, now: S().now() });
      if (!(opts && opts.silentQueue)) { S().audit('zatca.submit', 'invoice', inv.id, `${inv.number}: ${r.status}`); S().save(); S().emit('zatca'); }
      return r;
    },
    zatcaRetry(branchId) {
      let n = 0;
      for (const inv of st().invoices) {
        if ((!branchId || inv.branchId === branchId) && inv.zatca && inv.zatca.status === 'pending') { Ops.zatcaSubmit(inv, { silentQueue: true }); n++; }
      }
      S().audit('zatca.retry', 'invoice', null, `${n} فاتورة`); S().save(); S().emit('zatca');
      return n;
    },

    /* ============ عروض الأسعار وأوامر البيع ============ */
    quote(o) {
      need('sal.create');
      const lines = o.lines.map(x => { const p = S().get('products', x.pid); return line(p, x.qty, x.price !== undefined ? x.price : Ops.priceFor(p, o.customerId), x.discount || 0); });
      const q = { id: S().uuid(), number: 'QT-' + String(S().seq('qt')).padStart(5, '0'), branchId: o.branchId, customerId: o.customerId,
        date: dt(o).date, validUntil: o.validUntil || null, lines, totals: totals(lines), status: 'open', userId: S().user() && S().user().id };
      st().quotes.push(q); finish('sale', 'quote', q.id, null, o.branchId, q.number); return q;
    },
    quoteToOrder(id) {
      need('sal.create');
      const q = S().get('quotes', id); if (!q || q.status !== 'open') throw new Error('عرض السعر غير متاح للتحويل.');
      const so = { id: S().uuid(), number: 'SO-' + String(S().seq('so')).padStart(5, '0'), quoteId: q.id, branchId: q.branchId, customerId: q.customerId,
        date: S().today(), lines: q.lines.map(l => ({ ...l })), totals: q.totals, status: 'open', userId: S().user() && S().user().id };
      q.status = 'ordered'; st().salesOrders.push(so); finish('sale', 'order', so.id, null, so.branchId, so.number); return so;
    },
    orderToInvoice(id, payMethod) {
      const so = S().get('salesOrders', id); if (!so || so.status !== 'open') throw new Error('أمر البيع غير متاح.');
      const b = branchOf(so.branchId); const cust = S().get('customers', so.customerId);
      const dev = st().devices.find(d => d.branchId === b.id && d.code === 'BO');
      const t = so.totals;
      const inv = Ops.sale({ branchId: b.id, deviceId: dev.id, customerId: cust.id, type: Z().validVat(cust.vat) ? 'standard' : 'simplified', source: 'sales',
        lines: so.lines.map(l => ({ pid: l.pid, qty: l.qty, price: l.price, discount: l.discount })), payments: [{ method: payMethod || 'credit', amount: t.total }], orderId: so.id });
      so.status = 'invoiced'; so.invoiceId = inv.id; S().save(); S().emit('sale');
      return inv;
    },
    priceFor(p, customerId) {
      const c = customerId && S().get('customers', customerId);
      const pl = c && c.priceListId && S().get('priceLists', c.priceListId);
      if (!pl || !pl.pct) return p.price;
      return p.price + M().rate(p.price, pl.pct * 100); // pct موجب زيادة، سالب خصم
    },

    /* ============ التحصيلات ============ */
    receipt(o) {
      need('sal.collect');
      const c = S().get('customers', o.customerId); if (!c) throw new Error('اختر العميل.');
      if (!(o.amount > 0)) throw new Error('المبلغ يجب أن يكون أكبر من صفر.');
      const b = branchOf(o.branchId); const { date } = dt(o);
      const acc = o.method === 'bank' ? (o.bankAccount || st().banks[0].account) : b.cashAccount;
      const r = { id: S().uuid(), number: 'RV-' + String(S().seq('rv')).padStart(6, '0'), customerId: c.id, branchId: b.id, date, amount: o.amount, method: o.method || 'cash', account: acc, note: o.note || '', userId: S().user() && S().user().id };
      const j = A().post({ date, branchId: b.id, memo: `سند قبض ${r.number} من ${c.name}`, source: { type: 'receipt', id: r.id, no: r.number },
        lines: [{ acc, dr: o.amount }, { acc: map().ar, cr: o.amount, party: c.id }] });
      r.journalId = j.id; st().receipts.push(r);
      finish('receipt', 'create', r.id, { amount: o.amount }, b.id, `${r.number} ${M().fmt(o.amount)}`);
      return r;
    },

    /* ============ المصروفات ============ */
    expense(o) {
      need('exp.create');
      if (!(o.amount > 0)) throw new Error('المبلغ يجب أن يكون أكبر من صفر.');
      const b = branchOf(o.branchId); const { date } = dt(o);
      if (!A().account(o.account) || !A().isLeaf(o.account)) throw new Error('حساب المصروف غير صالح.');
      const vat = M().rate(o.amount, o.vatRate || 0);
      const from = o.paidFrom || b.cashAccount;
      const e = { id: S().uuid(), number: 'EX-' + String(S().seq('ex')).padStart(6, '0'), branchId: b.id, date, account: o.account, amount: o.amount, vat, paidFrom: from, cc: o.cc || null, note: o.note || '', userId: S().user() && S().user().id };
      const lines = [{ acc: o.account, dr: o.amount, cc: o.cc }];
      if (vat) lines.push({ acc: map().vatIn, dr: vat });
      lines.push({ acc: from, cr: o.amount + vat });
      const j = A().post({ date, branchId: b.id, memo: `مصروف ${e.number}: ${o.note || A().account(o.account).name}`, source: { type: 'expense', id: e.id, no: e.number }, lines });
      e.journalId = j.id; st().expenses.push(e);
      finish('expense', 'create', e.id, { amount: o.amount }, b.id, e.number);
      return e;
    },

    /* ============ المشتريات: طلب ← عرض ← أمر ← استلام ← فاتورة ← سداد ============ */
    _pdoc(stage, o, extra) {
      const pre = { PR: 'PR', RFQ: 'RFQ', PO: 'PO', GRN: 'GRN', PINV: 'PI', PRET: 'PRN' }[stage];
      const d = Object.assign({ id: S().uuid(), stage, number: pre + '-' + String(S().seq('p.' + stage)).padStart(5, '0'), date: dt(o).date,
        branchId: o.branchId, supplierId: o.supplierId || null, userId: S().user() && S().user().id, createdAt: S().now() }, extra);
      st().purchaseDocs.push(d); return d;
    },
    pLines(lines) {
      return lines.map(x => {
        const p = S().get('products', x.pid);
        const price = x.price !== undefined ? x.price : p.cost; const net = M().mulQty(price, x.qty);
        return { pid: p.id, name: p.nameAr, qty: M().qty(x.qty), price, net, vatRate: p.vatRate, vat: M().rate(net, p.vatRate), batch: x.batch || null, expiry: x.expiry || null };
      });
    },
    purchaseRequest(o) {
      need('pur.create');
      if (!o.lines.length) throw new Error('أضف صنفًا واحدًا على الأقل.');
      const d = Ops._pdoc('PR', o, { lines: Ops.pLines(o.lines), status: 'open', note: o.note || '' });
      finish('purchase', 'request', d.id, null, o.branchId, d.number); return d;
    },
    toRFQ(prId, supplierId, prices) {
      need('pur.create');
      const pr = S().get('purchaseDocs', prId); if (!pr || pr.status !== 'open') throw new Error('طلب الشراء غير متاح.');
      if (!supplierId) throw new Error('اختر المورد.');
      const d = Ops._pdoc('RFQ', { branchId: pr.branchId, supplierId }, { from: pr.id, lines: Ops.pLines(pr.lines.map((l, i) => ({ pid: l.pid, qty: l.qty, price: prices && prices[i] !== undefined ? prices[i] : l.price }))), status: 'open' });
      pr.status = 'converted'; finish('purchase', 'rfq', d.id, null, pr.branchId, d.number); return d;
    },
    toPO(rfqId) {
      need('pur.create');
      const q = S().get('purchaseDocs', rfqId); if (!q || q.status !== 'open') throw new Error('عرض السعر غير متاح.');
      const lines = q.lines.map(l => ({ ...l, received: 0 }));
      const d = Ops._pdoc('PO', { branchId: q.branchId, supplierId: q.supplierId }, { from: q.id, lines, status: 'pending_approval', approvals: [],
        total: M().sum(lines, l => l.net + l.vat) });
      q.status = 'converted'; finish('purchase', 'po', d.id, null, q.branchId, d.number); return d;
    },
    approvePO(id) {
      need('pur.approve');
      const po = S().get('purchaseDocs', id); if (!po || po.status !== 'pending_approval') throw new Error('أمر الشراء ليس بانتظار الاعتماد.');
      const r = AU().role(); const limit = r ? r.approvalLimit : 0;
      if (!S().silent && limit !== null && limit !== undefined && limit >= 0 && po.total > limit) throw new Error(`قيمة الأمر ${M().fmt(po.total)} تتجاوز حد اعتمادك (${M().fmt(limit)}).`);
      po.approvals.push({ userId: S().user() && S().user().id, at: S().now() }); po.status = 'approved';
      finish('purchase', 'approve', po.id, null, po.branchId, po.number); return po;
    },
    receiveGoods(poId, recv, o) {
      need('pur.create');
      const po = S().get('purchaseDocs', poId);
      if (!po || !['approved', 'partial'].includes(po.status)) throw new Error('أمر الشراء غير معتمد أو مستلم بالكامل.');
      const b = branchOf(po.branchId); const { date } = dt(o);
      const wh = (o && o.wh) || b.mainWh;
      const lines = [];
      po.lines.forEach((l, i) => {
        const r = recv ? recv[i] : { qty: M().qty(l.qty - l.received) };
        if (!r || !(r.qty > 0)) return;
        if (r.qty > l.qty - l.received + 1e-9) throw new Error(`الكمية المستلمة من «${l.name}» تتجاوز المطلوب.`);
        const net = M().mulQty(l.price, r.qty);
        lines.push({ pid: l.pid, name: l.name, qty: r.qty, price: l.price, net, vatRate: l.vatRate, vat: M().rate(net, l.vatRate), batch: r.batch || null, expiry: r.expiry || null, poIndex: i });
      });
      if (!lines.length) throw new Error('لا توجد كميات للاستلام.');
      const g = Ops._pdoc('GRN', { branchId: po.branchId, supplierId: po.supplierId, date }, { from: po.id, wh, lines, status: 'uninvoiced' });
      for (const l of lines) {
        const p = S().get('products', l.pid);
        I().receive({ pid: l.pid, wh, qty: l.qty, cost: l.net, type: 'purchase', ref: { type: 'grn', id: g.id, no: g.number }, date, batch: p.trackBatch ? (l.batch || 'B' + date.replace(/-/g, '')) : null, expiry: l.expiry });
        po.lines[l.poIndex].received = M().qty(po.lines[l.poIndex].received + l.qty);
      }
      const value = M().sum(lines, l => l.net);
      const j = A().post({ date, branchId: b.id, memo: `استلام بضاعة ${g.number} لأمر ${po.number}`, source: { type: 'grn', id: g.id, no: g.number },
        lines: [{ acc: map().inventory, dr: value }, { acc: map().grni, cr: value, party: po.supplierId }] });
      g.journalId = j.id;
      po.status = po.lines.every(l => l.received >= l.qty - 1e-9) ? 'received' : 'partial';
      finish('purchase', 'grn', g.id, null, b.id, g.number); return g;
    },
    supplierInvoice(grnId, o) {
      need('pur.create');
      const g = S().get('purchaseDocs', grnId); if (!g || g.status !== 'uninvoiced') throw new Error('سند الاستلام مفوتر مسبقًا أو غير موجود.');
      const b = branchOf(g.branchId); const { date } = dt(o);
      const goods = M().sum(g.lines, l => l.net), vatGoods = M().sum(g.lines, l => l.vat);
      const extra = (o && o.extra) || 0, extraVat = M().rate(extra, extra ? 1500 : 0);
      const total = goods + vatGoods + extra + extraVat;
      const d = Ops._pdoc('PINV', { branchId: g.branchId, supplierId: g.supplierId, date }, { from: g.id, supplierRef: (o && o.supplierRef) || '', lines: g.lines.map(l => ({ ...l })),
        goods, extra, vat: vatGoods + extraVat, total, paid: 0, returned: 0, status: 'unpaid', dueDate: (o && o.dueDate) || null });
      const lines = [{ acc: map().grni, dr: goods, party: g.supplierId }];
      if (extra) lines.push({ acc: map().purchaseExp, dr: extra, note: 'مصروفات مرتبطة بالمشتريات' });
      if (vatGoods + extraVat) lines.push({ acc: map().vatIn, dr: vatGoods + extraVat });
      lines.push({ acc: map().ap, cr: total, party: g.supplierId });
      const j = A().post({ date, branchId: b.id, memo: `فاتورة مورد ${d.number} (${d.supplierRef})`, source: { type: 'pinv', id: d.id, no: d.number }, lines });
      d.journalId = j.id; g.status = 'invoiced';
      finish('purchase', 'invoice', d.id, null, b.id, d.number); return d;
    },
    paySupplier(pinvId, amount, o) {
      need('pur.pay');
      const d = S().get('purchaseDocs', pinvId); if (!d || d.stage !== 'PINV') throw new Error('فاتورة المورد غير موجودة.');
      const due = d.total - d.paid - d.returned;
      if (!(amount > 0) || amount > due) throw new Error(`المبلغ يجب أن يكون بين 0.01 و ${M().fmt(due)}.`);
      const b = branchOf(d.branchId); const { date } = dt(o);
      const from = (o && o.from) || st().banks[0].account;
      const pv = { id: S().uuid(), number: 'PV-' + String(S().seq('pv')).padStart(6, '0'), pinvId: d.id, supplierId: d.supplierId, branchId: b.id, date, amount, from, userId: S().user() && S().user().id };
      const j = A().post({ date, branchId: b.id, memo: `سند صرف ${pv.number} لفاتورة ${d.number}`, source: { type: 'payment', id: pv.id, no: pv.number },
        lines: [{ acc: map().ap, dr: amount, party: d.supplierId }, { acc: from, cr: amount }] });
      pv.journalId = j.id; st().supplierPayments.push(pv);
      d.paid += amount; d.status = d.paid + d.returned >= d.total ? 'paid' : 'partial';
      finish('purchase', 'pay', pv.id, { amount }, b.id, pv.number); return pv;
    },
    purchaseReturn(pinvId, rets, o) {
      need('pur.create');
      const d = S().get('purchaseDocs', pinvId); if (!d || d.stage !== 'PINV') throw new Error('فاتورة المورد غير موجودة.');
      if (!o || !o.reason) throw new Error('سبب المرتجع مطلوب.');
      const b = branchOf(d.branchId); const { date } = dt(o); const g = S().get('purchaseDocs', d.from);
      const lines = []; let issued = 0;
      d.lines.forEach((l, i) => {
        const q = rets[i]; if (!(q > 0)) return;
        const left = l.qty - (l.returnedQty || 0);
        if (q > left + 1e-9) throw new Error(`كمية مرتجع «${l.name}» تتجاوز المتاح.`);
        const net = M().mulQty(l.price, q), vat = M().rate(net, l.vatRate);
        lines.push({ pid: l.pid, name: l.name, qty: q, price: l.price, net, vat, vatRate: l.vatRate, idx: i });
      });
      if (!lines.length) throw new Error('حدد كمية مرتجعة.');
      const r = Ops._pdoc('PRET', { branchId: d.branchId, supplierId: d.supplierId, date }, { from: d.id, lines, reason: o.reason, status: 'posted' });
      for (const l of lines) {
        const x = I().issue({ pid: l.pid, wh: g.wh, qty: l.qty, type: 'purchase-return', ref: { type: 'pret', id: r.id, no: r.number }, date });
        issued += x.cost; d.lines[l.idx].returnedQty = (d.lines[l.idx].returnedQty || 0) + l.qty;
      }
      const net = M().sum(lines, l => l.net), vat = M().sum(lines, l => l.vat);
      const jl = [{ acc: map().ap, dr: net + vat, party: d.supplierId }, { acc: map().inventory, cr: issued }];
      if (vat) jl.push({ acc: map().vatIn, cr: vat });
      if (net !== issued) jl.push(net > issued ? { acc: map().invAdj, cr: net - issued } : { acc: map().invAdj, dr: issued - net });
      const j = A().post({ date, branchId: b.id, memo: `مرتجع مشتريات ${r.number} من ${d.number}`, source: { type: 'pret', id: r.id, no: r.number }, lines: mergeLines(jl) });
      r.journalId = j.id; r.total = net + vat; d.returned += net + vat;
      d.status = d.paid + d.returned >= d.total ? 'paid' : d.paid ? 'partial' : 'unpaid';
      finish('purchase', 'return', r.id, null, b.id, r.number); return r;
    },

    /* ============ المخزون ============ */
    transferSend(o) {
      need('inv.transfer');
      if (o.fromWh === o.toWh) throw new Error('اختر مستودعين مختلفين.');
      const fw = S().get('warehouses', o.fromWh), tw = S().get('warehouses', o.toWh);
      const { date } = dt(o);
      const t = { id: S().uuid(), number: 'TR-' + String(S().seq('tr')).padStart(5, '0'), fromWh: fw.id, toWh: tw.id, date, status: 'in_transit', lines: [], userId: S().user() && S().user().id };
      let total = 0;
      for (const l of o.lines) {
        if (!(l.qty > 0)) continue;
        const r = I().issue({ pid: l.pid, wh: fw.id, qty: l.qty, type: 'transfer-out', ref: { type: 'transfer', id: t.id, no: t.number }, date });
        t.lines.push({ pid: l.pid, qty: l.qty, cost: r.cost }); total += r.cost;
      }
      if (!t.lines.length) throw new Error('أضف كميات للتحويل.');
      const j = A().post({ date, branchId: fw.branchId, memo: `تحويل مخزني ${t.number} إلى ${tw.name}`, source: { type: 'transfer', id: t.id, no: t.number },
        lines: [{ acc: map().transit, dr: total, branchId: tw.branchId }, { acc: map().inventory, cr: total, branchId: fw.branchId }] });
      t.journalId = j.id; t.total = total; st().transfers.push(t);
      finish('transfer', 'send', t.id, null, fw.branchId, t.number); return t;
    },
    transferReceive(id, o) {
      need('inv.transfer');
      const t = S().get('transfers', id); if (!t || t.status !== 'in_transit') throw new Error('التحويل غير متاح للاستلام.');
      const tw = S().get('warehouses', t.toWh); const { date } = dt(o);
      for (const l of t.lines) I().receive({ pid: l.pid, wh: tw.id, qty: l.qty, cost: l.cost, type: 'transfer-in', ref: { type: 'transfer', id: t.id, no: t.number }, date });
      const j = A().post({ date, branchId: tw.branchId, memo: `استلام تحويل ${t.number}`, source: { type: 'transfer-in', id: t.id, no: t.number },
        lines: [{ acc: map().inventory, dr: t.total }, { acc: map().transit, cr: t.total }] });
      t.status = 'received'; t.receivedAt = date; t.journalIn = j.id;
      finish('transfer', 'receive', t.id, null, tw.branchId, t.number); return t;
    },
    stockCount(o) {
      need('inv.adjust');
      const w = S().get('warehouses', o.wh); const { date } = dt(o);
      const c = { id: S().uuid(), number: 'SC-' + String(S().seq('sc')).padStart(5, '0'), wh: w.id, branchId: w.branchId, date, lines: [], userId: S().user() && S().user().id, note: o.note || '' };
      let gain = 0, loss = 0;
      for (const x of o.counts) {
        const sys = I().onHand(x.pid, w.id); const diff = Math.round((x.counted - sys) * 1000) / 1000;
        const row = { pid: x.pid, system: sys, counted: x.counted, diff, value: 0 };
        if (diff < 0) { const r = I().issue({ pid: x.pid, wh: w.id, qty: -diff, type: 'count', ref: { type: 'count', id: c.id, no: c.number }, date, allowNegative: true }); row.value = -r.cost; loss += r.cost; }
        else if (diff > 0) { const unit = I().avgCost(x.pid, w.id); const v = Math.round(unit * diff); I().receive({ pid: x.pid, wh: w.id, qty: diff, cost: v, type: 'count', ref: { type: 'count', id: c.id, no: c.number }, date }); row.value = v; gain += v; }
        c.lines.push(row);
      }
      const jl = [];
      if (gain) { jl.push({ acc: map().inventory, dr: gain }); jl.push({ acc: map().invAdj, cr: gain }); }
      if (loss) { jl.push({ acc: map().invAdj, dr: loss }); jl.push({ acc: map().inventory, cr: loss }); }
      if (jl.length) c.journalId = A().post({ date, branchId: w.branchId, memo: `تسوية جرد ${c.number} — ${w.name}`, source: { type: 'count', id: c.id, no: c.number }, lines: mergeLines(jl) }).id;
      c.gain = gain; c.loss = loss; st().counts.push(c);
      finish('stock', 'count', c.id, null, w.branchId, c.number); return c;
    },
    damage(o) {
      need('inv.adjust');
      if (!o.reason) throw new Error('سبب التلف مطلوب.');
      const w = S().get('warehouses', o.wh); const { date } = dt(o);
      const no = 'DM-' + String(S().seq('dm')).padStart(5, '0'); const id = S().uuid();
      const r = I().issue({ pid: o.pid, wh: w.id, qty: o.qty, type: 'damage', ref: { type: 'damage', id, no }, date });
      const j = A().post({ date, branchId: w.branchId, memo: `إتلاف ${no}: ${o.reason}`, source: { type: 'damage', id, no },
        lines: [{ acc: map().invAdj, dr: r.cost }, { acc: map().inventory, cr: r.cost }] });
      st().damages.push({ id, number: no, wh: w.id, pid: o.pid, qty: o.qty, cost: r.cost, reason: o.reason, date, journalId: j.id });
      finish('stock', 'damage', id, null, w.branchId, no);
    },

    /* ============ الورديات ============ */
    openShift(o) {
      need('pos.shift');
      if (st().shifts.some(s => s.deviceId === o.deviceId && s.status === 'open')) throw new Error('توجد وردية مفتوحة على هذا الجهاز.');
      const s = { id: S().uuid(), number: 'SH-' + String(S().seq('sh')).padStart(5, '0'), branchId: o.branchId, deviceId: o.deviceId, userId: S().user() && S().user().id,
        openedAt: o.at || S().now(), date: dt(o).date, openingCash: o.openingCash || 0, status: 'open' };
      st().shifts.push(s); finish('shift', 'open', s.id, null, o.branchId, s.number); return s;
    },
    shiftSummary(id) {
      const s = S().get('shifts', id);
      const docs = st().invoices.filter(i => i.shiftId === id);
      const sum = (kind, m) => M().sum(docs.filter(d => d.kind === kind), d => M().sum(d.payments.filter(p => p.method === m), p => p.amount));
      const r = { count: docs.filter(d => d.kind === 'invoice').length, returns: docs.filter(d => d.kind === 'credit').length,
        cashSales: sum('invoice', 'cash'), mada: sum('invoice', 'mada'), card: sum('invoice', 'card'), credit: sum('invoice', 'credit'),
        cashRefunds: sum('credit', 'cash'), cardRefunds: sum('credit', 'mada') + sum('credit', 'card'),
        total: M().sum(docs.filter(d => d.kind === 'invoice'), d => d.totals.total), vat: M().sum(docs, d => d.kind === 'credit' ? -d.totals.vat : d.totals.vat) };
      r.expected = s.openingCash + r.cashSales - r.cashRefunds;
      return r;
    },
    closeShift(id, counted, o) {
      need('pos.shift');
      const s = S().get('shifts', id); if (!s || s.status !== 'open') throw new Error('الوردية غير مفتوحة.');
      const sum = Ops.shiftSummary(id); const diff = counted - sum.expected; const b = branchOf(s.branchId);
      const date = dt(o).date;
      if (diff) {
        const j = A().post({ date, branchId: b.id, memo: `${diff < 0 ? 'عجز' : 'زيادة'} صندوق في إغلاق ${s.number}`, source: { type: 'shift', id: s.id, no: s.number },
          lines: diff < 0 ? [{ acc: map().cashOverShort, dr: -diff }, { acc: b.cashAccount, cr: -diff }] : [{ acc: b.cashAccount, dr: diff }, { acc: map().cashOverShort, cr: diff }] });
        s.journalId = j.id;
      }
      Object.assign(s, { status: 'closed', closedAt: (o && o.at) || S().now(), counted, expected: sum.expected, diff, summary: sum });
      finish('shift', 'close', s.id, { diff }, b.id, `${s.number} فرق ${M().fmt(diff)}`); return s;
    },

    /** تسوية مدى: تحويل رصيد المدفوعات بالبطاقات إلى البنك مع العمولة */
    settleCards(o) {
      need('exp.create');
      const b = branchOf(o.branchId); const { date } = dt(o);
      const bal = A().net(map().cardClearing, { to: date, branchId: b.id });
      if (bal <= 0) throw new Error('لا يوجد رصيد بطاقات بانتظار التسوية.');
      const fee = M().rate(bal, o.feeBp === undefined ? 80 : o.feeBp); const bank = o.bank || st().banks[0].account;
      const id = S().uuid(), no = 'MS-' + String(S().seq('ms')).padStart(5, '0');
      const j = A().post({ date, branchId: b.id, memo: `تسوية مدى والبطاقات ${no}`, source: { type: 'card-settle', id, no },
        lines: [{ acc: bank, dr: bal - fee }, { acc: map().bankFees, dr: fee }, { acc: map().cardClearing, cr: bal }] });
      const r = { id, number: no, branchId: b.id, date, amount: bal, fee, net: bal - fee, bank, journalId: j.id };
      st().cardSettlements.push(r); finish('expense', 'card-settle', id, null, b.id, no); return r;
    },

    /* ============ الأصول والمقدمات والقيود اليدوية ============ */
    addAsset(o) {
      need('acc.assets');
      const { date } = dt(o);
      const a = { id: S().uuid(), code: 'FA-' + String(S().seq('fa')).padStart(4, '0'), name: o.name, branchId: o.branchId, cost: o.cost, salvage: o.salvage || 0, lifeMonths: o.lifeMonths, date, accumulated: 0, months: [] };
      if (!(a.cost > 0) || !(a.lifeMonths > 0)) throw new Error('أدخل التكلفة والعمر الإنتاجي.');
      A().post({ date, branchId: o.branchId, memo: `شراء أصل ${a.name}`, source: { type: 'asset', id: a.id, no: a.code }, lines: [{ acc: map().fixedAssets, dr: a.cost }, { acc: o.paidFrom || st().banks[0].account, cr: a.cost }] });
      st().assets.push(a); finish('journal', 'asset', a.id, null, o.branchId, a.code); return a;
    },
    depreciate(month) {
      need('acc.assets');
      const date = lastDay(month); let n = 0;
      for (const a of st().assets) {
        if (a.months.includes(month) || a.date.slice(0, 7) > month) continue;
        const base = a.cost - a.salvage; const left = base - a.accumulated; if (left <= 0) continue;
        const amt = Math.min(left, Math.round(base / a.lifeMonths));
        A().post({ date, branchId: a.branchId, memo: `إهلاك ${a.name} لشهر ${month}`, source: { type: 'depreciation', id: a.id, no: a.code + '/' + month },
          lines: [{ acc: map().depreciation, dr: amt }, { acc: map().accDep, cr: amt }] });
        a.accumulated += amt; a.months.push(month); n++;
      }
      S().audit('asset.depreciate', 'asset', null, `${month}: ${n} أصل`); S().save(); S().emit('journal');
      return n;
    },
    addPrepaid(o) {
      need('acc.journal');
      const p = { id: S().uuid(), code: 'PP-' + String(S().seq('pp')).padStart(4, '0'), name: o.name, branchId: o.branchId, total: o.total, months: o.months, expense: o.expense, start: o.start, amortized: 0, done: [] };
      A().post({ date: dt(o).date, branchId: o.branchId, memo: `مصروف مقدم ${p.name}`, source: { type: 'prepaid', id: p.id, no: p.code },
        lines: [{ acc: map().prepaid, dr: p.total }, { acc: o.paidFrom || st().banks[0].account, cr: p.total }] });
      st().prepaids.push(p); finish('journal', 'prepaid', p.id, null, o.branchId, p.code); return p;
    },
    amortize(month) {
      need('acc.journal'); let n = 0;
      for (const p of st().prepaids) {
        if (p.done.includes(month) || p.start > month || p.amortized >= p.total) continue;
        const amt = p.done.length === p.months - 1 ? p.total - p.amortized : Math.round(p.total / p.months);
        A().post({ date: lastDay(month), branchId: p.branchId, memo: `إطفاء ${p.name} ${month}`, source: { type: 'prepaid-amort', id: p.id, no: p.code + '/' + month },
          lines: [{ acc: p.expense, dr: amt }, { acc: map().prepaid, cr: amt }] });
        p.amortized += amt; p.done.push(month); n++;
      }
      S().save(); S().emit('journal'); return n;
    },
    manualJournal(o) {
      need('acc.journal');
      const j = A().post({ date: o.date, branchId: o.branchId, memo: o.memo, source: { type: 'manual', id: null, no: 'يدوي' }, lines: o.lines, autoReverse: o.autoReverse });
      if (o.autoReverse) {
        const d = new Date(o.date + 'T00:00:00'); d.setMonth(d.getMonth() + 1, 1);
        A().reverse(j.id, S().today(d), 'عكس تلقائي لقيد الاستحقاق ' + j.number);
      }
      finish('journal', 'manual', j.id, null, o.branchId, j.number); return j;
    },

    /* ============ الأرصدة الفرعية ============ */
    customerBalance(id) { return M().sum(A().lines({ party: id }).filter(x => x.l.acc === map().ar), x => x.l.dr - x.l.cr); },
    supplierBalance(id) { return M().sum(A().lines({ party: id }).filter(x => x.l.acc === map().ap), x => x.l.cr - x.l.dr); },
    statement(partyId, acc, sign) {
      let run = 0;
      return A().lines({ party: partyId }).filter(x => x.l.acc === acc)
        .sort((a, b) => (a.j.date + a.j.number).localeCompare(b.j.date + b.j.number))
        .map(({ j, l }) => { run += sign * (l.dr - l.cr); return { date: j.date, no: j.source.no, type: j.source.type, memo: j.memo, dr: l.dr, cr: l.cr, balance: run }; });
    },
    /** أعمار الديون: توزيع الدائن على أقدم المدين (FIFO) */
    aging(partyId, acc, sign, asOf) {
      asOf = asOf || S().today();
      const rows = A().lines({ party: partyId, to: asOf }).filter(x => x.l.acc === acc).sort((a, b) => a.j.date.localeCompare(b.j.date));
      const debits = []; let credits = 0;
      for (const { j, l } of rows) { const v = sign * (l.dr - l.cr); if (v > 0) debits.push({ date: j.date, left: v }); else credits += -v; }
      for (const d of debits) { const t = Math.min(d.left, credits); d.left -= t; credits -= t; }
      const b = { b0: 0, b30: 0, b60: 0, b90: 0, total: 0 };
      const now = new Date(asOf + 'T00:00:00');
      for (const d of debits) {
        if (!d.left) continue;
        const days = Math.round((now - new Date(d.date + 'T00:00:00')) / 86400000);
        const k = days <= 30 ? 'b0' : days <= 60 ? 'b30' : days <= 90 ? 'b60' : 'b90';
        b[k] += d.left; b.total += d.left;
      }
      b.total -= credits; b.unapplied = credits;
      return b;
    },

    /* ============ البيانات الرئيسية ============ */
    saveProduct(data) {
      need('prd.edit');
      const ex = data.id && S().get('products', data.id);
      if (!data.nameAr || !data.code) throw new Error('الكود والاسم العربي مطلوبان.');
      const dupCode = st().products.find(p => p.code === data.code && p.id !== data.id);
      if (dupCode) throw new Error('كود الصنف مستخدم للصنف: ' + dupCode.nameAr);
      const allBarcodes = [data.barcode, ...(data.altUnits || []).map(u => u.barcode)].filter(Boolean);
      for (const bc of allBarcodes) {
        const d = st().products.find(p => p.id !== data.id && (p.barcode === bc || (p.altUnits || []).some(u => u.barcode === bc)));
        if (d) throw new Error(`الباركود ${bc} مستخدم للصنف: ${d.nameAr}`);
      }
      if (ex) {
        if (ex.price !== data.price) need('prd.price');
        const changes = {}; for (const k of ['price', 'cost', 'nameAr', 'nameEn', 'min', 'max', 'vatRate']) if (ex[k] !== data[k]) changes[k] = data[k];
        const baseVersion = ex.version || 0;
        Object.assign(ex, data, { version: baseVersion + 1, updatedAt: S().now() });
        if (changes.price !== undefined) S().audit('product.price', 'product', ex.id, `${ex.nameAr}: ${M().fmt(changes.price)}`);
        finish('product', 'update', ex.id, { baseVersion, changes }, S().branchId());
        return ex;
      }
      const p = Object.assign({ id: S().uuid(), active: true, version: 0, altUnits: [], createdAt: S().now() }, data);
      st().products.push(p); finish('product', 'create', p.id, { baseVersion: 0, changes: {} }, S().branchId(), p.nameAr);
      return p;
    },
    saveParty(kind, data) {
      need('party.edit');
      const coll = kind === 'customer' ? 'customers' : 'suppliers';

      if (data.vat && !Z().validVat(data.vat)) throw new Error('الرقم الضريبي يجب أن يكون 15 رقمًا يبدأ وينتهي بالرقم 3.');
      const ex = data.id && S().get(coll, data.id);
      if (ex) { Object.assign(ex, data); finish(kind, 'update', ex.id, null, S().branchId(), ex.name); return ex; }
      const o = Object.assign({ id: S().uuid(), code: (kind === 'customer' ? 'C' : 'S') + String(S().seq(kind)).padStart(4, '0'), address: {} }, data);
      st()[coll].push(o); finish(kind, 'create', o.id, null, S().branchId(), o.name); return o;
    }
  };

  /** دمج السطور المتشابهة في القيد (نفس الحساب والطرف والاتجاه) */
  function mergeLines(lines) {
    const out = [];
    for (const l of lines) {
      if (!(l.dr > 0) && !(l.cr > 0)) continue;
      const side = l.dr > 0 ? 'dr' : 'cr';
      const f = out.find(x => x.acc === l.acc && (x.party || null) === (l.party || null) && (x[side] > 0) && (x.branchId || null) === (l.branchId || null));
      if (f) f[side] += l[side]; else out.push(Object.assign({}, l));
    }
    return out;
  }

  Ops.lastDay = lastDay;

  Florix.Ops = Ops;
})(typeof window !== 'undefined' ? window : globalThis);
