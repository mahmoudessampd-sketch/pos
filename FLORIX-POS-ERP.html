  const UI = {
    icon, esc, money, qty, LOGO,
    logo(sub) { return `<span class="logo">${LOGO}<span><span class="logo-name" dir="ltr">FLORIX</span><br><span class="logo-sub">${esc(sub || 'فلوريكس · POS & ERP')}</span></span></span>`; },

    toast(msg, kind) {
      let box = document.querySelector('.toasts');
      if (!box) { box = document.createElement('div'); box.className = 'toasts'; box.setAttribute('role', 'status'); document.body.appendChild(box); }
      const t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.textContent = msg; box.appendChild(t);
      setTimeout(() => t.remove(), kind === 'bad' ? 6500 : 3500);
    },
    err(e) { console.warn(e); UI.toast(e && e.message ? e.message : String(e), 'bad'); },

    /** نافذة منبثقة */
    modal({ title, body, wide, actions, onOpen, onClose }) {
      const bg = document.createElement('div'); bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal ${wide === true ? 'wide' : wide || ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="modal-h"><h2>${esc(title)}</h2><button class="btn ghost icon" data-x aria-label="إغلاق">${icon('x')}</button></div>
        <div class="modal-b">${body}</div>
        ${actions && actions.length ? `<div class="modal-f">${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-a="${i}" ${a.disabled ? 'disabled' : ''}>${a.icon ? icon(a.icon) : ''}${esc(a.label)}</button>`).join('')}</div>` : ''}
      </div>`;
      document.body.appendChild(bg);
      const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); if (onClose) onClose(); };
      const onKey = e => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
      bg.addEventListener('click', e => {
        if (e.target === bg || e.target.closest('[data-x]')) return close();
        const b = e.target.closest('[data-a]');
        if (b && actions[+b.dataset.a].onClick) {
          try { const r = actions[+b.dataset.a].onClick(close, bg); if (r === undefined || r === true) { /* noop */ } } catch (er) { UI.err(er); }
        }
      });
      const f = bg.querySelector('input:not([type=hidden]):not([readonly]), select, textarea'); if (f) setTimeout(() => f.focus(), 30);
      if (onOpen) onOpen(bg, close);
      return { el: bg, close };
    },
    confirm(msg, opts) {
      opts = opts || {};
      return new Promise(res => {
        UI.modal({ title: opts.title || 'تأكيد', body: `<p style="margin:0;white-space:pre-line">${esc(msg)}</p>`, onClose: () => res(false),
          actions: [{ label: opts.ok || 'تأكيد', cls: opts.danger ? 'danger' : 'pri', onClick: c => { res(true); c(); } }, { label: 'إلغاء', onClick: c => c() }] });
      });
    },

    /** حقول نموذج: [{name,label,type,value,options,full,attrs,hint}] */
    fields(list) {
      return `<div class="form-grid">${list.map(f => {
        const v = f.value == null ? '' : f.value; const id = 'f_' + f.name;
        let input;
        if (f.type === 'select') input = `<select class="input" id="${id}" name="${f.name}" ${f.attrs || ''}>${f.options.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(v) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
        else if (f.type === 'textarea') input = `<textarea class="input" id="${id}" name="${f.name}" ${f.attrs || ''}>${esc(v)}</textarea>`;
        else if (f.type === 'check') return `<label class="check ${f.full ? 'full' : ''}"><input type="checkbox" id="${id}" name="${f.name}" ${v ? 'checked' : ''}> ${esc(f.label)}</label>`;
        else if (f.type === 'html') return `<div class="${f.full ? 'full' : ''}">${f.html}</div>`;
        else input = `<input class="input ${f.type === 'money' || f.type === 'number' ? 'num-in' : ''}" id="${id}" name="${f.name}" type="${f.type === 'money' || f.type === 'number' ? 'text' : (f.type || 'text')}" ${f.type === 'money' || f.type === 'number' ? 'inputmode="decimal"' : ''} value="${esc(v)}" ${f.attrs || ''}>`;
        return `<label class="field ${f.full ? 'full' : ''}" for="${id}"><span>${esc(f.label)}</span>${input}${f.hint ? `<small class="muted tiny">${esc(f.hint)}</small>` : ''}</label>`;
      }).join('')}</div>`;
    },
    read(el) {
      const o = {};
      el.querySelectorAll('[name]').forEach(i => { o[i.name] = i.type === 'checkbox' ? i.checked : i.value.trim(); });
      return o;
    },
    /** نافذة نموذج مع حفظ */
    formModal({ title, fields, onSave, wide, saveLabel, extra }) {
      return UI.modal({ title, wide, body: UI.fields(fields) + (extra || ''),
        actions: [{ label: saveLabel || 'حفظ', cls: 'pri', icon: 'check', onClick: (close, el) => { try { const r = onSave(UI.read(el), el); if (r !== false) close(); } catch (e) { UI.err(e); } } },
          { label: 'إلغاء', onClick: c => c() }] });
    },

    /** جدول مع بحث وتصدير */
    table({ id, cols, rows, foot, empty, search, exportName, tools, maxRows }) {
      id = id || 't' + Math.random().toString(36).slice(2, 8);
      const shown = maxRows ? rows.slice(0, maxRows) : rows;
      const head = cols.map(c => `<th class="${c.num ? 'n' : ''}">${esc(c.label)}</th>`).join('');
      const body = shown.length ? shown.map((r, i) => `<tr ${r._attrs || ''}>${cols.map(c => `<td class="${c.num ? 'n' : ''}">${c.render ? c.render(r, i) : esc(r[c.k])}</td>`).join('')}</tr>`).join('')
        : `<tr><td colspan="${cols.length}" class="empty">${esc(empty || 'لا توجد بيانات.')}</td></tr>`;
      const ft = foot ? `<tfoot><tr>${foot.map((f, i) => `<td class="${cols[i] && cols[i].num ? 'n' : ''}">${f == null ? '' : f}</td>`).join('')}</tr></tfoot>` : '';
      const tl = (search || exportName || tools) ? `<div class="tbl-tools">${search ? `<div class="search">${icon('search')}<input class="input sm" placeholder="بحث في الجدول…" data-tsearch="${id}" aria-label="بحث"></div>` : '<div class="grow"></div>'}
        ${tools || ''}${exportName ? `<button class="btn sm" data-export="${id}" data-name="${esc(exportName)}" data-fmt="xls">${icon('download')}Excel</button><button class="btn sm" data-export="${id}" data-name="${esc(exportName)}" data-fmt="csv">CSV</button><button class="btn sm" data-print-table="${id}" data-name="${esc(exportName)}">${icon('printer')}طباعة / PDF</button>` : ''}</div>` : '';
      const more = maxRows && rows.length > maxRows ? `<div class="muted small" style="padding:8px 16px">يُعرض ${maxRows} من ${rows.length} سجل — استخدم البحث أو التقارير للتصفية.</div>` : '';
      return `${tl}<div class="tbl-wrap"><table class="tbl" id="${id}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${ft}</table></div>${more}`;
    },
    tableData(id) {
      const t = document.getElementById(id); if (!t) return [];
      return Array.from(t.querySelectorAll('tr')).filter(r => r.style.display !== 'none').map(r => Array.from(r.children).map(c => c.innerText.replace(/\s+/g, ' ').trim()));
    },
    download(name, content, mime) {
      try {
        const blob = new Blob([content], { type: mime });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
        UI.toast('بدأ تنزيل ' + name + '\nإذا لم يبدأ التنزيل داخل العارض، شغّل النموذج من الملفات محليًا.');
      } catch (e) { UI.err(e); }
    },
    exportTable(id, name, fmt) {
      const rows = UI.tableData(id);
      const stamp = S().today();
      if (fmt === 'csv') {
        const csv = rows.map(r => r.map(c => /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c).join(',')).join('\r\n');
        UI.download(`${name}-${stamp}.csv`, '﻿' + csv, 'text/csv;charset=utf-8');
      } else {
        const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body dir="rtl"><table border="1">${rows.map((r, i) => `<tr>${r.map(c => i === 0 ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></body></html>`;
        UI.download(`${name}-${stamp}.xls`, '﻿' + html, 'application/vnd.ms-excel');
      }
      S().audit('export', 'report', null, `${name} (${fmt})`);
    },
    /** الطباعة: تعمل عند تشغيل النموذج محليًا في المتصفح */
    print(html, mode) {
      const r = document.getElementById('print-root'); r.innerHTML = html;
      document.body.classList.toggle('print-80', mode === '80');
      try { window.print(); } catch (e) { /* ignore */ }
      setTimeout(() => { document.body.classList.remove('print-80'); }, 1000);
      UI.toast('أُرسل المستند إلى الطابعة. لحفظه PDF اختر «حفظ بصيغة PDF» من نافذة الطباعة.\nملاحظة: الطباعة لا تعمل داخل عارض المعاينة، بل عند فتح النموذج محليًا.');
    },
    printTable(id, name) {
      const t = document.getElementById(id); if (!t) return;
      const co = S().state.company;
      UI.print(`<div class="a4"><div class="head"><div><b>${esc(co.name)}</b><br>الرقم الضريبي: ${esc(co.vat)}</div><div><b>${esc(name)}</b><br>تاريخ الطباعة: ${S().today()}</div></div>${t.outerHTML}</div>`, 'a4');
    },

    qr(text, size) {
      try {
        if (root.qrcode) { const q = root.qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 3, margin: 2, scalable: true }); }
      } catch (e) { /* fallback */ }
      return `<div class="qr-fallback" title="مكتبة رمز QR غير محملة (تحتاج اتصالًا عند التشغيل لأول مرة)">QR (TLV Base64):<br>${esc(text)}</div>`;
    },

    /* ============ الرسوم البيانية (SVG) ============ */
    niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; },
    short(h) { const v = h / 100; if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1) + 'M'; if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'K'; return Math.round(v).toString(); },
    lineChart(points, opts) {
      opts = opts || {}; const W = 640, H = opts.h || 220, L = 46, R = 12, T = 12, B = 26;
      const max = UI.niceMax(Math.max(...points.map(p => p.value), 1)); const n = points.length;
      const x = i => L + (n <= 1 ? 0 : i * (W - L - R) / (n - 1)); const y = v => T + (H - T - B) * (1 - v / max);
      let g = ''; for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${UI.short(v)}</text>`; }
      const step = Math.ceil(n / 8);
      const lbl = points.map((p, i) => ((i % step === 0 && n - 1 - i >= step / 2) || i === n - 1) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(p.label)}</text>` : '').join('');
      const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join('');
      const area = `${d}L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z`;
      const lastP = points[n - 1];
      const tips = points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.value)}" r="6" fill="transparent"><title>${esc(p.label)}: ${M().fmt(p.value)} ر.س</title></circle>`).join('');
      return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'رسم بياني')}">${g}<path class="ar" d="${area}"/><path class="ln" d="${d}"/>${lastP ? `<circle class="dotp" cx="${x(n - 1)}" cy="${y(lastP.value)}" r="4"/>` : ''}${lbl}${tips}</svg></div>`;
    },
    barChart(groups, series, opts) {
      opts = opts || {}; const W = 640, H = opts.h || 220, L = 46, R = 12, T = 12, B = 26;
      const max = UI.niceMax(Math.max(1, ...groups.flatMap(g => g.values)));
      const gw = (W - L - R) / groups.length; const bw = Math.min(28, (gw * 0.7) / series.length);
      const y = v => T + (H - T - B) * (1 - v / max);
      let s = ''; for (let k = 0; k <= 4; k++) { const v = max * k / 4; s += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${UI.short(v)}</text>`; }
      groups.forEach((g, i) => {
        const cx = L + gw * i + gw / 2; const start = cx - (bw * series.length) / 2;
        g.values.forEach((v, j) => { s += `<rect class="bar ${j % 2 ? 'alt' : ''}" x="${start + j * bw + 1}" y="${y(v)}" width="${bw - 2}" height="${Math.max(0, y(0) - y(v))}" rx="2"><title>${esc(g.label)} — ${esc(series[j])}: ${M().fmt(v)} ر.س</title></rect>`; });
        s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(g.label)}</text>`;
      });
      const leg = series.length > 1 ? `<div class="legend">${series.map((n, j) => `<span><i style="background:var(${j % 2 ? '--accent' : '--primary'})"></i>${esc(n)}</span>`).join('')}</div>` : '';
      return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'رسم بياني')}">${s}</svg></div>${leg}`;
    },

    /* ============ مستندات الطباعة ============ */
    payLabel: m => ({ cash: 'نقدًا', mada: 'مدى', card: 'بطاقة ائتمانية', credit: 'آجل', bank: 'تحويل بنكي' }[m] || m),
    docTitle(inv) {
      const k = { invoice: 'فاتورة', credit: 'إشعار دائن', debit: 'إشعار مدين' }[inv.kind];
      return inv.type === 'standard' ? `${k} ضريبية` : `${k} ضريبية مبسطة`;
    },
    receiptHTML(inv) {
      const st = S().state, co = st.company, b = S().get('branches', inv.branchId), cu = inv.customerId && S().get('customers', inv.customerId);
      const u = S().get('users', inv.userId);
      return `<div class="receipt">
        <div class="c"><b style="font-size:14px">${esc(co.name)}</b><br>${esc(b.name)}<br>الرقم الضريبي: <span class="num">${esc(co.vat)}</span></div><hr>
        <div class="c"><b>${UI.docTitle(inv)}</b><br>${inv.type === 'simplified' ? 'Simplified Tax Invoice' : 'Tax Invoice'}</div>
        <table><tr><td>الرقم</td><td class="n">${esc(inv.number)}</td></tr><tr><td>التاريخ</td><td class="n">${inv.date} ${inv.time}</td></tr>
        ${inv.refNumber ? `<tr><td>مرجع الفاتورة</td><td class="n">${esc(inv.refNumber)}</td></tr><tr><td>السبب</td><td>${esc(inv.reason)}</td></tr>` : ''}
        ${cu ? `<tr><td>العميل</td><td>${esc(cu.name)}</td></tr>${cu.vat ? `<tr><td>رقمه الضريبي</td><td class="n">${esc(cu.vat)}</td></tr>` : ''}` : ''}
        <tr><td>الكاشير</td><td>${esc(u ? u.name : '')}</td></tr></table><hr>
        <table>${inv.lines.map(l => `<tr><td colspan="2">${esc(l.name)}</td></tr><tr><td class="n">${M().fmtQty(l.qty)} × ${M().fmt(l.price)}${l.discount ? ' − ' + M().fmt(l.discount) : ''}</td><td class="n">${M().fmt(l.net + l.vat)}</td></tr>`).join('')}</table><hr>
        <table><tr><td>الإجمالي قبل الضريبة</td><td class="n">${M().fmt(inv.totals.net)}</td></tr>
        ${inv.totals.discount ? `<tr><td>الخصم</td><td class="n">${M().fmt(inv.totals.discount)}</td></tr>` : ''}
        <tr><td>ضريبة القيمة المضافة 15%</td><td class="n">${M().fmt(inv.totals.vat)}</td></tr>
        <tr><td><b>الإجمالي شامل الضريبة</b></td><td class="n"><b>${M().fmt(inv.totals.total)} ر.س</b></td></tr>
        ${inv.payments.map(p => `<tr><td>${UI.payLabel(p.method)}</td><td class="n">${M().fmt(p.amount)}</td></tr>`).join('')}
        ${inv.change ? `<tr><td>المتبقي للعميل</td><td class="n">${M().fmt(inv.change)}</td></tr>` : ''}</table>
        <div class="qr">${UI.qr(inv.zatca.qr)}</div>
        <div class="c tiny" style="margin-top:6px">ICV ${inv.zatca.icv} · ${esc(inv.id.slice(0, 8))}<br>حالة الإرسال: ${esc(UI.zStatus(inv.zatca.status))}<br>شكرًا لزيارتكم<br><span style="color:#64748B">Powered by FLORIX POS</span></div>
      </div>`;
    },
    a4HTML(inv) {
      const co = S().state.company, b = S().get('branches', inv.branchId), cu = inv.customerId && S().get('customers', inv.customerId);
      const addr = a => a ? [a.street, a.building && ('مبنى ' + a.building), a.district, a.city, a.postal].filter(Boolean).join('، ') : '';
      return `<div class="a4">
        <div class="head"><div><b style="font-size:16px">${esc(co.name)}</b><br>${esc(co.nameEn)}<br>${esc(addr(co.address))}<br>الرقم الضريبي: <span class="num">${esc(co.vat)}</span> · س.ت: <span class="num">${esc(co.cr)}</span><br>الفرع: ${esc(b.name)}</div>
        <div style="text-align:left"><b style="font-size:16px">${UI.docTitle(inv)}</b><br>${inv.type === 'standard' ? 'Tax Invoice' : 'Simplified Tax Invoice'}<br>رقم: <span class="num">${esc(inv.number)}</span><br>التاريخ: <span class="num">${inv.date} ${inv.time}</span>${inv.refNumber ? `<br>مرجع: <span class="num">${esc(inv.refNumber)}</span><br>السبب: ${esc(inv.reason)}` : ''}</div></div>
        ${cu ? `<table style="margin-bottom:12px"><tr><th>المشتري</th><td>${esc(cu.name)}</td><th>الرقم الضريبي</th><td class="n">${esc(cu.vat || '—')}</td></tr><tr><th>العنوان</th><td colspan="3">${esc(addr(cu.address))}</td></tr></table>` : ''}
        <table><thead><tr><th>#</th><th>الصنف</th><th>الكمية</th><th>سعر الوحدة</th><th>الخصم</th><th>الصافي</th><th>الضريبة</th><th>الإجمالي</th></tr></thead><tbody>
        ${inv.lines.map((l, i) => `<tr><td>${i + 1}</td><td>${esc(l.name)}</td><td class="n">${M().fmtQty(l.qty)}</td><td class="n">${M().fmt(l.price)}</td><td class="n">${M().fmt(l.discount)}</td><td class="n">${M().fmt(l.net)}</td><td class="n">${M().fmt(l.vat)}</td><td class="n">${M().fmt(l.net + l.vat)}</td></tr>`).join('')}
        </tbody></table>
        <div class="head" style="margin-top:14px;align-items:flex-end"><div class="qr">${UI.qr(inv.zatca.qr)}</div>
        <table style="width:300px"><tr><th>الإجمالي قبل الضريبة</th><td class="n">${M().fmt(inv.totals.net)}</td></tr><tr><th>ضريبة القيمة المضافة</th><td class="n">${M().fmt(inv.totals.vat)}</td></tr><tr><th>الإجمالي المستحق</th><td class="n"><b>${M().fmt(inv.totals.total)} ر.س</b></td></tr></table></div>
        <p class="tiny" style="color:#666">UUID: <span class="num">${esc(inv.id)}</span> · ICV: ${inv.zatca.icv} · حالة الإرسال للمنصة: ${esc(UI.zStatus(inv.zatca.status))} (محاكاة — غير مرسلة لهيئة الزكاة فعليًا)</p>
      </div>`;
    },
    zStatus: s => ({ pending: 'بانتظار الإرسال', reported: 'مُبلّغ عنها', cleared: 'معتمدة', rejected: 'مرفوضة' }[s] || s),
    zPill: s => `<span class="pill ${{ pending: 'warn', reported: 'ok', cleared: 'ok', rejected: 'bad' }[s] || ''}">${UI.zStatus(s)}</span>`,
    showDoc(inv) {
      const m = UI.modal({ title: `${UI.docTitle(inv)} — ${inv.number}`, wide: true,
        body: `<div class="tabs"><button class="tab on" data-v="r">إيصال حراري 80mm</button><button class="tab" data-v="a">A4</button></div><div data-doc>${UI.receiptHTML(inv)}</div>`,
        actions: [{ label: 'طباعة 80mm', icon: 'printer', cls: 'pri', onClick: () => UI.print(UI.receiptHTML(inv), '80') },
          { label: 'طباعة A4 / PDF', icon: 'printer', onClick: () => UI.print(UI.a4HTML(inv), 'a4') }, { label: 'إغلاق', onClick: c => c() }],
        onOpen: el => el.addEventListener('click', e => { const t = e.target.closest('[data-v]'); if (!t) return; el.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === t)); el.querySelector('[data-doc]').innerHTML = t.dataset.v === 'r' ? UI.receiptHTML(inv) : UI.a4HTML(inv); }) });
      return m;
    },
    thumb(p, size) {
      const c = S().get('categories', p.categoryId); const col = c ? c.color : '#5C6E6D';
      if (p.image) return `<div class="thumb"><img src="${p.image}" alt=""></div>`;
      const ab = (p.nameEn || p.nameAr).split(/\s+/).filter(w => /^[A-Za-z\u0600-\u06FF]/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase();
      return `<div class="thumb" style="background:color-mix(in srgb, ${col} 16%, var(--surface));color:${col}"><svg viewBox="0 0 80 60" width="70%" aria-hidden="true"><circle cx="40" cy="30" r="20" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/><text x="40" y="36" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="600" fill="currentColor">${esc(ab)}</text></svg></div>`;
    },
    tabs(list, cur, act) { return `<div class="tabs" role="tablist">${list.map(([k, l]) => `<button class="tab ${k === cur ? 'on' : ''}" data-act="${act || 'tab'}" data-v="${k}" role="tab" aria-selected="${k === cur}">${esc(l)}</button>`).join('')}</div>`; },
    srcLabel: t => ({ sale: 'فاتورة مبيعات', credit: 'إشعار دائن', debit: 'إشعار مدين', receipt: 'سند قبض', expense: 'مصروف', grn: 'استلام بضاعة', pinv: 'فاتورة مورد', payment: 'سند صرف',
      pret: 'مرتجع مشتريات', transfer: 'تحويل مخزني', 'transfer-in': 'استلام تحويل', count: 'جرد', damage: 'إتلاف', shift: 'وردية', 'card-settle': 'تسوية مدى', asset: 'أصل ثابت',
      depreciation: 'إهلاك', prepaid: 'مصروف مقدم', 'prepaid-amort': 'إطفاء', manual: 'قيد يدوي', reversal: 'قيد عكسي', opening: 'افتتاحي', 'year-close': 'إقفال سنوي' }[t] || t)
  };

  // بحث وتصدير الجداول (تفويض عام)
  if (typeof document !== 'undefined') {
    document.addEventListener('input', e => {
      const s = e.target.closest('[data-tsearch]'); if (!s) return;
      const q = s.value.trim().toLowerCase(); const t = document.getElementById(s.dataset.tsearch); if (!t) return;
      t.querySelectorAll('tbody tr').forEach(r => { r.style.display = !q || r.innerText.toLowerCase().includes(q) ? '' : 'none'; });
    });
    document.addEventListener('click', e => {
      const x = e.target.closest('[data-export]'); if (x) return UI.exportTable(x.dataset.export, x.dataset.name, x.dataset.fmt);
      const p = e.target.closest('[data-print-table]'); if (p) return UI.printTable(p.dataset.printTable, p.dataset.name);
    });
  }

  Florix.UI = UI;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* FLORIX فلوريكس — لوحة التحكم + إدارة الشركة والفروع */
(function (root) {
  'use strict';
  const Florix = root.Florix; const V = Florix.Views = Florix.Views || {};
  const S = Florix.Store, M = Florix.Money, UI = Florix.UI, A = Florix.Acc, I = Florix.Inv, O = Florix.Ops, AU = Florix.Auth, Y = Florix.Sync;
  const { icon, esc, money } = UI;
  const app = () => Florix.App;

  /** مؤشرات المبيعات لفترة ونطاق */
  function salesStats(from, to, branchId) {
    const docs = S.state.invoices.filter(i => i.date >= from && i.date <= to && (!branchId || i.branchId === branchId));
    let gross = 0, net = 0, vat = 0, cost = 0, count = 0, collected = 0;
    for (const d of docs) {
      const sg = d.kind === 'credit' ? -1 : 1;
      if (d.kind === 'invoice') { count++; gross += d.totals.total; }
      net += sg * d.totals.net; vat += sg * d.totals.vat; cost += sg * (d.totals.cost || 0);
      for (const p of d.payments) if (p.method !== 'credit') collected += sg * p.amount;
    }
    return { gross, net, vat, cost, profit: net - cost, count, collected, docs };
  }
  V.salesStats = salesStats;
  function monthStart(d) { return d.slice(0, 8) + '01'; }
  function addDays(d, n) { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return S.today(x); }

  V.dashboard = {
    title: 'لوحة التحكم', icon: 'dashboard', perm: 'scr.dashboard', live: true, state: { chart: 'daily' },
    render() {
      const sc = app().scope(); const today = S.today(); const ms = monthStart(today);
      const T = salesStats(today, today, sc), Mo = salesStats(ms, today, sc);
      const receiptsToday = M.sum(S.state.receipts.filter(r => r.date === today && (!sc || r.branchId === sc)), r => r.amount);
      const expRaw = A.raw({ from: ms, to: today, branchId: sc });
      const expMonth = A.balance('6', null, expRaw);
      const expToday = A.balance('6', { from: today, to: today, branchId: sc });
      const invVal = I.totalValue(sc);
      const ar = A.balance('1104', { branchId: sc }), ap = A.balance('2101', { branchId: sc });
      const k = (lbl, val, sub, ic, hl) => `<div class="kpi ${hl ? 'hl' : ''}"><span class="lbl">${icon(ic)}${lbl}</span><span class="val">${M.fmt(val)}</span><span class="sub">${sub}</span></div>`;
      const kpis = `<div class="kpis">
        ${k('إجمالي مبيعات اليوم', T.gross, `شامل الضريبة · الشهر: <span class="num">${M.fmt(Mo.gross)}</span>`, 'receipt', true)}
        ${k('صافي المبيعات', T.net, `بعد المرتجعات وقبل الضريبة · الشهر: <span class="num">${M.fmt(Mo.net)}</span>`, 'chart')}
        <div class="kpi"><span class="lbl">${icon('file')}عدد الفواتير</span><span class="val">${T.count}</span><span class="sub">اليوم · الشهر: <span class="num">${Mo.count}</span></span></div>
        ${k('مجمل الربح', T.profit, `هامش ${T.net ? (T.profit * 100 / T.net).toFixed(1) : '0.0'}% · الشهر: <span class="num">${M.fmt(Mo.profit)}</span>`, 'tag')}
        ${k('قيمة المخزون', invVal, `بسياسة ${S.state.settings.costMethod === 'FIFO' ? 'الوارد أولًا صادر أولًا' : 'المتوسط المرجح'}`, 'layers')}
        ${k('مستحقات على العملاء', ar, 'رصيد الذمم المدينة', 'users')}
        ${k('مستحقات للموردين', ap, 'رصيد الذمم الدائنة', 'briefcase')}
        ${k('التحصيلات اليوم', T.collected + receiptsToday, `نقطة البيع <span class="num">${M.fmt(T.collected)}</span> + سندات قبض <span class="num">${M.fmt(receiptsToday)}</span>`, 'cash')}
      </div>`;

      // الرسم البياني
      let chart;
      if (this.state.chart === 'daily') {
        const pts = []; for (let i = 29; i >= 0; i--) { const d = addDays(today, -i); pts.push({ label: d.slice(5).replace('-', '/'), value: salesStats(d, d, sc).net }); }
        chart = UI.lineChart(pts, { label: 'صافي المبيعات اليومية لآخر 30 يومًا' });
      } else {
        const months = []; const d0 = new Date(today + 'T00:00:00');
        for (let i = 5; i >= 0; i--) { const d = new Date(d0.getFullYear(), d0.getMonth() - i, 1); const m = S.today(d).slice(0, 7); const s = salesStats(m + '-01', m + '-31', sc); months.push({ label: m, values: [s.net, s.profit] }); }
        chart = UI.barChart(months, ['صافي المبيعات', 'مجمل الربح'], { label: 'المبيعات الشهرية' });
      }

      // أداء الفروع
      const branches = AU.branches();
      const perf = branches.map(b => { const t = salesStats(today, today, b.id), m = salesStats(ms, today, b.id); return { b, t, m, pend: Y.pending(b.id).length + Y.failed(b.id).length }; });
      const perfTbl = UI.table({ id: 'perfT', cols: [
        { label: 'الفرع', render: r => `<b>${esc(r.b.name)}</b>` },
        { label: 'مبيعات اليوم', num: 1, render: r => money(r.t.gross) }, { label: 'فواتير اليوم', num: 1, render: r => `<span class="num">${r.t.count}</span>` },
        { label: 'صافي الشهر', num: 1, render: r => money(r.m.net) }, { label: 'مجمل ربح الشهر', num: 1, render: r => money(r.m.profit) },
        { label: 'متوسط الفاتورة', num: 1, render: r => money(r.m.count ? Math.round(r.m.gross / r.m.count) : 0) },
        { label: 'الاتصال', render: r => `<span class="pill ${r.b.online ? 'ok' : 'bad'}"><span class="dot"></span>${r.b.online ? 'متصل' : 'غير متصل'}</span>${r.pend ? ` <span class="pill warn">${r.pend} معلقة</span>` : ''}` }],
        rows: perf });
      const cmp = UI.barChart(perf.map(r => ({ label: r.b.code, values: [r.m.net, r.m.profit] })), ['صافي المبيعات', 'مجمل الربح'], { h: 200, label: 'مقارنة الفروع' });

      // التنبيهات
      const alerts = [];
      const low = I.belowMin(sc); if (low.length) alerts.push(['warn', 'layers', `${low.length} صنف عند الحد الأدنى أو أقل`, low.slice(0, 3).map(x => x.p.nameAr).join('، '), '#inventory']);
      const exp = I.expiring(10, sc); if (exp.length) alerts.push(['warn', 'clock', `${exp.length} دفعة منتهية أو تنتهي صلاحيتها خلال 10 أيام`, exp.slice(0, 2).map(x => `${x.p.nameAr} (${x.expiry})`).join('، '), '#inventory']);
      for (const b of S.state.branches.filter(b => !sc || b.id === sc)) {
        if (!b.online) alerts.push(['bad', 'wifioff', `فرع ${b.name} غير متصل`, `آخر مزامنة: ${fmtAgo(b.lastSync)} · ${Y.pending(b.id).length} عملية في الطابور`, '#sync']);
        const f = Y.failed(b.id).length; if (f) alerts.push(['bad', 'sync', `${f} عملية فشلت مزامنتها في ${b.name}`, 'تحتاج إعادة إرسال يدوية', '#sync']);
      }
      const zr = S.state.invoices.filter(i => (!sc || i.branchId === sc) && i.zatca.status === 'rejected');
      const zp = S.state.invoices.filter(i => (!sc || i.branchId === sc) && i.zatca.status === 'pending');
      if (zr.length) alerts.push(['bad', 'qr', `${zr.length} فاتورة مرفوضة من محاكي منصة فاتورة`, zr.map(i => i.number).slice(0, 2).join('، '), '#einvoice']);
      if (zp.length) alerts.push(['warn', 'qr', `${zp.length} فاتورة بانتظار الإرسال للمنصة`, 'المبسطة يجب الإبلاغ عنها خلال 24 ساعة', '#einvoice']);
      const openSh = S.state.shifts.filter(s => s.status === 'open' && (!sc || s.branchId === sc));
      if (openSh.length) alerts.push(['info', 'clock', `${openSh.length} وردية مفتوحة`, openSh.map(s => S.get('devices', s.deviceId).name + ' — ' + S.get('branches', s.branchId).code).join('، '), '#pos']);
      const pendPO = S.state.purchaseDocs.filter(d => d.stage === 'PO' && d.status === 'pending_approval' && (!sc || d.branchId === sc));
      if (pendPO.length) alerts.push(['info', 'truck', `${pendPO.length} أمر شراء بانتظار الاعتماد`, pendPO.map(d => d.number).join('، '), '#purchases']);
      const alertHtml = alerts.length ? `<div class="list">${alerts.map(([s, ic, t, d, href]) => `<a class="list-i" href="${href}" style="text-decoration:none;color:inherit"><span class="sev ${s}"></span>${icon(ic)}<span class="grow"><b>${esc(t)}</b><br><span class="muted small">${esc(d)}</span></span></a>`).join('')}</div>` : `<div class="empty">لا توجد تنبيهات.</div>`;

      // أحدث العمليات
      const recent = S.state.journals.filter(j => !sc || j.branchId === sc).slice(-12).reverse();
      const recentHtml = `<div class="list">${recent.map(j => `<div class="list-i"><span class="pill pri">${esc(UI.srcLabel(j.source.type))}</span><span class="grow"><b class="num">${esc(j.source.no || j.number)}</b> <span class="muted small">${esc(j.memo)}</span></span><span class="small muted num">${j.date}</span>${money(M.sum(j.lines, l => l.dr))}</div>`).join('')}</div>`;

      return `<div class="row between"><div><h2 style="font-size:20px">${esc(app().scopeName())}</h2><span class="muted small">${today} · جميع الأرقام محسوبة من القيود والحركات المسجلة</span></div>
          <div class="row">${AU.can('scr.pos') ? `<a class="btn pri" href="#pos">${icon('pos')}فتح نقطة البيع</a>` : ''}<a class="btn" href="#reports">${icon('chart')}التقارير</a></div></div>
        ${kpis}
        <div class="grid g-2-1">
          <div class="card"><div class="card-h"><h2>المبيعات</h2>${UI.tabs([['daily', 'يومي'], ['monthly', 'شهري']], this.state.chart, 'chart')}</div><div class="card-b">${chart}</div></div>
          <div class="card"><div class="card-h"><h2>التنبيهات</h2><span class="pill ${alerts.some(a => a[0] === 'bad') ? 'bad' : 'warn'}">${alerts.length}</span></div>${alertHtml}</div>
        </div>
        <div class="grid g-2-1">
          <div class="card"><div class="card-h"><h2>أداء الفروع</h2><span class="muted small">مصروفات الشهر: ${money(expMonth)} · اليوم: ${money(expToday)}</span></div>${perfTbl}</div>
          <div class="card"><div class="card-h"><h2>مقارنة الفروع — الشهر الحالي</h2></div><div class="card-b">${cmp}</div></div>
        </div>
        <div class="card"><div class="card-h"><h2>أحدث العمليات</h2><a class="btn sm" href="#accounts">القيود اليومية</a></div>${recentHtml}</div>`;
    },
    actions: { chart(el) { V.dashboard.state.chart = el.dataset.v; app().render(); } }
  };
  function fmtAgo(iso) {
    if (!iso) return 'لم تتم'; const s = Math.round((Date.now() - new Date(iso)) / 1000);
    if (s < 60) return 'قبل ' + s + ' ث'; if (s < 3600) return 'قبل ' + Math.round(s / 60) + ' د'; if (s < 86400) return 'قبل ' + Math.round(s / 3600) + ' س'; return 'قبل ' + Math.round(s / 86400) + ' يوم';
  }
  V.fmtAgo = fmtAgo;

  /* ================= الشركة والفروع ================= */
  V.branches = {
    title: 'الشركة والفروع', icon: 'building', perm: 'scr.branches', state: { tab: 'company' },
    render() {
      const st = S.state; const t = this.state.tab; const canEdit = AU.can('cfg.company');
      const tabs = UI.tabs([['company', 'الشركة'], ['branches', 'الفروع'], ['warehouses', 'المستودعات'], ['devices', 'نقاط البيع والأجهزة'], ['cash', 'الصناديق والبنوك'], ['cc', 'مراكز التكلفة']], t);
      let body = '';
      const addBtn = (act, l) => canEdit ? `<button class="btn pri sm" data-act="${act}">${icon('plus')}${l}</button>` : '';
      if (t === 'company') {
        const c = st.company; const a = c.address || {};
        body = `<div class="card"><div class="card-h"><h2>بيانات المنشأة</h2>${canEdit ? `<button class="btn pri sm" data-act="editCompany">${icon('edit')}تعديل</button>` : ''}</div><div class="card-b">
          <dl class="kv"><dt>الاسم</dt><dd>${esc(c.name)} — ${esc(c.nameEn)}</dd><dt>الرقم الضريبي</dt><dd><span class="num">${esc(c.vat)}</span> ${Florix.Zatca.validVat(c.vat) ? '<span class="pill ok">صيغة صحيحة</span>' : '<span class="pill bad">صيغة غير صحيحة</span>'}</dd>
          <dt>السجل التجاري</dt><dd class="num">${esc(c.cr)}</dd><dt>العنوان الوطني</dt><dd>${esc([a.street, 'مبنى ' + (a.building || '—'), a.district, a.city, a.postal].join('، '))}</dd>
          <dt>الهاتف</dt><dd class="num">${esc(c.phone)}</dd><dt>البريد</dt><dd>${esc(c.email)}</dd>
          <dt>سياسة تكلفة المخزون</dt><dd>${st.settings.costMethod === 'FIFO' ? 'الوارد أولًا صادر أولًا (FIFO)' : 'المتوسط المرجح'}</dd><dt>البيع بالسالب</dt><dd>${st.settings.allowNegativeStock ? 'مسموح' : 'غير مسموح'}</dd>
          <dt>مهلة الجلسة</dt><dd>${st.settings.sessionMinutes} دقيقة</dd></dl></div></div>
          <div class="grid g4">${st.branches.map(b => { const s = V.salesStats(S.today().slice(0, 8) + '01', S.today(), b.id); return `<div class="card card-b"><div class="row between"><b>${esc(b.name)}</b><span class="pill ${b.online ? 'ok' : 'bad'}">${b.online ? 'متصل' : 'غير متصل'}</span></div><div class="muted small">صافي مبيعات الشهر</div><div class="num" style="font-size:18px">${M.fmt(s.net)}</div></div>`; }).join('')}
          <div class="card card-b"><b>التقارير الموحدة</b><p class="muted small" style="margin:4px 0 0">بيانات كل فرع مستقلة بحسابه وصندوقه ومستودعه، والتقارير تعرض فرعًا واحدًا أو كل الفروع من محدد النطاق أعلى الشاشة.</p></div></div>`;
      } else if (t === 'branches') {
        body = `<div class="card">${UI.table({ id: 'brT', search: true, exportName: 'الفروع', tools: addBtn('addBranch', 'فرع جديد'), cols: [
          { label: 'الرمز', render: b => `<span class="num">${esc(b.code)}</span>` }, { label: 'الاسم', k: 'name' }, { label: 'المدينة', k: 'city' },
          { label: 'المستودع الرئيسي', render: b => esc((S.get('warehouses', b.mainWh) || {}).name) }, { label: 'حساب الصندوق', render: b => `<span class="num">${b.cashAccount}</span> ${esc((A.account(b.cashAccount) || {}).name || '')}` },
          { label: 'الأجهزة', num: 1, render: b => st.devices.filter(d => d.branchId === b.id).length }, { label: 'الحالة', render: b => `<span class="pill ${b.online ? 'ok' : 'bad'}">${b.online ? 'متصل' : 'غير متصل'}</span>` },
          { label: '', render: b => canEdit ? `<button class="btn sm ghost" data-act="editBranch" data-id="${b.id}">${icon('edit')}</button>` : '' }], rows: st.branches })}</div>`;
      } else if (t === 'warehouses') {
        body = `<div class="card">${UI.table({ id: 'whT', search: true, exportName: 'المستودعات', tools: addBtn('addWh', 'مستودع جديد'), cols: [
          { label: 'الرمز', render: w => `<span class="num">${esc(w.code)}</span>` }, { label: 'الاسم', k: 'name' }, { label: 'الفرع', render: w => esc(S.get('branches', w.branchId).name) },
          { label: 'عدد الأصناف بالرصيد', num: 1, render: w => st.products.filter(p => I.onHand(p.id, w.id) > 0).length }, { label: 'قيمة المخزون', num: 1, render: w => money(st.products.reduce((s, p) => s + I.valueOf(p.id, w.id), 0)) }], rows: st.warehouses })}</div>`;
      } else if (t === 'devices') {
        body = `<div class="card">${UI.table({ id: 'dvT', search: true, exportName: 'الأجهزة', tools: addBtn('addDevice', 'جهاز جديد'), cols: [
          { label: 'الرمز', render: d => `<span class="num">${esc(d.code)}</span>` }, { label: 'الاسم', k: 'name' }, { label: 'الفرع', render: d => esc(S.get('branches', d.branchId).name) },
          { label: 'الرقم التسلسلي', render: d => `<span class="num">${esc(d.serial)}</span>` }, { label: 'آخر رقم فاتورة', render: d => `<span class="num">${S.state.seq['inv.' + d.id] || 0}</span>` },
          { label: 'عداد ICV', num: 1, render: d => `<span class="num">${(st.zatcaChains[d.id] || {}).icv || 0}</span>` },
          { label: 'الوردية', render: d => st.shifts.some(s => s.deviceId === d.id && s.status === 'open') ? '<span class="pill ok">مفتوحة</span>' : '<span class="pill">مغلقة</span>' }], rows: st.devices })}
          <div class="card-b muted small">كل جهاز له تسلسل فواتير مستقل ببادئة (الفرع-الجهاز-الرقم) وسلسلة تجزئة ZATCA مستقلة، فلا تتضارب أرقام الفواتير عند العمل دون اتصال.</div></div>`;
      } else if (t === 'cash') {
        const boxes = st.branches.map(b => ({ name: A.account(b.cashAccount).name, code: b.cashAccount, branch: b.name, type: 'صندوق' }));
        const banks = st.banks.map(k => ({ name: k.name, code: k.account, branch: 'مركزي', type: 'بنك', iban: k.iban }));
        body = `<div class="card">${UI.table({ id: 'cashT', exportName: 'الصناديق والبنوك', tools: addBtn('addBank', 'حساب بنكي'), cols: [
          { label: 'النوع', render: r => `<span class="pill">${r.type}</span>` }, { label: 'الحساب', render: r => `<span class="num">${r.code}</span> ${esc(r.name)}` }, { label: 'الفرع', k: 'branch' },
          { label: 'IBAN', render: r => `<span class="num">${esc(r.iban || '—')}</span>` }, { label: 'الرصيد', num: 1, render: r => money(A.balance(r.code)) }], rows: boxes.concat(banks) })}</div>`;
      } else {
        body = `<div class="card">${UI.table({ id: 'ccT', exportName: 'مراكز التكلفة', tools: addBtn('addCC', 'مركز تكلفة'), cols: [
          { label: 'الرمز', render: c => `<span class="num">${esc(c.code)}</span>` }, { label: 'الاسم', k: 'name' },
          { label: 'مصروفات الشهر', num: 1, render: c => money(M.sum(A.lines({ cc: c.id, from: S.today().slice(0, 8) + '01' }), x => x.l.dr - x.l.cr)) }], rows: st.costCenters })}</div>`;
      }
      return tabs + body;
    },
    actions: {
      editCompany() {
        const c = S.state.company, a = c.address || {}, st = S.state.settings;
        UI.formModal({ title: 'بيانات المنشأة', wide: true, fields: [
          { name: 'name', label: 'اسم المنشأة', value: c.name }, { name: 'nameEn', label: 'الاسم بالإنجليزية', value: c.nameEn },
          { name: 'vat', label: 'الرقم الضريبي (15 رقمًا)', value: c.vat, attrs: 'maxlength="15" inputmode="numeric"' }, { name: 'cr', label: 'السجل التجاري', value: c.cr },
          { name: 'street', label: 'الشارع', value: a.street }, { name: 'building', label: 'رقم المبنى (4 أرقام)', value: a.building },
          { name: 'district', label: 'الحي', value: a.district }, { name: 'city', label: 'المدينة', value: a.city }, { name: 'postal', label: 'الرمز البريدي (5 أرقام)', value: a.postal },
          { name: 'phone', label: 'الهاتف', value: c.phone }, { name: 'email', label: 'البريد الإلكتروني', value: c.email },
          { name: 'costMethod', label: 'سياسة تكلفة المخزون', type: 'select', value: st.costMethod, options: [['WAC', 'المتوسط المرجح'], ['FIFO', 'الوارد أولًا صادر أولًا (FIFO)']], hint: 'التغيير يسري على الحركات اللاحقة فقط' },
          { name: 'sessionMinutes', label: 'مهلة الجلسة (دقيقة)', type: 'number', value: st.sessionMinutes },
          { name: 'neg', label: 'السماح بالبيع بالسالب', type: 'check', value: st.allowNegativeStock }],
          onSave(v) {
            AU.require('cfg.company');
            if (!Florix.Zatca.validVat(v.vat)) throw new Error('الرقم الضريبي يجب أن يكون 15 رقمًا يبدأ وينتهي بالرقم 3.');
            if (v.building && !/^\d{4}$/.test(v.building)) throw new Error('رقم المبنى يجب أن يكون 4 أرقام.');
            if (v.postal && !/^\d{5}$/.test(v.postal)) throw new Error('الرمز البريدي يجب أن يكون 5 أرقام.');
            Object.assign(c, { name: v.name, nameEn: v.nameEn, vat: v.vat, cr: v.cr, phone: v.phone, email: v.email, address: { street: v.street, building: v.building, district: v.district, city: v.city, postal: v.postal } });
            if (st.costMethod !== v.costMethod) { S.audit('settings.costMethod', 'company', null, `${st.costMethod} → ${v.costMethod}`); st.costMethod = v.costMethod; I.invalidate(); }
            st.sessionMinutes = Math.max(5, parseInt(v.sessionMinutes, 10) || 30); st.allowNegativeStock = v.neg;
            S.audit('company.update', 'company', null, ''); Florix.Sync.enqueue('company', 'update', 'company', null); S.save(); UI.toast('حُفظت بيانات المنشأة.', 'ok'); app().render();
          } });
      },
      addBranch() { branchForm(); }, editBranch(el) { branchForm(S.get('branches', el.dataset.id)); },
      addWh() {
        UI.formModal({ title: 'مستودع جديد', fields: [{ name: 'code', label: 'الرمز' }, { name: 'name', label: 'الاسم' }, { name: 'branchId', label: 'الفرع', type: 'select', options: S.state.branches.map(b => [b.id, b.name]) }],
          onSave(v) { AU.require('cfg.company'); if (!v.code || !v.name) throw new Error('الرمز والاسم مطلوبان.'); const w = { id: S.uuid(), ...v }; S.state.warehouses.push(w); S.audit('warehouse.create', 'warehouse', w.id, v.name); S.save(); app().render(); } });
      },
      addDevice() {
        UI.formModal({ title: 'جهاز بيع جديد', fields: [{ name: 'code', label: 'الرمز (مثال P03)' }, { name: 'name', label: 'الاسم' }, { name: 'serial', label: 'الرقم التسلسلي' }, { name: 'branchId', label: 'الفرع', type: 'select', options: S.state.branches.map(b => [b.id, b.name]) }],
          onSave(v) { AU.require('cfg.company'); if (!/^[A-Z0-9]{2,4}$/.test(v.code)) throw new Error('الرمز 2-4 أحرف إنجليزية كبيرة أو أرقام.'); if (S.state.devices.some(d => d.branchId === v.branchId && d.code === v.code)) throw new Error('الرمز مستخدم في هذا الفرع.'); const d = { id: S.uuid(), ...v }; S.state.devices.push(d); S.audit('device.create', 'device', d.id, v.code); S.save(); app().render(); } });
      },
      addBank() {
        UI.formModal({ title: 'حساب بنكي جديد', fields: [{ name: 'name', label: 'اسم البنك' }, { name: 'iban', label: 'IBAN' }],
          onSave(v) {
            AU.require('cfg.company'); if (!v.name) throw new Error('اسم البنك مطلوب.');
            let n = 1; while (A.account('1102' + String(n).padStart(2, '0'))) n++;
            const code = '1102' + String(n).padStart(2, '0'); A.addAccount({ code, name: v.name, parent: '1102' });
            S.state.banks.push({ id: S.uuid(), name: v.name, account: code, iban: v.iban }); S.save(); UI.toast('أُضيف الحساب ' + code + ' إلى شجرة الحسابات.', 'ok'); app().render();
          } });
      },
      addCC() {
        UI.formModal({ title: 'مركز تكلفة جديد', fields: [{ name: 'code', label: 'الرمز' }, { name: 'name', label: 'الاسم' }],
          onSave(v) { AU.require('cfg.company'); if (!v.code || !v.name) throw new Error('الرمز والاسم مطلوبان.'); S.state.costCenters.push({ id: S.uuid(), ...v }); S.audit('cc.create', 'cc', null, v.name); S.save(); app().render(); } });
      }
    }
  };
  function branchForm(b) {
    UI.formModal({ title: b ? 'تعديل الفرع' : 'فرع جديد', fields: [
      { name: 'code', label: 'الرمز (3 أحرف إنجليزية)', value: b && b.code, attrs: b ? 'readonly' : 'maxlength="3"' }, { name: 'name', label: 'الاسم', value: b && b.name },
      { name: 'city', label: 'المدينة', value: b && b.city }, { name: 'phone', label: 'الهاتف', value: b && b.phone }],
      onSave(v) {
        AU.require('cfg.company');
        if (b) { Object.assign(b, { name: v.name, city: v.city, phone: v.phone }); S.audit('branch.update', 'branch', b.id, v.name); }
        else {
          if (!/^[A-Z]{3}$/.test(v.code)) throw new Error('الرمز 3 أحرف إنجليزية كبيرة.');
          if (S.state.branches.some(x => x.code === v.code)) throw new Error('رمز الفرع مستخدم.');
          let n = 1; while (A.account('1101' + String(n).padStart(2, '0'))) n++;
          const acc = '1101' + String(n).padStart(2, '0'); A.addAccount({ code: acc, name: 'صندوق فرع ' + v.name, parent: '1101' });
          const id = 'b-' + v.code.toLowerCase(); const wid = 'w-' + v.code.toLowerCase();
          S.state.warehouses.push({ id: wid, code: 'WH-' + v.code, name: 'مستودع ' + v.name, branchId: id });
          S.state.devices.push({ id: 'd-' + v.code.toLowerCase() + '-1', code: 'P01', name: 'كاشير 1', branchId: id, serial: '—' }, { id: 'd-' + v.code.toLowerCase() + '-bo', code: 'BO', name: 'المكتب الخلفي', branchId: id, serial: '—' });
          S.state.branches.push({ id, code: v.code, name: v.name, city: v.city, phone: v.phone, cashAccount: acc, mainWh: wid, online: true, lastSync: null, active: true });
          S.audit('branch.create', 'branch', id, v.name); UI.toast('أُنشئ الفرع مع مستودعه وصندوقه وجهازين.', 'ok');
        }
        S.save(); app().render();
      } });
  }
})(window);

</script>
<script>
/* FLORIX فلوريكس — شاشة نقاط البيع (الكاشير) */
(function (root) {
  'use strict';
  const Florix = root.Florix; const V = Florix.Views = Florix.Views || {};
  const S = Florix.Store, M = Florix.Money, UI = Florix.UI, I = Florix.Inv, O = Florix.Ops, AU = Florix.Auth, Z = Florix.Zatca;
  const { icon, esc, money } = UI;
  const app = () => Florix.App;

  const st = { cart: [], customerId: '', type: 'simplified', cat: 'all', q: '' };
  const shift = () => S.state.shifts.find(s => s.deviceId === S.session.deviceId && s.status === 'open');
  const branch = () => S.get('branches', S.session.branchId);
  function computed() {
    const lines = st.cart.map(c => {
      const p = S.get('products', c.pid); const unit = c.unitName ? p.altUnits.find(u => u.name === c.unitName) : null;
      return O.line(p, c.qty, c.price, c.discount || 0, unit);
    });
    return { lines, t: O.totals(lines) };
  }
  function findByCode(code) {
    code = code.trim(); if (!code) return null;
    for (const p of S.state.products) {
      if (p.active === false) continue;
      if (p.barcode === code || p.code === code) return { p, unit: null };
      const u = (p.altUnits || []).find(x => x.barcode === code); if (u) return { p, unit: u };
    }
    return null;
  }
  function add(p, unit, qty) {
    const base = unit ? unit.price : O.priceFor(p, st.customerId);
    const ex = st.cart.find(c => c.pid === p.id && (c.unitName || null) === (unit ? unit.name : null));
    const want = (ex ? ex.qty : 0) + (qty || 1);
    const avail = I.onHand(p.id, branch().mainWh) / (unit ? unit.factor : 1);
    if (want > avail + 1e-9 && !S.state.settings.allowNegativeStock) { UI.toast(`الرصيد المتاح من «${p.nameAr}» ${M.fmtQty(avail)} فقط.`, 'bad'); return; }
    if (ex) ex.qty = M.qty(want); else st.cart.push({ pid: p.id, qty: qty || 1, price: base, discount: 0, unitName: unit ? unit.name : null });
  }

  V.pos = {
    title: 'نقطة البيع', icon: 'pos', perm: 'scr.pos', state: {},
    render() {
      const b = branch(); const dev = S.get('devices', S.session.deviceId); const sh = shift();
      if (!dev || dev.code === 'BO') return `<div class="alert warn">${icon('alert')}<span>الجهاز المختار هو المكتب الخلفي. سجّل الخروج واختر جهاز كاشير لفتح نقطة البيع.</span></div>`;
      if (!sh) {
        const last = S.state.shifts.filter(s => s.deviceId === dev.id && s.status === 'closed').slice(-5).reverse();
        return `<div class="grid g2"><div class="card"><div class="card-h"><h2>${icon('clock')} فتح وردية جديدة</h2></div><div class="card-b" style="display:flex;flex-direction:column;gap:12px">

          <button class="btn pri lg" data-act="openShift">${icon('play')}فتح الوردية</button>` : `<div class="alert warn">${icon('lock')}<span>لا تملك صلاحية فتح الوردية.</span></div>`}</div></div>
          <div class="card"><div class="card-h"><h2>آخر الورديات على هذا الجهاز</h2></div>${UI.table({ cols: [
            { label: 'الوردية', render: s => `<span class="num">${s.number}</span>` }, { label: 'التاريخ', render: s => `<span class="num">${s.date}</span>` },

      }
      const { lines, t } = computed();
      const cats = [['all', 'الكل']].concat(S.state.categories.map(c => [c.id, c.name]));
      const q = st.q.trim().toLowerCase();
      const prods = S.state.products.filter(p => p.active !== false && (st.cat === 'all' || p.categoryId === st.cat) && (!q || (p.nameAr + ' ' + p.nameEn + ' ' + p.code + ' ' + p.barcode).toLowerCase().includes(q)));
      const cust = st.customerId && S.get('customers', st.customerId);
      const canStd = cust && Z.validVat(cust.vat);
      if (!canStd) st.type = 'simplified';
      const held = S.state.held.filter(h => h.deviceId === dev.id);
      return `<div class="pos">
        <section class="pos-left">
          <div class="scan"><div class="search" style="flex:2">${icon('barcode')}<input class="input" id="scanIn" placeholder="امسح الباركود أو اكتب كود/اسم الصنف ثم Enter" data-input="search" value="${esc(st.q)}" aria-label="الباركود أو البحث" autocomplete="off"></div>
            <span class="pill pri">${icon('clock')}${esc(sh.number)} · ${esc(dev.code)}</span></div>
          <div class="cats">${cats.map(([k, l]) => `<button class="cat ${st.cat === k ? 'on' : ''}" data-act="cat" data-v="${k}">${esc(l)}</button>`).join('')}</div>
          <div class="prods">${prods.map(p => { const oh = I.onHand(p.id, b.mainWh); return `<button class="prod ${oh <= 0 ? 'out' : ''}" data-act="add" data-id="${p.id}" title="${esc(p.nameAr)} — ${esc(p.barcode)}">${UI.thumb(p)}<span class="nm">${esc(p.nameAr)}</span><span class="pr"><b>${M.fmt(p.price + M.rate(p.price, p.vatRate))}</b><span class="muted num">${M.fmtQty(oh)}</span></span></button>`; }).join('') || '<div class="empty">لا توجد أصناف مطابقة.</div>'}</div>
        </section>
        <section class="cart" aria-label="الفاتورة الحالية">
          <div class="cart-h"><div class="row"><select class="input sm grow" data-change="cust" aria-label="العميل"><option value="">عميل نقدي</option>${S.state.customers.map(c => `<option value="${c.id}" ${c.id === st.customerId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
            <button class="btn sm icon" data-act="newCust" title="عميل جديد" aria-label="عميل جديد">${icon('plus')}</button></div>
            <div class="row"><label class="check"><input type="radio" name="itype" value="simplified" data-change="itype" ${st.type === 'simplified' ? 'checked' : ''}> مبسطة (B2C)</label>
            <label class="check" title="${canStd ? '' : 'تتطلب عميلًا برقم ضريبي'}"><input type="radio" name="itype" value="standard" data-change="itype" ${st.type === 'standard' ? 'checked' : ''} ${canStd ? '' : 'disabled'}> ضريبية قياسية (B2B)</label></div></div>
          <div class="cart-lines">${lines.length ? lines.map((l, i) => `<div class="cl"><span class="nm">${esc(l.name)}</span><span class="tot">${M.fmt(l.total)}</span>
            <div class="ctl"><span class="qty"><button data-act="dec" data-i="${i}" aria-label="إنقاص">−</button><input value="${M.fmtQty(l.qty)}" data-change="setQty" data-i="${i}" inputmode="decimal" aria-label="الكمية"><button data-act="inc" data-i="${i}" aria-label="زيادة">+</button></span>
            <span class="small muted num">× ${M.fmt(l.price)}</span>${l.discount ? `<span class="pill warn small">خصم ${M.fmt(l.discount)}</span>` : ''}<span class="grow"></span>
            ${AU.can('pos.discount') ? `<button class="btn sm ghost icon" data-act="disc" data-i="${i}" title="خصم" aria-label="خصم">${icon('tag')}</button>` : ''}
            ${AU.can('pos.price') ? `<button class="btn sm ghost icon" data-act="price" data-i="${i}" title="تعديل السعر" aria-label="تعديل السعر">${icon('edit')}</button>` : ''}
            <button class="btn sm ghost icon" data-act="del" data-i="${i}" title="حذف" aria-label="حذف الصنف">${icon('trash')}</button></div></div>`).join('') : `<div class="empty">${icon('barcode')}<br>امسح باركود أو اختر صنفًا لبدء الفاتورة.</div>`}</div>
          <div class="cart-sum"><div class="r"><span>عدد الأصناف</span><span class="num">${lines.length}</span></div>
            <div class="r"><span>الإجمالي قبل الضريبة</span>${money(t.net + t.discount)}</div>${t.discount ? `<div class="r"><span>الخصم</span>${money(-t.discount)}</div>` : ''}
            <div class="r"><span>ضريبة القيمة المضافة 15%</span>${money(t.vat)}</div>
            <div class="r big"><span>المستحق</span><span class="num">${M.fmt(t.total)} <small>ر.س</small></span></div></div>
          <div class="cart-act"><button class="btn" data-act="hold" ${lines.length ? '' : 'disabled'}>${icon('pause')}تعليق</button>
            <button class="btn" data-act="held">${icon('play')}المعلقة${held.length ? ` <span class="badge warn">${held.length}</span>` : ''}</button>
            <button class="btn" data-act="ret" ${AU.can('pos.return') ? '' : 'disabled title="يتطلب صلاحية المرتجعات"'}>${icon('undo')}مرتجع</button>
            <button class="btn" data-act="closeShift">${icon('lock')}الوردية</button></div>
          <button class="btn pri pay-btn" data-act="pay" ${lines.length ? '' : 'disabled'}>${icon('cash')}الدفع · <span class="num">${M.fmt(t.total)}</span></button>
          ${lines.length ? `<button class="btn ghost sm" style="margin:-8px 14px 10px" data-act="clear">${icon('x')}إلغاء الفاتورة الحالية</button>` : ''}
        </section></div>`;
    },
    mount(el) {
      const s = el.querySelector('#scanIn'); if (!s) return;
      if (!document.querySelector('.modal-bg')) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
      s.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const v = s.value.trim(); if (!v) return;
        const hit = findByCode(v);
        if (hit) { add(hit.p, hit.unit); st.q = ''; app().render(); return; }
        const q = v.toLowerCase(); const m = S.state.products.filter(p => (p.nameAr + ' ' + p.nameEn).toLowerCase().includes(q));
        if (m.length === 1) { add(m[0]); st.q = ''; app().render(); } else UI.toast(m.length ? 'أكثر من صنف مطابق — اختر من القائمة.' : 'لا يوجد صنف بهذا الباركود أو الكود.', m.length ? '' : 'bad');
      });
    },
    actions: {
      search(el) { st.q = el.value; clearTimeout(st._t); st._t = setTimeout(() => app().render(), 220); },
      cat(el) { st.cat = el.dataset.v; app().render(); },
      add(el) { add(S.get('products', el.dataset.id)); app().render(); },
      inc(el) { const c = st.cart[+el.dataset.i]; const p = S.get('products', c.pid); const u = c.unitName && p.altUnits.find(x => x.name === c.unitName); add(p, u, 1); app().render(); },
      dec(el) { const c = st.cart[+el.dataset.i]; c.qty = M.qty(c.qty - 1); if (c.qty <= 0) st.cart.splice(+el.dataset.i, 1); app().render(); },
      setQty(el) { const c = st.cart[+el.dataset.i]; const v = M.qty(el.value); if (!(v > 0)) { UI.toast('كمية غير صالحة.', 'bad'); return app().render(); } c.qty = 0; const p = S.get('products', c.pid); add(p, c.unitName && p.altUnits.find(x => x.name === c.unitName), v); if (c.qty === 0) c.qty = 1; app().render(); },
      del(el) { st.cart.splice(+el.dataset.i, 1); app().render(); },
      clear() { UI.confirm('إلغاء الفاتورة الحالية وحذف جميع الأصناف؟', { danger: true, ok: 'إلغاء الفاتورة' }).then(ok => { if (ok) { st.cart = []; S.audit('pos.clear', 'cart', null, ''); app().render(); } }); },
      cust(el) { st.customerId = el.value; for (const c of st.cart) { const p = S.get('products', c.pid); if (!c.unitName) c.price = O.priceFor(p, st.customerId); } const cu = S.get('customers', st.customerId); st.type = cu && Z.validVat(cu.vat) ? 'standard' : 'simplified'; app().render(); },
      itype(el) { st.type = el.value; app().render(); },
      newCust() { V.partyForm('customer', null, c => { st.customerId = c.id; app().render(); }); },
      disc(el) {
        const i = +el.dataset.i; const { lines } = computed(); const l = lines[i]; const gross = l.net + l.discount;
        UI.formModal({ title: 'خصم على ' + l.name, fields: [{ name: 'pct', label: 'نسبة الخصم %', type: 'number', value: gross ? (l.discount * 100 / gross).toFixed(2) : '0', hint: `الحد المسموح لدورك: ${AU.maxDiscount()}%` }, { name: 'amt', label: 'أو مبلغ الخصم (ر.س)', type: 'money', value: '' }],
          onSave(v) {
            AU.require('pos.discount');
            const amt = v.amt ? M.toH(v.amt) : M.rate(gross, Math.round(parseFloat(v.pct || '0') * 100));
            if (isNaN(amt) || amt < 0 || amt > gross) throw new Error('قيمة خصم غير صالحة.');
            if (amt * 100 / gross > AU.maxDiscount() + 1e-9) throw new Error(`الخصم يتجاوز الحد المسموح (${AU.maxDiscount()}%).`);
            st.cart[i].discount = amt; S.audit('pos.discount', 'cart', null, `${l.name}: ${M.fmt(amt)}`); app().render();
          } });
      },
      price(el) {
        const i = +el.dataset.i; const c = st.cart[i];
        UI.formModal({ title: 'تعديل سعر الوحدة (قبل الضريبة)', fields: [{ name: 'price', label: 'السعر', type: 'money', value: M.plain(c.price) }],
          onSave(v) { AU.require('pos.price'); const h = M.toH(v.price); if (!(h > 0)) throw new Error('سعر غير صالح.'); S.audit('pos.price', 'cart', null, `${S.get('products', c.pid).nameAr}: ${M.fmt(c.price)} → ${M.fmt(h)}`); c.price = h; app().render(); } });
      },
      hold() {
        S.state.held.push({ id: S.uuid(), deviceId: S.session.deviceId, at: S.now(), cart: st.cart, customerId: st.customerId, type: st.type, userId: S.user().id });
        st.cart = []; st.customerId = ''; S.audit('pos.hold', 'cart', null, ''); S.save(); UI.toast('عُلّقت الفاتورة.', 'ok'); app().render();
      },
      held() {
        const list = S.state.held.filter(h => h.deviceId === S.session.deviceId);
        const m = UI.modal({ title: 'الفواتير المعلقة', body: list.length ? `<div class="list">${list.map(h => { const t = O.totals(h.cart.map(c => { const p = S.get('products', c.pid); return O.line(p, c.qty, c.price, c.discount, c.unitName && p.altUnits.find(u => u.name === c.unitName)); })); return `<div class="list-i"><span class="grow"><b class="num">${h.at.slice(11, 16)}</b> · ${h.cart.length} صنف ${h.customerId ? '· ' + esc(S.get('customers', h.customerId).name) : ''}</span>${money(t.total)}<button class="btn sm pri" data-h="${h.id}">استرجاع</button><button class="btn sm ghost icon" data-hd="${h.id}" aria-label="حذف">${icon('trash')}</button></div>`; }).join('')}</div>` : '<div class="empty">لا توجد فواتير معلقة.</div>',
          onOpen(el, close) {
            el.addEventListener('click', e => {
              const r = e.target.closest('[data-h]'), d = e.target.closest('[data-hd]');
              if (r) { if (st.cart.length) { UI.toast('أكمل الفاتورة الحالية أو علّقها أولًا.', 'bad'); return; } const h = S.state.held.find(x => x.id === r.dataset.h); st.cart = h.cart; st.customerId = h.customerId; st.type = h.type; S.state.held = S.state.held.filter(x => x !== h); S.save(); close(); app().render(); }
              if (d) { S.state.held = S.state.held.filter(x => x.id !== d.dataset.hd); S.audit('pos.held.delete', 'cart', null, ''); S.save(); close(); V.pos.actions.held(); }
            });
          } });
        return m;
      },
      pay() { payModal(); },
      openShift() {
        const v = M.toH(document.getElementById('openCash').value);
        if (isNaN(v) || v < 0) return UI.toast('رصيد بداية غير صالح.', 'bad');
        O.openShift({ branchId: S.session.branchId, deviceId: S.session.deviceId, openingCash: v }); UI.toast('فُتحت الوردية.', 'ok'); app().render();
      },
      closeShift() { closeShiftModal(); },
      zReport(el) { zReport(S.get('shifts', el.dataset.id)); },
      ret() { returnModal(); }
    }
  };

  function payModal() {
    const { t } = computed(); const total = t.total;
    const cust = st.customerId && S.get('customers', st.customerId);
    const methods = [['cash', 'نقدًا', 'cash'], ['mada', 'مدى', 'card'], ['card', 'بطاقة ائتمانية', 'card'], ['mixed', 'دفع مختلط', 'split'], ['credit', 'آجل', 'clock']];
    let method = 'cash';
    const body = () => `<div class="row between"><span class="muted">المستحق</span><b class="num" style="font-size:26px">${M.fmt(total)} ر.س</b></div>
      <div class="paym">${methods.map(([k, l, ic]) => `<button class="${k === method ? 'on' : ''}" data-m="${k}" ${k === 'credit' && (!cust || !AU.can('pos.credit')) ? 'disabled title="يتطلب عميلًا وصلاحية البيع الآجل"' : ''}>${icon(ic)}${l}</button>`).join('')}</div>
      <div data-pbody>${pbody()}</div>`;
    const pbody = () => {
      if (method === 'cash') return `<label class="field"><span>المبلغ المستلم</span><input class="input num-in" id="tend" inputmode="decimal" value="${M.plain(total)}" style="height:46px;font-size:20px"></label>
        <div class="row">${[total, Math.ceil(total / 1000) * 1000, Math.ceil(total / 5000) * 5000, Math.ceil(total / 10000) * 10000, Math.ceil(total / 50000) * 50000].filter((v, i, a) => a.indexOf(v) === i).map(v => `<button class="btn sm" data-q="${v}">${M.fmt(v)}</button>`).join('')}</div>
        <div class="row between"><span>المتبقي للعميل</span><b class="num" id="chg">0.00</b></div>`;
      if (method === 'mixed') return `<div class="form-grid"><label class="field"><span>نقدًا</span><input class="input num-in" name="m_cash" value="0"></label><label class="field"><span>مدى</span><input class="input num-in" name="m_mada" value="${M.plain(total)}"></label>
        <label class="field"><span>بطاقة ائتمانية</span><input class="input num-in" name="m_card" value="0"></label>${cust && AU.can('pos.credit') ? `<label class="field"><span>آجل</span><input class="input num-in" name="m_credit" value="0"></label>` : ''}</div><div class="row between"><span>المتبقي</span><b class="num" id="rem">0.00</b></div>`;
      if (method === 'credit') { const bal = O.customerBalance(cust.id); return `<div class="alert info">${icon('users')}<span>سيُسجل المبلغ على حساب <b>${esc(cust.name)}</b>. الرصيد الحالي ${M.fmt(bal)} من حد ائتمان ${M.fmt(cust.creditLimit)}.</span></div>`; }
      return `<div class="alert info">${icon('card')}<span>أكمل العملية على جهاز نقاط البيع (${method === 'mada' ? 'مدى' : 'البطاقة الائتمانية'}) ثم اضغط «إتمام البيع». الربط الفعلي مع جهاز الدفع يتم في التطبيق الإنتاجي.</span></div>`;
    };
    UI.modal({ title: 'الدفع', wide: true, body: body(),
      actions: [{ label: 'إتمام البيع', cls: 'pri', icon: 'check', onClick: (close, el) => {
        let payments, change = 0;
        if (method === 'cash') { const tend = M.toH(el.querySelector('#tend').value); if (isNaN(tend) || tend < total) throw new Error('المبلغ المستلم أقل من المستحق.'); change = tend - total; payments = [{ method: 'cash', amount: total }]; }
        else if (method === 'mixed') { payments = ['cash', 'mada', 'card', 'credit'].map(m => ({ method: m, amount: el.querySelector(`[name=m_${m}]`) ? M.toH(el.querySelector(`[name=m_${m}]`).value || '0') : 0 })).filter(p => p.amount); if (payments.some(p => isNaN(p.amount) || p.amount < 0)) throw new Error('مبالغ غير صالحة.'); }
        else payments = [{ method, amount: total }];
        const inv = O.sale({ branchId: S.session.branchId, deviceId: S.session.deviceId, shiftId: shift().id, customerId: st.customerId || null, type: st.type,
          lines: st.cart.map(c => ({ pid: c.pid, qty: c.qty, price: c.price, discount: c.discount, unitName: c.unitName })), payments });
        inv.change = change;
        st.cart = []; st.customerId = ''; st.type = 'simplified'; close(); app().render();
        UI.toast(`صدرت ${inv.number}${change ? ' — المتبقي للعميل ' + M.fmt(change) : ''}`, 'ok');
        UI.showDoc(inv);
      } }, { label: 'رجوع', onClick: c => c() }],
      onOpen(el) {
        const recalc = () => {
          const tend = el.querySelector('#tend'); if (tend) { const v = M.toH(tend.value); el.querySelector('#chg').textContent = isNaN(v) ? '—' : M.fmt(Math.max(0, v - total)); }
          const rem = el.querySelector('#rem'); if (rem) { const s = ['cash', 'mada', 'card', 'credit'].reduce((a, m) => a + (el.querySelector(`[name=m_${m}]`) ? (M.toH(el.querySelector(`[name=m_${m}]`).value) || 0) : 0), 0); rem.textContent = M.fmt(total - s); rem.className = 'num ' + (total - s ? 'bad-t' : 'ok-t'); }
        };
        el.addEventListener('click', e => {
          const m = e.target.closest('[data-m]'); if (m && !m.disabled) { method = m.dataset.m; el.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === m)); el.querySelector('[data-pbody]').innerHTML = pbody(); recalc(); }
          const q = e.target.closest('[data-q]'); if (q) { el.querySelector('#tend').value = M.plain(+q.dataset.q); recalc(); }
        });
        el.addEventListener('input', recalc); recalc();
      } });
  }

  function returnModal() {
    const recent = S.state.invoices.filter(i => i.kind === 'invoice' && i.branchId === S.session.branchId).slice(-40).reverse();
    UI.modal({ title: 'مرتجع مبيعات — إشعار دائن', wide: true,
      body: `<p class="muted small" style="margin:0">لا يُعدّل المستند المرحّل؛ يُصدر إشعار دائن مرتبط بالفاتورة الأصلية ويُعاد الصنف للمخزون بتكلفته الأصلية.</p>
        <div class="row"><input class="input grow" id="retNo" list="retList" placeholder="رقم الفاتورة الأصلية، مثال RYD-P01-000012" aria-label="رقم الفاتورة"><datalist id="retList">${recent.map(i => `<option value="${i.number}">`).join('')}</datalist><button class="btn" data-find>${icon('search')}بحث</button></div><div data-ret></div>`,
      actions: [{ label: 'إصدار الإشعار الدائن', cls: 'pri', icon: 'check', onClick: (close, el) => {
        const inv = el._inv; if (!inv) throw new Error('ابحث عن الفاتورة أولًا.');
        const lines = []; el.querySelectorAll('[data-rq]').forEach(i => { const q = M.qty(i.value || '0'); if (q > 0) lines.push({ index: +i.dataset.rq, qty: q }); });
        const cn = O.creditNote({ invoiceId: inv.id, lines, reason: el.querySelector('#retReason').value.trim(), refund: el.querySelector('#retRefund').value, shiftId: (shift() || {}).id, deviceId: S.session.deviceId });
        close(); app().render(); UI.toast('صدر الإشعار الدائن ' + cn.number, 'ok'); UI.showDoc(cn);
      } }, { label: 'إغلاق', onClick: c => c() }],
      onOpen(el) {
        const find = () => {
          const no = el.querySelector('#retNo').value.trim(); const inv = S.state.invoices.find(i => i.number === no && i.kind === 'invoice');
          const box = el.querySelector('[data-ret]');
          if (!inv) { el._inv = null; box.innerHTML = `<div class="alert bad">${icon('alert')}<span>لم يُعثر على فاتورة بهذا الرقم.</span></div>`; return; }

        <dl class="kv"><dt>رصيد البداية</dt><dd>${money(sh.openingCash)}</dd><dt>مبيعات نقدية</dt><dd>${money(s.cashSales)}</dd><dt>مردودات نقدية</dt><dd>${money(-s.cashRefunds)}</dd><dt><b>النقدية المتوقعة</b></dt><dd><b>${money(s.expected)}</b></dd></dl></div>
        <label class="field"><span>النقدية الفعلية بعد العدّ</span><input class="input num-in" id="counted" inputmode="decimal" value="${M.plain(s.expected)}" style="height:46px;font-size:20px"></label>
        <div class="row between"><span>الفرق</span><b class="num" id="cdiff">0.00</b></div><p class="muted small" style="margin:0">يُرحّل أي عجز أو زيادة تلقائيًا إلى حساب «عجز وزيادة الصندوق».</p>`,
      actions: [{ label: 'إغلاق الوردية', cls: 'pri', icon: 'lock', onClick: (close, el) => {
        const c = M.toH(el.querySelector('#counted').value); if (isNaN(c) || c < 0) throw new Error('مبلغ غير صالح.');
        const done = O.closeShift(sh.id, c); close(); st.cart = []; app().render(); zReport(done);
      } }, { label: 'رجوع', onClick: c => c() }],
      onOpen(el) { const f = () => { const v = M.toH(el.querySelector('#counted').value); const d = isNaN(v) ? 0 : v - s.expected; const x = el.querySelector('#cdiff'); x.textContent = M.fmt(d); x.className = 'num ' + (d < 0 ? 'bad-t' : d > 0 ? 'ok-t' : ''); }; el.addEventListener('input', f); f(); } });
  }
  function zReport(sh) {

    const html = `<div class="receipt"><div class="c"><b>${esc(S.state.company.name)}</b><br>${esc(b.name)}<br><b>تقرير إغلاق الوردية (Z)</b></div><hr>
      <table><tr><td>الوردية</td><td class="n">${sh.number}</td></tr><tr><td>الكاشير</td><td>${esc(u ? u.name : '')}</td></tr><tr><td>من</td><td class="n">${sh.openedAt.replace('T', ' ').slice(0, 16)}</td></tr><tr><td>إلى</td><td class="n">${(sh.closedAt || '').replace('T', ' ').slice(0, 16)}</td></tr></table><hr>
      <table><tr><td>عدد الفواتير</td><td class="n">${s.count}</td></tr><tr><td>المرتجعات</td><td class="n">${s.returns}</td></tr><tr><td>إجمالي المبيعات</td><td class="n">${M.fmt(s.total)}</td></tr><tr><td>منها ضريبة</td><td class="n">${M.fmt(s.vat)}</td></tr>
      <tr><td>نقدًا</td><td class="n">${M.fmt(s.cashSales)}</td></tr><tr><td>مدى</td><td class="n">${M.fmt(s.mada)}</td></tr><tr><td>بطاقات</td><td class="n">${M.fmt(s.card)}</td></tr><tr><td>آجل</td><td class="n">${M.fmt(s.credit)}</td></tr><tr><td>مردودات نقدية</td><td class="n">${M.fmt(s.cashRefunds)}</td></tr></table><hr>
      <table><tr><td>رصيد البداية</td><td class="n">${M.fmt(sh.openingCash)}</td></tr><tr><td>المتوقع</td><td class="n">${M.fmt(sh.expected)}</td></tr><tr><td>الفعلي</td><td class="n">${M.fmt(sh.counted)}</td></tr><tr><td><b>الفرق</b></td><td class="n"><b>${M.fmt(sh.diff)}</b></td></tr></table></div>`;
    UI.modal({ title: 'تقرير إغلاق الوردية', body: html, actions: [{ label: 'طباعة', icon: 'printer', cls: 'pri', onClick: () => UI.print(html, '80') }, { label: 'إغلاق', onClick: c => c() }] });
  }
})(window);

</script>
<script>
/* FLORIX فلوريكس — الأصناف والمخزون */
(function (root) {

        <div class="card">${UI.table({ id: 'prT', search: true, exportName: 'الأصناف', cols: [
          { label: '', render: p => `<div style="width:40px">${UI.thumb(p)}</div>` },
          { label: 'الكود', render: p => `<span class="num">${esc(p.code)}</span>` }, { label: 'الصنف', render: p => `<b>${esc(p.nameAr)}</b><br><span class="muted small">${esc(p.nameEn)}</span>` },

          { label: 'التصنيف', render: p => esc((S.get('categories', p.categoryId) || {}).name || '') }, { label: 'الوحدة', k: 'unit' },
          { label: 'التكلفة', num: 1, render: p => money(p.cost) }, { label: 'سعر البيع', num: 1, render: p => money(p.price) }, { label: 'الضريبة', render: p => `${p.vatRate / 100}%` },
          { label: 'الرصيد', num: 1, render: p => { const q = I.onHandBranch(p.id, sc); return `<span class="num ${q <= p.min ? 'bad-t' : ''}">${M.fmtQty(q)}</span>`; } },

          { label: '', render: p => `<div class="row" style="flex-wrap:nowrap"><button class="btn sm ghost icon" data-act="card" data-id="${p.id}" title="بطاقة الصنف" aria-label="بطاقة الصنف">${icon('eye')}</button>${AU.can('prd.edit') ? `<button class="btn sm ghost icon" data-act="edit" data-id="${p.id}" title="تعديل" aria-label="تعديل">${icon('edit')}</button>` : ''}</div>` }],

          actions: [{ label: 'إضافة', cls: 'pri', onClick: (close, el) => { const v = UI.read(el); if (!v.name) throw new Error('اسم التصنيف مطلوب.'); S.state.categories.push({ id: S.uuid(), name: v.name, color: v.color }); S.audit('category.create', 'category', null, v.name); S.save(); close(); app().render(); } }, { label: 'إغلاق', onClick: c => c() }] });
      }
    }
  };

  function productForm(p) {
    const alt = (p && p.altUnits) || [];
    const altHtml = `<div class="full"><div class="row between"><b class="small">الوحدات البديلة</b><button type="button" class="btn sm" data-addalt>${icon('plus')}وحدة</button></div>
      <div data-alts style="display:flex;flex-direction:column;gap:6px;margin-top:6px">${alt.map(altRow).join('')}</div></div>`;
    const m = UI.modal({ title: p ? 'تعديل الصنف' : 'صنف جديد', wide: true,
      body: UI.fields([
        { name: 'code', label: 'كود الصنف', value: p && p.code }, { name: 'barcode', label: 'الباركود (EAN-13)', value: p && p.barcode, hint: 'اتركه فارغًا لتوليد باركود داخلي' },
        { name: 'nameAr', label: 'الاسم بالعربية', value: p && p.nameAr }, { name: 'nameEn', label: 'الاسم بالإنجليزية', value: p && p.nameEn },
        { name: 'categoryId', label: 'التصنيف', type: 'select', value: p && p.categoryId, options: S.state.categories.map(c => [c.id, c.name]) },
        { name: 'unit', label: 'وحدة القياس الأساسية', value: p ? p.unit : 'حبة' },
        { name: 'cost', label: 'سعر الشراء / التكلفة المعيارية (قبل الضريبة)', type: 'money', value: p ? M.plain(p.cost) : '' },
        { name: 'price', label: 'سعر البيع (قبل الضريبة)', type: 'money', value: p ? M.plain(p.price) : '', attrs: p && !AU.can('prd.price') ? 'readonly title="يتطلب صلاحية تعديل الأسعار"' : '' },
        { name: 'vatRate', label: 'الضريبة', type: 'select', value: p ? p.vatRate : 1500, options: [[1500, 'خاضع 15%'], [0, 'نسبة صفرية 0%']] },
        { name: 'min', label: 'الحد الأدنى للمخزون', type: 'number', value: p ? p.min : 5 }, { name: 'max', label: 'الحد الأقصى للمخزون', type: 'number', value: p ? p.max : 50 },
        { name: 'image', label: 'صورة الصنف', type: 'file', attrs: 'accept="image/*"' },
        { name: 'trackBatch', label: 'تتبع الدفعات وتاريخ الصلاحية', type: 'check', value: p && p.trackBatch },
        { name: 'active', label: 'صنف نشط', type: 'check', value: p ? p.active !== false : true },
        { type: 'html', full: true, html: altHtml }]) + (p ? `<div class="muted small">الإصدار ${p.version || 0} — تعديل السعر يُسجل في سجل التدقيق ويُرسل للمركز مع رقم الإصدار لكشف التعارض.</div>` : ''),
      actions: [{ label: 'حفظ', cls: 'pri', icon: 'check', onClick: (close, el) => {
        const v = UI.read(el); const cost = M.toH(v.cost), price = M.toH(v.price);
        if (isNaN(cost) || isNaN(price) || price <= 0) throw new Error('أدخل تكلفة وسعر بيع صحيحين.');
        const alts = Array.from(el.querySelectorAll('[data-alt]')).map(r => ({ name: r.querySelector('[data-k=name]').value.trim(), factor: parseFloat(r.querySelector('[data-k=factor]').value), price: M.toH(r.querySelector('[data-k=price]').value), barcode: r.querySelector('[data-k=barcode]').value.trim() })).filter(a => a.name);
        if (alts.some(a => !(a.factor > 0) || !(a.price > 0))) throw new Error('أكمل بيانات الوحدات البديلة (المعامل والسعر).');
        const save = image => {
          const data = { id: p && p.id, code: v.code, barcode: v.barcode || Florix.Seed.ean13('2' + String(Date.now()).slice(-11)), nameAr: v.nameAr, nameEn: v.nameEn, categoryId: v.categoryId, unit: v.unit,
            cost, price, vatRate: +v.vatRate, min: +v.min || 0, max: +v.max || 0, trackBatch: v.trackBatch, active: v.active, altUnits: alts, image: image !== undefined ? image : (p ? p.image : null) };
          try { O.saveProduct(data); close(); UI.toast('حُفظ الصنف.', 'ok'); app().render(); } catch (e) { UI.err(e); }

      onOpen(el) { el.querySelector('[data-addalt]').onclick = () => el.querySelector('[data-alts]').insertAdjacentHTML('beforeend', altRow({})); el.addEventListener('click', e => { const x = e.target.closest('[data-delalt]'); if (x) x.closest('[data-alt]').remove(); }); } });

  }
  function altRow(a) {

  V.inventory = {
    title: 'المخزون', icon: 'layers', perm: 'scr.inventory', state: { tab: 'stock', wh: '' },
    render() {
      const sc = app().scope(); const t = this.state.tab;

        const wh = this.state.wh && whs.some(w => w.id === this.state.wh) ? this.state.wh : '';
