<style>
/* FLORIX فلوريكس — نظام التصميم للنظام (مأخوذ من FLORIX Design System)
   الأرضية بيضاء أو كحلية، الأزرق التقني للأفعال الأساسية، والبنفسجي لمسة ثانوية في الرسوم. خطوط: Tajawal للعربية و Sora للاتينية والأرقام. */
:root {
  --bg: #F5F7FB; --surface: #FFFFFF; --surface-2: #EEF2F8; --surface-3: #E3E9F2; --line: #E2E8F0; --line-2: #8A99AF;
  --fg: #0B1F44; --fg-2: #24365C; --muted: #64748B; --primary: #2563EB; --primary-2: #1D4ED8; --primary-soft: #E3ECFD; --on-primary: #FFFFFF;
  --accent: #8B5CF6; --accent-soft: #EFE9FE; --navy: #0B1F44; --cyan: #06B6D4; --pos: #F59E0B;
  --ok: #15803D; --ok-soft: #DCF3E4; --warn: #B45309; --warn-soft: #FDF0DA; --bad: #DC2626; --bad-soft: #FDE4E4; --info: #2563EB; --info-soft: #E3ECFD;
  --shadow: 0 1px 2px rgba(11, 31, 68, .08), 0 8px 24px rgba(11, 31, 68, .08);
  --grad-premium: linear-gradient(135deg, #0B1F44 0%, #163C8C 55%, #4B3AA8 100%);
  --f-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  --f-display: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  --f-mono: "Sora", "Segoe UI", system-ui, sans-serif;
  --r: 10px; --r-lg: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #071430; --surface: #0B1F44; --surface-2: #12295A; --surface-3: #1A3470; --line: #24407A; --line-2: #5A78B0;
  --fg: #EEF3FB; --fg-2: #C9D5EA; --muted: #A9B6CC; --primary: #7AA5FF; --primary-2: #9DBDFF; --primary-soft: #17336B; --on-primary: #0B1F44;
  --accent: #A78BFA; --accent-soft: #2A2160;
  --ok: #4ADE80; --ok-soft: #10331F; --warn: #FBBF24; --warn-soft: #3A2C0B; --bad: #F87171; --bad-soft: #3B1518; --info: #7AA5FF; --info-soft: #17336B;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #071430; --surface: #0B1F44; --surface-2: #12295A; --surface-3: #1A3470; --line: #24407A; --line-2: #5A78B0;
  --fg: #EEF3FB; --fg-2: #C9D5EA; --muted: #A9B6CC; --primary: #7AA5FF; --primary-2: #9DBDFF; --primary-soft: #17336B; --on-primary: #0B1F44;
  --accent: #A78BFA; --accent-soft: #2A2160;
  --ok: #4ADE80; --ok-soft: #10331F; --warn: #FBBF24; --warn-soft: #3A2C0B; --bad: #F87171; --bad-soft: #3B1518; --info: #7AA5FF; --info-soft: #17336B;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
#app { height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
a { color: var(--primary); }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.num { white-space: nowrap; }
.muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
.ok-t { color: var(--ok); } .bad-t { color: var(--bad); } .warn-t { color: var(--warn); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ===== الشاشة الافتتاحية (تأثير 3D خفيف هنا فقط) ===== */
.splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 38%, #163C8C 0%, #0B1F44 52%, #061226 100%); color: #FFFFFF; overflow: hidden; cursor: pointer; transition: opacity .5s; }
.splash.out { opacity: 0; pointer-events: none; }
.orbit-stage { width: 280px; height: 280px; perspective: 900px; position: relative; margin-inline: auto; }
.orbit-3d { position: absolute; inset: 0; transform-style: preserve-3d; animation: tilt 7s ease-in-out infinite alternate; }
.ring { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(6, 182, 212, .5); transform-style: preserve-3d; }
.ring.r1 { transform: rotateX(72deg); animation: spin1 7s linear infinite; }
.ring.r2 { inset: 20px; border-color: rgba(139, 92, 246, .55); transform: rotateX(72deg) rotateY(55deg); animation: spin2 10s linear infinite; }
.ring.r3 { inset: 44px; border-color: rgba(255, 255, 255, .28); transform: rotateX(72deg) rotateY(-55deg); animation: spin3 13s linear infinite; }
.ring::after { content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #06B6D4; }
.ring.r2::after { background: #8B5CF6; } .ring.r3::after { background: #FFFFFF; width: 6px; height: 6px; }
.splash-sym { position: absolute; left: 50%; top: 50%; width: 150px; transform: translate(-50%, -50%); animation: float 4.5s ease-in-out infinite; filter: drop-shadow(0 12px 24px rgba(0, 0, 0, .35)); }
@keyframes spin1 { to { transform: rotateX(72deg) rotateZ(360deg); } }

.splash-title { text-align: center; margin-top: 14px; }

/* ===== الشعار ===== */

/* ===== تسجيل الدخول واختيار الفرع ===== */

/* ===== الهيكل ===== */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }

.content > .wrap { max-width: 1400px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }

.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.info { background: var(--info-soft); color: var(--info); } .pill.pri { background: var(--primary-soft); color: var(--primary); }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset-block: 0; right: 0; width: min(280px, 86vw); z-index: 40; transform: translateX(105%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }

}

/* ===== المكونات ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap; }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-2-1, .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .g2, .g4 { grid-template-columns: minmax(0, 1fr); } }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tab { padding: 9px 14px; border: 0; background: none; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: 13.5px; }

.tbl-wrap { overflow-x: auto; }

.tbl th { text-align: start; font-weight: 600; color: var(--muted); font-size: 12px; padding: 9px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
.tbl td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: color-mix(in srgb, var(--primary-soft) 45%, transparent); }
.tbl td.n, .tbl th.n { text-align: left; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.input, select.input, textarea.input { height: 36px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); padding: 0 10px; width: 100%; min-width: 0; }
textarea.input { height: auto; padding: 8px 10px; min-height: 70px; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }

.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
.search { position: relative; flex: 1; min-width: 160px; }

.alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--r); font-size: 13px; align-items: flex-start; }

.alert.warn { background: var(--warn-soft); color: var(--warn); } .alert.bad { background: var(--bad-soft); color: var(--bad); } .alert.info { background: var(--info-soft); color: var(--info); } .alert.ok { background: var(--ok-soft); color: var(--ok); }
.alert b { color: inherit; }
.list { display: flex; flex-direction: column; }

.list-i:last-child { border-bottom: 0; }

.sev.bad { background: var(--bad); } .sev.warn { background: var(--warn); } .sev.info { background: var(--info); } .sev.ok { background: var(--ok); }

/* ===== النوافذ ===== */
.modal-bg { position: fixed; inset: 0; background: rgba(5, 20, 22, .5); z-index: 60; display: grid; place-items: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.modal { background: var(--surface); border-radius: 14px; width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); min-width: 0; }
.modal.wide { width: min(920px, 100%); } .modal.xwide { width: min(1180px, 100%); }

.toasts { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); z-index: 80; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 9px; font-size: 13px; box-shadow: var(--shadow); white-space: pre-line; animation: tin .2s; }
.toast.bad { background: var(--bad); color: #fff; } .toast.ok { background: var(--ok); color: #fff; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }

/* ===== الرسوم ===== */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-mono); }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--primary); stroke-width: 2; }
.chart .ar { fill: var(--primary); opacity: .1; }
.chart .bar { fill: var(--primary); } .chart .bar.alt { fill: var(--accent); }

.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }

.hbar { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 12.5px; padding: 5px 0; }

/* ===== نقاط البيع ===== */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; height: calc(100vh - 58px - 60px); min-height: 560px; }
.pos-left { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }

.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; flex: none; }
.cat { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.cat.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.prods { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 10px; align-content: start; padding: 2px; }
.prod { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 8px; cursor: pointer; text-align: start; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.prod:hover { border-color: var(--primary); }
.prod .thumb { aspect-ratio: 4 / 3; border-radius: 8px; display: grid; place-items: center; overflow: hidden; max-width: 100%; }
.prod .thumb img { width: 100%; height: 100%; object-fit: cover; }
.prod .nm { font-size: 12.5px; line-height: 1.35; height: 2.7em; overflow: hidden; }
.prod .pr { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
.prod .pr b { font-family: var(--f-mono); font-size: 13.5px; }

.cart { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }

.qty { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }

.cart-act { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 0 14px 12px; }

@media (max-width: 1100px) { .pos { grid-template-columns: minmax(0, 1fr); height: auto; } .prods { max-height: 50vh; } .cart { min-height: 480px; } .paym { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ===== الإيصال والطباعة ===== */
.receipt { width: 302px; max-width: 100%; margin-inline: auto; background: #fff; color: #111; padding: 14px 12px; font-size: 12px; line-height: 1.5; border: 1px dashed #bbb; font-family: var(--f-body); }
.receipt .c { text-align: center; } .receipt hr { border: 0; border-top: 1px dashed #999; margin: 6px 0; }
.receipt table { width: 100%; border-collapse: collapse; font-size: 11.5px; } .receipt td { padding: 2px 0; vertical-align: top; }
.receipt .n { text-align: left; font-family: var(--f-mono); }

<!-- النواة: منطق الأعمال منفصل عن الواجهة وقابل للاختبار في Node -->
<script>
/* FLORIX فلوريكس — وحدة المبالغ المالية
 * جميع المبالغ تُخزَّن كأعداد صحيحة بالهللة (1 ريال = 100 هللة) ولا تُستخدم الأعداد العشرية العائمة للتخزين.
 * في الإنتاج: numeric(18,4) في PostgreSQL و decimal في .NET.
 * الكميات تُعالج بدقة ثلاث خانات (1/1000) لدعم الوزن.
 */
(function (root) {
  'use strict';
  const Florix = root.Florix = root.Florix || {};
  const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';

  function normalize(v) {
    return String(v).trim().replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d)).replace(/[٫]/g, '.').replace(/[,\s٬]/g, '');
  }

  // قسمة صحيحة مع تقريب نصف للأعلى بعيدًا عن الصفر
  function divRound(a, b) {
    if (b === 0) throw new Error('division by zero');
    const neg = (a < 0) !== (b < 0);
    a = Math.abs(a); b = Math.abs(b);
    const q = Math.floor((2 * a + b) / (2 * b));
    return neg ? -q : q;
  }

  const Money = {
    /** تحويل نص أو رقم إلى هللات */
    toH(v) {
      if (v === null || v === undefined || v === '') return 0;
      const s = normalize(v);
      if (!/^-?\d*(\.\d*)?$/.test(s) || s === '-' || s === '.') return NaN;
      const neg = s.startsWith('-');
      const [i, f = ''] = s.replace('-', '').split('.');
      let h = parseInt(i || '0', 10) * 100 + parseInt((f + '00').slice(0, 2), 10);
      if (f.length > 2 && +f[2] >= 5) h += 1;
      return neg ? -h : h;
    },
    /** تحويل الكمية إلى أجزاء من الألف */
    toMilli(q) {
      const s = normalize(q);
      if (!/^-?\d*(\.\d*)?$/.test(s)) return NaN;
      const neg = s.startsWith('-');
      const [i, f = ''] = s.replace('-', '').split('.');
      let m = parseInt(i || '0', 10) * 1000 + parseInt((f + '000').slice(0, 3), 10);
      if (f.length > 3 && +f[3] >= 5) m += 1;
      return neg ? -m : m;
    },
    qty(q) { return Money.toMilli(q) / 1000; },
    /** سعر الوحدة × الكمية بدقة دون أخطاء عائمة */
    mulQty(priceH, qty) { return divRound(priceH * Money.toMilli(qty), 1000); },
    /** نسبة بنقاط الأساس (1500 = 15%) */
    rate(h, bp) { return divRound(h * bp, 10000); },
    divRound,
    sum(arr, f) { let t = 0; for (const x of arr) t += f ? (f(x) || 0) : (x || 0); return t; },
    /** تنسيق للعرض: 1,234.50 */
    fmt(h, opts) {
      if (h === null || h === undefined || isNaN(h)) return '—';
      const neg = h < 0; const a = Math.abs(Math.round(h));
      const i = Math.floor(a / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      const s = i + '.' + String(a % 100).padStart(2, '0');
      const out = (neg ? '-' : '') + s;
      return opts && opts.sym ? out + ' ر.س' : out;
    },
    /** نص بصيغة آلية بدون فواصل (لـ XML و QR) */
    plain(h) {
      const neg = h < 0; const a = Math.abs(h);
      return (neg ? '-' : '') + Math.floor(a / 100) + '.' + String(a % 100).padStart(2, '0');
    },
    fmtQty(q) {
      const r = Math.round(q * 1000) / 1000;
      return Number.isInteger(r) ? String(r) : r.toFixed(3).replace(/0+$/, '');
    }
  };

  Florix.Money = Money;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* FLORIX فلوريكس — أدوات تشفير متزامنة: SHA-256 و HMAC و PBKDF2 و UUID و Base64
 * تنفيذ متزامن ليعمل النموذج من ملف محلي دون الحاجة لسياق آمن.
 * في الإنتاج: كلمات المرور تُجزأ في الخادم (ASP.NET Identity / Argon2id) ولا تُعالج في المتصفح.
 */
(function (root) {
  'use strict';
  const Florix = root.Florix = root.Florix || {};

  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);

  const enc = new TextEncoder();
  const utf8 = s => enc.encode(s);

  function sha256(bytes) {
    if (typeof bytes === 'string') bytes = utf8(bytes);
    const l = bytes.length;
    const padded = ((l + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(padded); buf.set(bytes); buf[l] = 0x80;
    const dv = new DataView(buf.buffer);
    const bits = l * 8;
    dv.setUint32(padded - 4, bits >>> 0);
    dv.setUint32(padded - 8, Math.floor(bits / 0x100000000));
    const h = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
    const w = new Uint32Array(64);
    for (let off = 0; off < padded; off += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
      for (let i = 16; i < 64; i++) {
        const x = w[i - 15], y = w[i - 2];
        const s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
        const s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      let a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
      for (let i = 0; i < 64; i++) {
        const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        const ch = (e & f) ^ (~e & g);
        const t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
        const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
      h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
    }
    const out = new Uint8Array(32); const odv = new DataView(out.buffer);
    for (let i = 0; i < 8; i++) odv.setUint32(i * 4, h[i]);
    return out;
  }

  const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  function b64(bytes) {
    let s = ''; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  function unb64(str) { const s = atob(str); const o = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) o[i] = s.charCodeAt(i); return o; }

  function concat(a, b) { const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; }
  function hmac(key, msg) {
    if (typeof key === 'string') key = utf8(key);
    if (typeof msg === 'string') msg = utf8(msg);
    if (key.length > 64) key = sha256(key);
    const k = new Uint8Array(64); k.set(key);
    const ipad = k.map(x => x ^ 0x36), opad = k.map(x => x ^ 0x5c);
    return sha256(concat(opad, sha256(concat(ipad, msg))));
  }
  function pbkdf2(password, salt, iterations, len) {
    const pw = utf8(password); const sl = typeof salt === 'string' ? utf8(salt) : salt;
    const out = new Uint8Array(len || 32); let pos = 0, block = 1;
    while (pos < out.length) {
      const bi = new Uint8Array([block >>> 24, (block >>> 16) & 255, (block >>> 8) & 255, block & 255]);
      let u = hmac(pw, concat(sl, bi)); const t = u.slice();
      for (let i = 1; i < iterations; i++) { u = hmac(pw, u); for (let j = 0; j < 32; j++) t[j] ^= u[j]; }
      out.set(t.slice(0, Math.min(32, out.length - pos)), pos); pos += 32; block++;
    }
    return out;
  }

  function randomBytes(n) {
    const a = new Uint8Array(n);
    const c = root.crypto;
    if (c && c.getRandomValues) c.getRandomValues(a); else for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256);
    return a;
  }
  function uuid() {
    const b = randomBytes(16); b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const x = hex(b); return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20)}`;
  }

  Florix.Crypto = { sha256, hex, b64, unb64, hmac, pbkdf2, uuid, randomBytes, utf8,
    sha256Hex: s => hex(sha256(s)), sha256B64: s => b64(sha256(s)) };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* FLORIX فلوريكس — مخزن الحالة (يمثل قاعدة البيانات المحلية للفرع في النموذج)
 * في الإنتاج: SQLite محليًا في تطبيق الكاشير، و PostgreSQL مركزيًا.
 * الحفظ هنا في localStorage للمتصفح الحالي فقط.
 */
(function (root) {
  'use strict';
  const Florix = root.Florix = root.Florix || {};
  const KEY = 'florix.pos.v1';
  const SESSION_KEY = 'florix.session.v1';

  const Store = {
    state: null,
    session: null,
    silent: false,          // يُستخدم أثناء توليد البيانات التجريبية
    saveError: null,
    _listeners: [],
    _timer: null,
    _clock: null,           // يمكن تثبيت الوقت أثناء التوليد

    uuid() { return Florix.Crypto.uuid(); },
    now() { return Store.iso(Store.nowDate()); },
    /** طابع زمني محلي مع فرق التوقيت، مثال 2026-11-08T20:15:03+03:00 */
    iso(d) {
      const o = -d.getTimezoneOffset(); const s = o >= 0 ? '+' : '-'; const a = Math.abs(o);
      return Store.today(d) + 'T' + Store.timeOf(d) + s + String(Math.floor(a / 60)).padStart(2, '0') + ':' + String(a % 60).padStart(2, '0');
    },
    nowDate() { return Store._clock ? new Date(Store._clock) : new Date(); },
    /** التاريخ المحلي بصيغة YYYY-MM-DD */
    today(d) {
      d = d || Store.nowDate();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    },
    timeOf(d) { d = d || Store.nowDate(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`; },

    load() {
      try {
        const raw = root.localStorage && root.localStorage.getItem(KEY);
        if (raw) { Store.state = JSON.parse(raw); return true; }
      } catch (e) { Store.saveError = 'تعذر قراءة البيانات المحفوظة: ' + e.message; }
      return false;
    },
    save() {
      if (Store.silent) return;
      clearTimeout(Store._timer);
      Store._timer = setTimeout(Store.saveNow, 250);
    },
    saveNow() {
      try {
        if (root.localStorage) root.localStorage.setItem(KEY, JSON.stringify(Store.state));
        Store.saveError = null;
      } catch (e) { Store.saveError = 'تعذر الحفظ في المتصفح (قد تكون المساحة ممتلئة). البيانات محفوظة في الذاكرة فقط.'; }
    },
    wipe() {
      try { root.localStorage && root.localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
      try { root.sessionStorage && root.sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
    },
    saveSession() {
      try { root.sessionStorage && root.sessionStorage.setItem(SESSION_KEY, JSON.stringify(Store.session)); } catch (e) { /* ignore */ }
    },
    loadSession() {
      try { const r = root.sessionStorage && root.sessionStorage.getItem(SESSION_KEY); if (r) Store.session = JSON.parse(r); } catch (e) { /* ignore */ }
      return Store.session;
    },

    on(fn) { Store._listeners.push(fn); },
    emit(what) { if (Store.silent) return; for (const fn of Store._listeners) { try { fn(what); } catch (e) { console.error(e); } } },

    get(coll, id) { return (Store.state[coll] || []).find(x => x.id === id); },
    list(coll) { return Store.state[coll] || []; },

    /** رقم تسلسلي لكل مفتاح (مثلاً لكل جهاز كاشير) */
    seq(key) {
      const s = Store.state.seq; s[key] = (s[key] || 0) + 1; return s[key];
    },

    user() { return Store.session && Store.get('users', Store.session.userId); },
    branchId() { return Store.session && Store.session.branchId; },

    audit(action, entity, entityId, details) {
      if (Store.silent && !Store._forceAudit) return;
      const u = Store.user();
      Store.state.auditLog.unshift({
        id: Store.uuid(), at: Store.now(), userId: u ? u.id : null, userName: u ? u.name : 'النظام',
        branchId: Store.branchId() || null, action, entity, entityId: entityId || null, details: details || ''
      });
      if (Store.state.auditLog.length > 3000) Store.state.auditLog.length = 3000; // حد للنموذج فقط
    }
  };

  Florix.Store = Store;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  ];
  const ALL = CATALOG.flatMap(g => g.items.map(i => i[0]));

  const Auth = {
    CATALOG, ALL,
    hash(password, salt) { return Florix.Crypto.hex(Florix.Crypto.pbkdf2(password, salt, 600, 32)); },
    makeUser(u, password) {
      const salt = Florix.Crypto.hex(Florix.Crypto.randomBytes(16));
      return Object.assign({ active: true, failed: 0, lockedUntil: null }, u, { salt, passHash: Auth.hash(password, salt) });
    },
    login(username, password) {
      const st = S().state;
      const u = st.users.find(x => x.username.toLowerCase() === String(username).trim().toLowerCase());
      if (!u) return { ok: false, msg: 'اسم المستخدم أو كلمة المرور غير صحيحة.' };
      if (!u.active) return { ok: false, msg: 'هذا الحساب موقوف. تواصل مع مدير النظام.' };
      if (u.lockedUntil && new Date(u.lockedUntil) > new Date()) return { ok: false, msg: 'الحساب مقفل مؤقتًا بعد محاولات فاشلة. حاول بعد 5 دقائق.' };
      if (Auth.hash(password, u.salt) !== u.passHash) {
        u.failed = (u.failed || 0) + 1;
        if (u.failed >= 5) { u.lockedUntil = new Date(Date.now() + 5 * 60000).toISOString(); u.failed = 0; }
        S().session = null;
        S()._forceAudit = true; S().audit('login.failed', 'user', u.id, username); S()._forceAudit = false;
        S().save();
        return { ok: false, msg: 'اسم المستخدم أو كلمة المرور غير صحيحة.' };
      }
      u.failed = 0; u.lockedUntil = null; u.lastLogin = S().iso(new Date());
      S().session = { userId: u.id, branchId: null, deviceId: null, startedAt: Date.now(), lastActive: Date.now(), token: Florix.Crypto.uuid() };
      S().audit('login', 'user', u.id, '');
      S().save(); S().saveSession();
      return { ok: true, user: u };
    },
    logout() {
      if (S().session) S().audit('logout', 'user', S().session.userId, '');
      S().session = null; S().saveSession(); S().save();
    },
    role(u) { u = u || S().user(); return u && S().get('roles', u.roleId); },
    can(perm) {
      const r = Auth.role(); if (!r) return false;
      return r.perms.includes('*') || r.perms.includes(perm);
    },
    /** الفروع المسموح بها للمستخدم */
    branches(u) {
      u = u || S().user(); if (!u) return [];
      const all = S().state.branches.filter(b => b.active !== false);
      if (Auth.roleHas(u, 'all.branches') || (u.branches || []).includes('*')) return all;
      return all.filter(b => (u.branches || []).includes(b.id));
    },
    roleHas(u, perm) { const r = Auth.role(u); return !!r && (r.perms.includes('*') || r.perms.includes(perm)); },
    canBranch(branchId) { return Auth.branches().some(b => b.id === branchId); },
    maxDiscount() { const r = Auth.role(); return r ? (r.maxDiscountPct || 0) : 0; },
    /** يرمي خطأ عند غياب الصلاحية — يُستدعى في طبقة العمليات وليس الواجهة فقط */
    require(perm) { if (!Auth.can(perm)) throw new Error('لا تملك صلاحية: ' + Auth.label(perm)); },
    label(perm) { for (const g of CATALOG) for (const [k, l] of g.items) if (k === perm) return l; return perm; },
    touch() { if (S().session) { S().session.lastActive = Date.now(); } },
    expired(minutes) { const s = S().session; return !!s && Date.now() - s.lastActive > minutes * 60000; }
  };

  Florix.Auth = Auth;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* FLORIX فلوريكس — المحرك المحاسبي: القيود، الترحيل، الأرصدة، القوائم المالية
 * قواعد ملزمة: القيد متوازن، الحساب نهائي (غير تجميعي)، الفترة مفتوحة، كل قيد مرتبط بمصدره.
 */
(function (root) {
  'use strict';
  const Florix = root.Florix = root.Florix || {};
  const S = () => Florix.Store;
  const M = () => Florix.Money;

  const TYPES = { asset: 'أصول', liability: 'خصوم', equity: 'حقوق ملكية', revenue: 'إيرادات', expense: 'مصروفات' };
  const DEBIT_NATURE = { asset: true, expense: true, liability: false, equity: false, revenue: false };

  const Acc = {
    TYPES,
    account(code) { return S().state.accounts.find(a => a.code === code); },
    children(code) { return S().state.accounts.filter(a => a.parent === code); },
    isLeaf(code) { return !S().state.accounts.some(a => a.parent === code); },
    debitNature(acc) { if (acc.contra) return !DEBIT_NATURE[acc.type]; return DEBIT_NATURE[acc.type]; },
    /** هل يبدأ الحساب أو أحد آبائه بالرمز المعطى */
    under(code, prefix) {
      let a = Acc.account(code);
      while (a) { if (a.code === prefix) return true; a = a.parent ? Acc.account(a.parent) : null; }
      return false;
    },

    periodOf(date) { return date.slice(0, 7); },
    isPeriodClosed(date) {
      const p = S().state.periods.find(x => x.id === Acc.periodOf(date));
      if (p && p.status === 'closed') return true;
      const y = S().state.closedYears || [];
      return y.includes(date.slice(0, 4));
    },

    addAccount({ code, name, parent, type, contra }) {
      if (!/^\d{1,10}$/.test(code)) throw new Error('رمز الحساب يجب أن يكون أرقامًا فقط.');
      if (Acc.account(code)) throw new Error('رمز الحساب مستخدم مسبقًا.');
      const p = parent ? Acc.account(parent) : null;
      if (parent && !p) throw new Error('الحساب الأب غير موجود.');
      if (p && Acc.hasEntries(parent)) throw new Error('لا يمكن إضافة حساب فرعي تحت حساب عليه حركات.');
      const acc = { code, name, parent: parent || null, type: p ? p.type : type, level: p ? p.level + 1 : 1, contra: !!contra };
      S().state.accounts.push(acc);
      S().state.accounts.sort((a, b) => a.code.localeCompare(b.code));
      S().audit('account.create', 'account', code, name);
      return acc;
    },
    hasEntries(code) { return S().state.journals.some(j => j.lines.some(l => l.acc === code)); },

    /** التحقق من القيد قبل الترحيل — يعيد قائمة أخطاء */
    validate(j) {
      const errs = [];
      if (!j.date || !/^\d{4}-\d{2}-\d{2}$/.test(j.date)) errs.push('تاريخ القيد غير صالح.');
      else if (Acc.isPeriodClosed(j.date)) errs.push('الفترة المالية ' + Acc.periodOf(j.date) + ' مقفلة.');
      if (!j.lines || j.lines.length < 2) errs.push('القيد يحتاج سطرين على الأقل.');
      let dr = 0, cr = 0;
      (j.lines || []).forEach((l, i) => {
        const a = Acc.account(l.acc);
        if (!a) errs.push(`السطر ${i + 1}: الحساب ${l.acc} غير موجود.`);
        else if (!Acc.isLeaf(l.acc)) errs.push(`السطر ${i + 1}: الحساب ${a.name} تجميعي ولا يقبل الترحيل.`);
        const d = l.dr || 0, c = l.cr || 0;
        if (!Number.isInteger(d) || !Number.isInteger(c)) errs.push(`السطر ${i + 1}: مبلغ غير صالح.`);
        if (d < 0 || c < 0) errs.push(`السطر ${i + 1}: لا تُقبل المبالغ السالبة.`);
        if ((d > 0) === (c > 0)) errs.push(`السطر ${i + 1}: يجب أن يكون السطر مدينًا أو دائنًا فقط.`);
        dr += d; cr += c;
      });
      if (dr !== cr) errs.push(`القيد غير متوازن: المدين ${M().fmt(dr)} والدائن ${M().fmt(cr)}.`);
      if (dr === 0) errs.push('مجموع القيد صفر.');
      return errs;
    },

    /** ترحيل قيد — المصدر إلزامي (نوع المستند، معرفه، رقمه) */
    post(j) {
      const errs = Acc.validate(j);
      if (errs.length) { const e = new Error(errs.join('\n')); e.errors = errs; throw e; }
      const u = S().user();
      const entry = {
        id: S().uuid(),
        number: 'JV-' + j.date.slice(0, 4) + '-' + String(S().seq('jv.' + j.date.slice(0, 4))).padStart(6, '0'),
        date: j.date, branchId: j.branchId, memo: j.memo || '',
        source: j.source || { type: 'manual', id: null, no: '' },
        userId: j.userId || (u ? u.id : null), postedAt: S().now(), status: 'posted',
        reversalOf: j.reversalOf || null, autoReverse: !!j.autoReverse,
        lines: j.lines.map(l => {
          const o = { acc: l.acc, dr: l.dr || 0, cr: l.cr || 0, branchId: l.branchId || j.branchId };
          if (l.cc) o.cc = l.cc; if (l.party) o.party = l.party; if (l.note) o.note = l.note;
          return o;
        })
      };
      S().state.journals.push(entry);
      S().audit('journal.post', 'journal', entry.id, `${entry.number} ${entry.source.type} ${entry.source.no || ''}`);
      return entry;
    },
    /** عكس قيد بقيد معاكس — لا يُحذف القيد المرحل */
    reverse(journalId, date, memo) {
      const j = S().state.journals.find(x => x.id === journalId);
      if (!j) throw new Error('القيد غير موجود.');
      if (j.reversedBy) throw new Error('القيد معكوس مسبقًا.');
      const r = Acc.post({ date: date || S().today(), branchId: j.branchId, memo: memo || ('عكس ' + j.number),
        source: { type: 'reversal', id: j.id, no: j.number }, reversalOf: j.id,
        lines: j.lines.map(l => ({ acc: l.acc, dr: l.cr, cr: l.dr, cc: l.cc, branchId: l.branchId, party: l.party })) });
      j.reversedBy = r.id;
      return r;
    },

    /** فلترة سطور القيود */
    lines(f) {
      f = f || {};
      const out = [];
      for (const j of S().state.journals) {
        if (f.from && j.date < f.from) continue;
        if (f.to && j.date > f.to) continue;
        if (f.excludeClose && j.source && j.source.type === 'year-close') continue;
        for (const l of j.lines) {
          if (f.branchId && l.branchId !== f.branchId) continue;
          if (f.party && l.party !== f.party) continue;
          if (f.cc && l.cc !== f.cc) continue;
          out.push({ j, l });
        }
      }
      return out;
    },
    /** أرصدة الحسابات النهائية: {code: {dr, cr}} */
    raw(f) {
      const m = {};
      for (const { l } of Acc.lines(f)) {
        const r = m[l.acc] || (m[l.acc] = { dr: 0, cr: 0 });
        r.dr += l.dr; r.cr += l.cr;
      }
      return m;
    },
    /** الرصيد بطبيعة الحساب (موجب = بطبيعته) مع تجميع الأبناء */
    balance(code, f, rawMap) {
      rawMap = rawMap || Acc.raw(f);
      const a = Acc.account(code); if (!a) return 0;
      let dr = 0, cr = 0;
      for (const c in rawMap) if (c === code || Acc.under(c, code)) { dr += rawMap[c].dr; cr += rawMap[c].cr; }
      return DEBIT_NATURE[a.type] ? dr - cr : cr - dr;
    },
    /** رصيد مدين-دائن صافي (موجب مدين) */
    net(code, f, rawMap) {
      rawMap = rawMap || Acc.raw(f);
      let dr = 0, cr = 0;
      for (const c in rawMap) if (c === code || Acc.under(c, code)) { dr += rawMap[c].dr; cr += rawMap[c].cr; }
      return dr - cr;
    },

    trialBalance(f) {
      const open = Acc.raw(Object.assign({}, f, { from: null, to: f && f.from ? prevDay(f.from) : '0000-00-00' }));
      const mov = Acc.raw(f);
      const rows = [];
      let t = { od: 0, oc: 0, md: 0, mc: 0, cd: 0, cc: 0 };
      for (const a of S().state.accounts) {
        if (!Acc.isLeaf(a.code)) continue;
        const o = open[a.code] || { dr: 0, cr: 0 }, m = mov[a.code] || { dr: 0, cr: 0 };
        const on = o.dr - o.cr, cn = on + m.dr - m.cr;
        if (!on && !m.dr && !m.cr) continue;
        const r = { code: a.code, name: a.name, type: a.type,
          od: on > 0 ? on : 0, oc: on < 0 ? -on : 0, md: m.dr, mc: m.cr, cd: cn > 0 ? cn : 0, cc: cn < 0 ? -cn : 0 };
        rows.push(r);
        for (const k in t) t[k] += r[k];
      }
      return { rows, totals: t, balanced: t.cd === t.cc && t.md === t.mc };
    },

    incomeStatement(f) {
      // قائمة الدخل لا تتأثر بقيد الإقفال السنوي إلا عند طلب ذلك صراحة
      const raw = Acc.raw(Object.assign({ excludeClose: true }, f));
      const leafRows = type => S().state.accounts.filter(a => a.type === type && Acc.isLeaf(a.code))
        .map(a => ({ code: a.code, name: a.name, parent: a.parent, amount: Acc.balance(a.code, null, raw) })).filter(r => r.amount !== 0);
      const rev = leafRows('revenue');
      const exp = leafRows('expense');
      const revenue = M().sum(rev, r => r.amount);
      const cogsRows = exp.filter(r => r.code.startsWith('5'));
      const opexRows = exp.filter(r => !r.code.startsWith('5'));
      const cogs = M().sum(cogsRows, r => r.amount);
      const opex = M().sum(opexRows, r => r.amount);
      return { rev, cogsRows, opexRows, revenue, cogs, gross: revenue - cogs, opex, net: revenue - cogs - opex };
    },

    balanceSheet(asOf, branchId) {
      const f = { to: asOf, branchId };
      const raw = Acc.raw(f);
      const sect = type => S().state.accounts.filter(a => a.type === type && Acc.isLeaf(a.code))
        .map(a => ({ code: a.code, name: a.name, amount: Acc.balance(a.code, null, raw) })).filter(r => r.amount !== 0);
      const assets = sect('asset'), liabilities = sect('liability'), equity = sect('equity');
      const yearStart = asOf.slice(0, 4) + '-01-01';
      const closed = (S().state.closedYears || []);
      // أرباح السنوات غير المقفلة تظهر كأرباح جارية
      const isAll = Acc.incomeStatement({ to: asOf, branchId, excludeClose: false });
      const ta = M().sum(assets, r => r.amount), tl = M().sum(liabilities, r => r.amount), te = M().sum(equity, r => r.amount);
      const current = isAll.net;
      return { assets, liabilities, equity, currentEarnings: current, totalAssets: ta, totalLiabilities: tl,
        totalEquity: te + current, balanced: ta === tl + te + current, yearStart, closed };
    },

    /** قائمة التدفقات النقدية (الطريقة المباشرة) — النقدية = الصناديق + البنوك */
    cashFlow(f) {
      const cashCodes = S().state.accounts.filter(a => Acc.isLeaf(a.code) && (Acc.under(a.code, '1101') || Acc.under(a.code, '1102'))).map(a => a.code);
      const isCash = c => cashCodes.includes(c);
      const cat = { operating: 0, investing: 0, financing: 0 };
      const detail = {};
      const opening = Acc.lines({ to: f.from ? prevDay(f.from) : '0000-00-00', branchId: f.branchId }).reduce((s, { l }) => isCash(l.acc) ? s + l.dr - l.cr : s, 0);
      for (const j of S().state.journals) {
        if (f.from && j.date < f.from) continue; if (f.to && j.date > f.to) continue;
        const ls = j.lines.filter(l => !f.branchId || l.branchId === f.branchId);
        const delta = ls.filter(l => isCash(l.acc)).reduce((s, l) => s + l.dr - l.cr, 0);
        if (!delta) continue;
        const other = ls.filter(l => !isCash(l.acc));
        if (!other.length) continue; // تحويل بين حسابات نقدية
        const big = other.reduce((a, b) => (a.dr + a.cr) >= (b.dr + b.cr) ? a : b);
        let c = 'operating';
        if (big.acc.startsWith('12')) c = 'investing';
        else if (big.acc.startsWith('3') || big.acc.startsWith('22')) c = 'financing';
        cat[c] += delta;
        const key = c + '|' + (j.source.type || 'manual');
        detail[key] = (detail[key] || 0) + delta;
      }
      const net = cat.operating + cat.investing + cat.financing;
      return { opening, ...cat, net, closing: opening + net, detail };
    },

    /** دفتر الأستاذ لحساب مع الرصيد الجاري */
    ledger(code, f) {
      const a = Acc.account(code);
      const match = c => c === code || Acc.under(c, code);
      let run = 0;
      const open = Acc.lines(Object.assign({}, f, { from: null, to: f.from ? prevDay(f.from) : '0000-00-00' }))
        .reduce((s, { l }) => match(l.acc) ? s + l.dr - l.cr : s, 0);
      run = open;
      const rows = Acc.lines(f).filter(x => match(x.l.acc))
        .sort((x, y) => (x.j.date + x.j.number).localeCompare(y.j.date + y.j.number))
        .map(({ j, l }) => { run += l.dr - l.cr; return { date: j.date, number: j.number, memo: l.note || j.memo, source: j.source, dr: l.dr, cr: l.cr, balance: run, jid: j.id, acc: l.acc }; });
      return { account: a, opening: open, rows, closing: run };
    },

    closePeriod(id) {
      let p = S().state.periods.find(x => x.id === id);
      if (!p) { p = { id, status: 'open' }; S().state.periods.push(p); }
      p.status = 'closed'; p.closedAt = S().now(); p.closedBy = S().user() && S().user().id;
      S().audit('period.close', 'period', id, '');
    },
    reopenPeriod(id) {
      const p = S().state.periods.find(x => x.id === id);
      if (!p) return; if ((S().state.closedYears || []).includes(id.slice(0, 4))) throw new Error('السنة المالية مقفلة.');
      p.status = 'open'; S().audit('period.reopen', 'period', id, '');
    },
    /** الإقفال السنوي: ترحيل الإيرادات والمصروفات إلى الأرباح المبقاة */
    closeYear(year, branchId) {
      const map = S().state.settings.accounts;
      const to = year + '-12-31';
      const raw = Acc.raw({ from: year + '-01-01', to });
      const lines = [];
      for (const code in raw) {
        const a = Acc.account(code); if (!a || (a.type !== 'revenue' && a.type !== 'expense')) continue;
        const n = raw[code].dr - raw[code].cr; if (!n) continue;
        // نعكس الرصيد
        lines.push(n > 0 ? { acc: code, cr: n } : { acc: code, dr: -n });
      }
      if (!lines.length) throw new Error('لا توجد أرصدة إيرادات أو مصروفات للسنة ' + year);
      const dr = M().sum(lines, l => l.dr || 0), cr = M().sum(lines, l => l.cr || 0);
      if (dr > cr) lines.push({ acc: map.retained, cr: dr - cr }); else if (cr > dr) lines.push({ acc: map.retained, dr: cr - dr });
      const j = Acc.post({ date: to, branchId: branchId || S().state.branches[0].id, memo: 'قيد الإقفال السنوي ' + year, source: { type: 'year-close', id: year, no: 'YC-' + year }, lines });
      S().state.closedYears = (S().state.closedYears || []).concat(year);
      S().audit('year.close', 'period', year, j.number);
      return j;
    }
  };

  function prevDay(d) { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() - 1); return S().today(x); }
  Acc.prevDay = prevDay;

  Florix.Acc = Acc;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* FLORIX فلوريكس — محرك المخزون: الحركات، التكلفة (متوسط مرجح / FIFO)، الدفعات والصلاحية
 * الرصيد لا يُخزن كرقم قابل للتعديل؛ يُشتق دائمًا من حركات المخزون.
 */
(function (root) {
  'use strict';
  const Florix = root.Florix = root.Florix || {};
  const S = () => Florix.Store;
  const M = () => Florix.Money;

  let cache = null; // key -> {qty, value, layers:[{qty, unit, batch, expiry, date}]}
  const key = (pid, wh) => pid + '|' + wh;

  function cell(pid, wh) {
    const k = key(pid, wh);
    return cache[k] || (cache[k] = { qty: 0, value: 0, layers: [] });
  }
  const round3 = q => Math.round(q * 1000) / 1000;

  function applyIn(c, qty, totalCost, batch, expiry, date) {
    c.qty = round3(c.qty + qty); c.value += totalCost;
    c.layers.push({ qty, unit: qty ? totalCost / qty : 0, batch: batch || null, expiry: expiry || null, date });
  }
  /** يسحب كمية من الطبقات ويعيد التكلفة حسب السياسة */
  function applyOut(c, qty, method, fallbackUnit) {
    let fifoCost = 0, left = qty; const batches = [];
    // ترتيب الطبقات: الأقدم صلاحية أولًا إن وجدت، ثم الأقدم إدخالًا
    c.layers.sort((a, b) => (a.expiry || '9999') .localeCompare(b.expiry || '9999') || a.date.localeCompare(b.date));
    while (left > 1e-9 && c.layers.length) {
      const L = c.layers[0]; const take = Math.min(L.qty, left);
      fifoCost += take * L.unit; L.qty = round3(L.qty - take); left = round3(left - take);
      if (L.batch) batches.push({ batch: L.batch, qty: take });
      if (L.qty <= 1e-9) c.layers.shift();
    }
    if (left > 1e-9) fifoCost += left * fallbackUnit; // سحب بالسالب عند السماح
    let cost;
    if (method === 'FIFO') cost = Math.round(fifoCost);
    else {
      const avg = c.qty > 0 ? c.value / c.qty : fallbackUnit;
      cost = qty >= c.qty && c.qty > 0 ? c.value : Math.round(avg * qty);
    }
    c.qty = round3(c.qty - qty); c.value -= cost;
    if (c.qty <= 1e-9 && c.qty >= -1e-9) { c.qty = 0; c.value = 0; c.layers = []; }
    return { cost, batches };
  }

  const Inv = {
    method() { return S().state.settings.costMethod || 'WAC'; },
    rebuild() {
      cache = {};
      const ms = S().state.stockMoves.slice().sort((a, b) => (a.date + a.seq).localeCompare(b.date + b.seq));
      for (const m of ms) {
        const c = cell(m.pid, m.wh);
        if (m.qty > 0) applyIn(c, m.qty, m.cost, m.batch, m.expiry, m.date);
        else {
          // عند إعادة البناء نستخدم التكلفة المسجلة لضمان مطابقة القيود
          const r = applyOut(c, -m.qty, Inv.method(), 0);
          c.value += r.cost - (-m.cost); // تصحيح القيمة لتطابق التكلفة المرحلة
        }
      }
    },
    ensure() { if (!cache) Inv.rebuild(); },
    invalidate() { cache = null; },

    onHand(pid, wh) { Inv.ensure(); const c = cache[key(pid, wh)]; return c ? c.qty : 0; },
    valueOf(pid, wh) { Inv.ensure(); const c = cache[key(pid, wh)]; return c ? c.value : 0; },
    whsOfBranch(branchId) { return S().state.warehouses.filter(w => !branchId || w.branchId === branchId).map(w => w.id); },
    onHandBranch(pid, branchId) { return round3(Inv.whsOfBranch(branchId).reduce((s, w) => s + Inv.onHand(pid, w), 0)); },
    avgCost(pid, wh) { Inv.ensure(); const c = cache[key(pid, wh)]; if (c && c.qty > 0) return Math.round(c.value / c.qty); const p = S().get('products', pid); return p ? p.cost : 0; },
    batches(pid, wh) { Inv.ensure(); const c = cache[key(pid, wh)]; return c ? c.layers.filter(l => l.qty > 0).map(l => ({ ...l })) : []; },
    totalValue(branchId) {
      Inv.ensure(); const whs = Inv.whsOfBranch(branchId); let v = 0;
      for (const k in cache) { const wh = k.split('|')[1]; if (whs.includes(wh)) v += cache[k].value; }
      return v;
    },
    reserved(pid, branchId) {
      return round3(S().state.salesOrders.filter(o => o.status === 'open' && (!branchId || o.branchId === branchId))
        .reduce((s, o) => s + o.lines.filter(l => l.pid === pid).reduce((a, l) => a + l.qty, 0), 0));
    },
    inTransit(pid, branchId) {
      return round3(S().state.transfers.filter(t => t.status === 'in_transit' && (!branchId || S().get('warehouses', t.toWh).branchId === branchId))
        .reduce((s, t) => s + t.lines.filter(l => l.pid === pid).reduce((a, l) => a + l.qty, 0), 0));
    },
    damaged(pid, branchId) {
      const whs = Inv.whsOfBranch(branchId);
      return round3(-S().state.stockMoves.filter(m => m.type === 'damage' && m.pid === pid && whs.includes(m.wh)).reduce((s, m) => s + m.qty, 0));
    },

    _push(m) {
      m.id = S().uuid(); m.seq = String(S().seq('mv')).padStart(9, '0');
      const u = S().user(); if (u) m.userId = u.id;
      if (!m.batch) delete m.batch; if (!m.expiry) delete m.expiry;
      S().state.stockMoves.push(m);
      return m;
    },
    /** إدخال مخزون بتكلفة إجمالية */
    receive({ pid, wh, qty, cost, type, ref, date, batch, expiry }) {
      if (!(qty > 0)) throw new Error('كمية الإدخال يجب أن تكون أكبر من صفر.');
      Inv.ensure();
      applyIn(cell(pid, wh), qty, cost, batch, expiry, date);
      return Inv._push({ pid, wh, qty, cost, type, ref, date, batch: batch || null, expiry: expiry || null });
    },
    /** صرف مخزون — يعيد التكلفة المحسوبة */
    issue({ pid, wh, qty, type, ref, date, allowNegative }) {
      if (!(qty > 0)) throw new Error('كمية الصرف يجب أن تكون أكبر من صفر.');
      Inv.ensure();
      const p = S().get('products', pid);
      const c = cell(pid, wh);
      if (!p.service && c.qty + 1e-9 < qty && !(allowNegative || S().state.settings.allowNegativeStock)) {
        throw new Error(`الكمية المتاحة من «${p.nameAr}» هي ${M().fmtQty(c.qty)} فقط.`);
      }
      const r = applyOut(c, qty, Inv.method(), p.cost);
      const m = Inv._push({ pid, wh, qty: -qty, cost: -r.cost, type, ref, date, batch: r.batches.length === 1 ? r.batches[0].batch : (r.batches.length ? 'متعدد' : null) });
      return { cost: r.cost, move: m };
    },
    /** حركة الصنف مع الرصيد الجاري */
    card(pid, whs) {
      let run = 0;
      return S().state.stockMoves.filter(m => m.pid === pid && (!whs || whs.includes(m.wh)))
        .sort((a, b) => (a.date + a.seq).localeCompare(b.date + b.seq))
        .map(m => { run = round3(run + m.qty); return { ...m, balance: run }; });
    },
    belowMin(branchId) {
      return S().state.products.filter(p => p.active !== false && !p.service).map(p => ({ p, qty: Inv.onHandBranch(p.id, branchId) }))
        .filter(x => x.qty <= (x.p.min || 0));
    },
    expiring(days, branchId) {
      const lim = new Date(S().nowDate().getTime() + days * 86400000); const limS = S().today(lim);

      for (const w of S().state.warehouses.filter(w => !branchId || w.branchId === branchId))
        for (const p of S().state.products) for (const b of Inv.batches(p.id, w.id)) if (b.expiry && b.expiry <= limS) out.push({ p, w, ...b });
      return out.sort((a, b) => a.expiry.localeCompare(b.expiry));
    }
  };

  Florix.Inv = Inv;
})(typeof window !== 'undefined' ? window : globalThis);
